/* 这一屏的合计必须等于概况里的「支出」，否则占大头的固定支出就被藏起来了。
   固定支出和还贷是声明出来的，没有分类，所以各自成一块。 */
/* ￥25 四舍五入是 0%，显示成「0%」会像坏掉 */
const pctLabel = (v, total) => {
  const pct = (v / total) * 100;
  return pct > 0 && pct < 0.5 ? "<1%" : Math.round(pct) + "%";
};

/* 固定的那几行：灰一点，带「固定」标记，未来的日子标「预计」 */
function passiveRow(x, m) {
  const future = m === thisMonth() && x.date > today();
  /* 转存不带 +/− 号 —— 它不是收也不是支，只是换了个账户 */
  const amount = x.xfer ? "→ " + yuan(x.amount)
    : x.fixed === "in" ? plus(x.amount) : neg(x.amount);
  return '<div class="row" data-a="' + x.tap + '" style="cursor:pointer;opacity:' +
    (future ? ".55" : ".8") + '">' +
    '<div style="flex:1;min-width:0"><div style="font-size:15px;color:var(--ink)">' +
    '<span class="chip flat" style="padding:1px 8px;font-size:11px;border-style:dashed">' +
    (x.xfer ? t("px.transfer") : t("px.fixed")) + "</span> " + esc(x.name) + "</div>" +
    '<div class="sub" style="font-size:11px">' +
    (future ? t("px.expected") : x.xfer ? t("px.savingNotSpend") : "") + "</div></div>" +
    '<div class="money" style="font-size:15px;color:var(--ink-muted)">' + amount + "</div>" +
    '<span style="color:var(--ink-faint)">' + ic("chev", 15) + "</span></div>";
}

function breakdownOver(months, kind) {
  const map = new Map();
  const add = (k, v) => { if (v > 0) map.set(k, (map.get(k) || 0) + v); };
  months.forEach(() => {
    if (kind === "in") S.fixedIn.forEach((x) => add(x.name, x.amount));
    else {
      add(t("word.fixedOut"), S.fixedOut.reduce((a, x) => a + x.amount, 0));
      add(t("word.debtLong"), debtCommit(S));
    }
  });
  const want = kind;                    // t.type 现在就是 "in" / "out"
  S.tx.filter((t) => t.type === want && months.includes(monthOf(t.date)))
    .forEach((t) => add(catLabel(t.category), t.amount));
  return [...map.entries()].sort((a, b) => b[1] - a[1]);
}
const breakdownOf = (m, kind) => breakdownOver([m], kind);
const outgoBreakdown = (m) => breakdownOf(m, "out");

/* 小于这个比例的并成「其他」—— 否则 <1% 的切片和它的标签会糊在一起 */
const SLICE_FLOOR = 0.03;
function foldSmall(rows) {
  const total = rows.reduce((a, c) => a + c[1], 0) || 1;
  const keep = rows.filter((r) => r[1] / total >= SLICE_FLOOR);
  const rest = rows.filter((r) => r[1] / total < SLICE_FLOOR);
  if (!rest.length) return keep;
  const lump = rest.reduce((a, r) => a + r[1], 0);
  const other = t("pie.other");
  const i = keep.findIndex((r) => r[0] === other);
  if (i >= 0) { keep[i] = [other, keep[i][1] + lump]; return keep.sort((a, b) => b[1] - a[1]); }
  return keep.concat([[other, lump]]);
}

/* 环形图自己带标签：左右两列分栏排，用引线连到切片，天生不会重叠。
   整块是固定高度，所以切「支出 / 收入」时页面不会跳。 */
function labeledDonut(rows, kind) {
  /* r 是路径半径，环的外沿是 r + th/2 —— 引线和标签都要从外沿算，
     否则标签会压在环上（第一版就压了） */
  const W = 302, H = 268, cx = W / 2, cy = H / 2, r = 46, th = 18;
  const OUT = r + th / 2;
  const total = rows.reduce((a, c) => a + c[1], 0) || 1;
  const C = 2 * Math.PI * r;
  let off = 0;
  const segs = [], labels = { left: [], right: [] };
  rows.forEach(([name, v], i) => {
    const len = (v / total) * C;
    const mid = off + len / 2;
    const draw = Math.max(0.6, len - (rows.length > 1 ? 2 : 0));
    segs.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' +
      RAMP[Math.min(i, RAMP.length - 1)] + '" stroke-width="' + th +
      '" stroke-dasharray="' + draw.toFixed(2) + " " + (C - draw).toFixed(2) +
      '" stroke-dashoffset="' + (-off).toFixed(2) + '"></circle>');
    const ang = (mid / C) * Math.PI * 2 - Math.PI / 2;
    const side = Math.cos(ang) >= 0 ? "right" : "left";
    labels[side].push({ name, v, i, ang });
    off += len;
  });
  const leaders = [], texts = [];
  ["left", "right"].forEach((side) => {
    const list = labels[side].sort((a, b) => Math.sin(a.ang) - Math.sin(b.ang));
    const n = list.length;
    list.forEach((L, k) => {
      /* 一侧只有一个标签时按它自己的角度放；多个就均匀分栏，天生不重叠 */
      const y = n === 1
        ? Math.max(30, Math.min(H - 30, cy + (OUT + 20) * Math.sin(L.ang)))
        : 30 + ((H - 60) / (n - 1)) * k;
      const ex = side === "right" ? cx + OUT + 12 : cx - OUT - 12;
      const tx = side === "right" ? W - 4 : 4;
      leaders.push('<path d="M' + (cx + (OUT + 3) * Math.cos(L.ang)).toFixed(1) + " " +
        (cy + (OUT + 3) * Math.sin(L.ang)).toFixed(1) + "L" + ex.toFixed(1) + " " + y.toFixed(1) +
        "H" + (side === "right" ? tx - 2 : tx + 2) + '" fill="none" stroke="var(--ink-faint)" ' +
        'stroke-width="1"></path>');
      texts.push('<text x="' + tx + '" y="' + (y - 3) + '" text-anchor="' +
        (side === "right" ? "end" : "start") + '" font-size="12.5" font-weight="600" ' +
        'fill="var(--ink)">' + esc(L.name) + "</text>" +
        '<text x="' + tx + '" y="' + (y + 12) + '" text-anchor="' +
        (side === "right" ? "end" : "start") + '" font-size="10" fill="var(--ink-muted)">' +
        pctLabel(L.v, total) + " · " + yuan(L.v) + "</text>");
    });
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" ' +
    'style="display:block;font-family:inherit">' +
    '<g transform="rotate(-90 ' + cx + " " + cy + ')">' + segs.join("") + "</g>" +
    leaders.join("") + texts.join("") +
    '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="11" ' +
    'fill="var(--ink-muted)">' + t(kind === "in" ? "word.income" : "word.spending") + "</text>" +
    '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="13" ' +
    'font-weight="600" fill="var(--ink)">' + yuan(total) + "</text></svg>";
}

SHEETS.cats = () => {
  const kind = ui.seg.cats || "out";
  const months = isYear() ? activeMonths(viewYear()) : [viewMonth()];
  const rows = foldSmall(breakdownOver(months, kind));
  const toggle = '<div class="seg" style="border-width:1px;border-radius:999px;overflow:hidden">' +
    [[t("word.spending"), "out"], [t("word.income"), "in"]].map(([l, v]) =>

const app = document.getElementById("app");
const num = (v) => toCents(v);
const days = (fromMs) => Math.max(1, Math.round((now().getTime() - fromMs) / 86400e3));
function removeWish(wishId) { S.wishlist = S.wishlist.filter((w) => w.id !== wishId); }
function dropJar(name) {
  const j = jar(name);
  if (j && j.balance === 0) S.accounts = S.accounts.filter((a) => a.name !== name);
}
function finalizeBuy(p) {
  const j = jar(p.jar);
  if (j) j.balance -= p.target;
  dropJar(p.jar);
  p.status = "bought";
  S.archive.unshift({ name: p.name, price: p.target, outcome: "bought", date: today(),
    note: "ar.soldFor", noteArgs: { n: p.sales.length, days: days(p.startedAt) } });
  removeWish(p.wishId);
  ui.seg.wish = "done";
  ui.stack = ["decisions", "wishlist"];
  ui.sheet = null; ui.f = {};
  toast(t("k.boughtNoLedger"));
}

function validDebt() {
  const description = (ui.f.description || "").trim(), monthly = num(ui.f.monthly);
  const months = parseInt(ui.f.months, 10) || 0;
  const day = parseInt(ui.f.day, 10);
  const account = ui.f.account || (S.accounts.find((a) => !a.earmark) || {}).name;
  if (!description) { ui.f.err = t("e.descEmpty"); return null; }
  if (!(monthly > 0)) { ui.f.err = t("e.monthlyPos"); return null; }
  if (months < 0 || months > 1200) { ui.f.err = t("e.terms"); return null; }
  if (!account) { ui.f.err = t("e.needAccount"); return null; }
  if (!(day >= 1 && day <= 31)) { ui.f.err = t("e.day"); return null; }
  return { description, monthly, months, account,
    auto: ui.f.auto === true || ui.f.auto === "auto", day };
}

function validGoal() {
  const name = (ui.f.name || "").trim(), target = num(ui.f.target);
  const months = parseInt(ui.f.months, 10);
  const day = parseInt(ui.f.day, 10);
  const account = ui.f.account || (S.accounts.find((a) => !a.earmark) || {}).name;
  if (!name) { ui.f.err = t("e.goalNeedsName"); return null; }
  if (!(target > 0)) { ui.f.err = t("e.targetPos"); return null; }
  if (!(months >= 0 && months <= 1200)) { ui.f.err = t("e.goalMonths"); return null; }
  if (!account) { ui.f.err = t("e.needAccount"); return null; }
  if (!(day >= 1 && day <= 31)) { ui.f.err = t("e.day"); return null; }
  return { name, target, months, account, auto: ui.f.auto === true || ui.f.auto === "auto", day };
}

function validFixed() {
  const name = (ui.f.name || "").trim(), amt = num(ui.f.amount);
  const day = parseInt(ui.f.day, 10);
  if (!name) { ui.f.err = t("e.needLabel"); return null; }
  if (!(amt > 0)) { ui.f.err = t("e.amountPos"); return null; }
  if (!(day >= 1 && day <= 31)) { ui.f.err = t("e.day"); return null; }
  return { name, amount: amt, day };
}

const ACT = {
  /* 分区页是 go() 进来的，栈里只有一层 —— 那就退回首页 */
  back: () => { if (ui.stack.length > 1) pop(); else go("dashboard"); },
  close: () => close(),
  dashboard: () => go("dashboard"),
  jars: () => go("jars"),
  decisions: () => go("decisions"),
  route: (segv) => { if (segv) ui.seg.route = segv; go("route"); },
  toSavings2: () => { ui.seg.jars = "savings"; go("jars"); },
  settings: () => push("settings"),
  wishlist: () => push("wishlist"),
  verdict: () => push("verdict"),
  toQuiz: () => { const it = ui.f.parsed.item;
    ui.quiz = { name: it.name, price: it.price, necessity: it.necessity, dup: it.dup };
    ui.sheet = null; ui.stack = ["decisions"]; render(); },
  tab: (t) => { ui.navOpen = false; go(t); },
  nav: () => { ui.navOpen = !ui.navOpen; render(); },
  seg: (a) => { const [k, v] = a.split(":");
    if (k === "mode") S.saveMode = v === "save";
    else if (k === "txtype") ui.f.type = v;
    else if (k === "jarmode") { ui.f.mode = v; ui.f.err = null; }
    else if (k === "goalauto" || k === "debtauto") { ui.f.auto = v === "auto";
      ui.f.err = null; }
    else ui.seg[k] = v;
    render(); },
  cool: (h) => { S.cooldownHours = +h; render(); },
  cur: (k) => { S.currency = k; render(); toast(t("k.currencyNow", { code: k })); },
  theme: (k) => { S.theme = k; applyTheme(); render(); },
  skin: (k) => { S.skin = k; applySkin(); render(); },
  hideBal: () => { ui.hideBal = !ui.hideBal; render(); },
  /* 账本卡头的三个键。筛选菜单开着的时候再点一次就收起来。 */
  txSearch: () => { ui.txSearch = !ui.txSearch; if (!ui.txSearch) ui.txq = "";
    ui.txFilter = false; render();
    if (ui.txSearch) { const i = app.querySelector('.sbar input'); if (i) i.focus(); } },
  txFilter: () => { ui.txFilter = !ui.txFilter; render(); },
  txF: (k) => { ui.txF = k; ui.txFilter = false; render(); },
  analytics: () => push("analytics"),
  /* 换语言时顺手把币种也换成常见的那个，省得英文界面配 ￥ */
  lang: (k) => { S.lang = k;
    if (k === "en" && S.currency === "CNY") S.currency = "GBP";
    if (k === "zh" && S.currency !== "CNY") S.currency = "CNY";
    render(); },
  qdup: () => { ui.quiz.dup = !ui.quiz.dup; render(); },
  tooSoon: () => toast(t("k.tooSoon")),

  /* 助手 */
  /* 从打字那张切过去时把已经打的字带上，别让人白打 */
  assistant: () => { micStop();
    const kept = ui.sheet === "jot" ? (ui.f.text || "") : "";
    sheet("assistant", { text: kept }); },
  mic: () => micStart(),
  /* 重录：把这一轮说的丢掉，重新开口 */
  redo: () => { micStop(); ui.f.text = ""; ui.f.err = null; micStart(); },
  jot: () => { micStop(); sheet("jot", { text: "" }); focusJot(); },
  /* 左下那颗「更多」：先拿解析器猜一遍，能猜到就把表单填好，猜不到
     至少把这句话放进描述里 —— 这一步是「要更多细节」，不是从头再来。 */
  detail: () => {
    const said = (ui.f.text || "").trim();
    const p = said ? (parseUtterance(said) || parseUtterance(fixByHistory(said))) : null;
    const d = p && (p.intent === "ledger" || p.intent === "multi_ledger")
      ? p.drafts[0] : null;
    pushSheet("addTx", d
      ? { type: d.type, amount: (d.amount / 100).toFixed(2), category: d.category,
          description: d.description, date: d.date }
      : { type: "out", category: "food", description: said,
          date: isThisMonth() ? today() : lastDayOf(viewMonth()) });
  },
  popSheet: () => popSheet(),
  shoot: () => { ui.f.err = t("as.shootSoon"); render(); },
  editDraft: (i) => { const d = ui.f.parsed.drafts[+i];
    pushSheet("editDraft", { i: +i, type: d.type, amount: (d.amount / 100).toFixed(2),
      category: d.category, description: d.description, date: d.date }); },
  submitEditDraft: () => {
    const amt = num(ui.f.amount);
    if (!(amt > 0)) { ui.f.err = t("e.amountPos"); return render(); }
    if (!(ui.f.description || "").trim()) { ui.f.err = t("e.descEmpty"); return render(); }
    const i = ui.f.i, patch = { type: ui.f.type, amount: amt, category: ui.f.category,
      description: ui.f.description.trim(), date: ui.f.date };
    const back = ui.fStack[ui.fStack.length - 1];
    Object.assign(back.f.parsed.drafts[i], patch);
    popSheet(); },
  dropDraft: () => {
    const i = ui.f.i, back = ui.fStack[ui.fStack.length - 1];
    back.f.parsed.drafts.splice(i, 1);
    if (!back.f.parsed.drafts.length) { close(); return toast(t("k.allDropped")); }

  parse: () => { const said = (ui.f.text || "").trim();

    /* 原句解析不出来时才拿历史词表纠一次错 —— 这样它只可能帮忙，不会帮倒忙 */
    const p = parseUtterance(said) || parseUtterance(fixByHistory(said));
    if (!p) { ui.f.err = t("e.notUnderstood"); return render(); }
    ui.f.parsed = p; ui.f.err = null; render(); },
  commit: () => {
    const p = ui.f.parsed;
    if (p.intent === "ledger" || p.intent === "multi_ledger") {
      if (p.drafts.some((d) => d.amount <= 0)) { ui.f.err = t("e.amountPos"); return render(); }
      p.drafts.forEach((d) => S.tx.push(Object.assign({ id: id() }, d)));
      S.aiUses = (S.aiUses || 0) + 1;
      const o = p.drafts.filter((d) => d.type === "out").reduce((a, d) => a + d.amount, 0);
      const i2 = p.drafts.filter((d) => d.type === "in").reduce((a, d) => a + d.amount, 0);
      close(); return toast(t("k.loggedN", { n: p.drafts.length,
        sum: [o ? t("word.spending") + " " + yuan(o) : "",
          i2 ? t("word.income") + " " + yuan(i2) : ""].filter(Boolean).join(" · ") }));
    }
    if (p.intent === "transfer") {
      const f = jar(p.move.from), to = jar(p.move.to);
      if (!f) { ui.f.err = t("e.jarMissing", { name: p.move.from }); return render(); }
      if (f.earmark) { ui.f.err = t("e.jarLocked", { name: f.name }); return render(); }
      if (p.move.amount <= 0) { ui.f.err = t("e.amountPos"); return render(); }
      if (f.balance < p.move.amount) {
        ui.f.err = t("e.notEnough", { name: f.name, has: yuan(f.balance),
          short: yuan(p.move.amount - f.balance) }); return render(); }
      if (!to) S.accounts.push({ name: p.move.to, balance: 0, earmark: null });
      f.balance -= p.move.amount; jar(p.move.to).balance += p.move.amount;
      close(); return toast(t("k.moved", { from: f.name, to: p.move.to }));
    }
    if (p.intent === "deposit") {
      if (p.move.amount <= 0) { ui.f.err = t("e.amountPos"); return render(); }
      if (!jar(p.move.to)) S.accounts.push({ name: p.move.to, balance: 0, earmark: null });
      jar(p.move.to).balance += p.move.amount;
      close(); return toast(t("k.deposited", { to: p.move.to }));
    }
    if (p.intent === "goal") {
      if (p.goal.target <= 0) { ui.f.err = t("e.targetPos"); return render(); }
      S.goals.push({ id: id(), name: p.goal.name, target: p.goal.target,
        months: p.goal.months, saved: 0 });
      close(); return toast(t("k.goalCreated", { name: p.goal.name }));
    }
    if (p.intent === "debt") {
      if (p.debt.monthly <= 0) { ui.f.err = t("e.monthlyPos"); return render(); }
      S.debts.push({ id: id(), description: p.debt.description, monthly: p.debt.monthly });
      close(); return toast(t("k.debtBound"));
    }
  },

    const pl = { id: id(), wishId: w.id, name: w.name, target: w.price, jar: jarName,
      raised: 0, sales: [], necessityThen: w.necessity, status: "active",
      startedAt: now().getTime() };
    S.plans.push(pl); w.planId = pl.id;
    ui.wishId = w.id; ui.sheet = null; ui.f = {};
    ui.stack = ["decisions", "wishlist", "wishItem"];
    toast(t("k.planStarted")); },
  logSale: () => sheet("logSale", { planId: (curPlan() || {}).id }),
  submitSale: () => {
    const amt = num(ui.f.amount), plans = activePlans();
    const pl = ui.f.planId
      ? (plans.find((x) => x.id === ui.f.planId) || plans.find((x) => x.name === ui.f.planId))
      : (curPlan() || plans[0]);
    if (!(ui.f.name || "").trim()) { ui.f.err = t("e.soldWhat"); return render(); }
    if (!(amt > 0)) { ui.f.err = t("e.amountPos"); return render(); }
    pl.sales.push({ name: ui.f.name.trim(), amount: amt, date: today() });
    pl.raised += amt; jar(pl.jar).balance += amt;
    ui.wishId = pl.wishId; close();
    toast(pl.raised >= pl.target ? t("k.planFull")
      : t("k.planLeft", { amt: yuan(pl.target - pl.raised) })); },
  planBuy: () => { const pl = curPlan(), sp = pl.raised - pl.target;
    if (sp > 0) sheet("surplus", { amount: sp, to: jarOpts()[0] });
    else { finalizeBuy(pl); render(); } },
  submitSurplus: () => { const pl = curPlan();
    jar(pl.jar).balance -= ui.f.amount; jar(ui.f.to).balance += ui.f.amount;
    finalizeBuy(pl); render(); },
  planAbandon: () => { const pl = curPlan();
    sheet("toSavings", { amount: pl.raised, count: pl.sales.length, to: jarOpts()[0] }); },
  submitAbandon: () => { const pl = curPlan(), amt = pl.raised;
    if (amt > 0) { jar(pl.jar).balance -= amt; jar(ui.f.to).balance += amt; }
    dropJar(pl.jar);
    pl.status = "abandoned";
    S.archive.unshift({ name: pl.name, price: pl.target, outcome: "dropped", date: today(),
      note: amt > 0 ? "ar.planToSavings" : "ar.planNeverStarted",
      noteArgs: { amt: yuan(amt) } });
    removeWish(pl.wishId);
    ui.seg.wish = "done"; ui.stack = ["decisions", "wishlist"]; ui.sheet = null; ui.f = {};
    toast(amt > 0 ? t("k.planToSavings", { amt: yuan(amt) }) : t("k.planDropped")); },
  /* 计划还在跑，但现在就想掏钱买 */
  buyDuringPlan: () => { const pl = curPlan();
    if (pl.raised > 0) sheet("cashBuy", { amount: pl.raised, to: jarOpts()[0] });
    else ACT.doCashBuy(); },
  submitCashBuy: () => { const pl = curPlan();
    jar(pl.jar).balance -= ui.f.amount; jar(ui.f.to).balance += ui.f.amount;
    ACT.doCashBuy(); },
  doCashBuy: () => { const w = curWish(), pl = curPlan();
    if (pl) { dropJar(pl.jar); pl.status = "abandoned"; }
    S.tx.push({ id: id(), type: "out", amount: w.price, category: "shopping",
      description: t("wi.clearedDesc", { name: w.name }), date: today() });
    S.archive.unshift({ name: w.name, price: w.price, outcome: "bought", date: today(),
      note: pl && pl.raised > 0 ? "ar.boughtEarly" : "ar.boughtOutright",
      noteArgs: pl ? { amt: yuan(pl.raised) } : null });
    removeWish(w.id);
    ui.seg.wish = "done"; ui.stack = ["decisions", "wishlist"]; ui.sheet = null; ui.f = {};
    toast(t("k.boughtLedgerNotPlan")); },
};

/* ==========================================================================
   7. 渲染 / 输入 / 启动
   ========================================================================== */
/* 图标本身就说明了去哪，胶囊里塞文字会挤 —— 选中态靠那圈浅底和放大表示 */
/* 底栏按样机：说一句 · 点阵 · [返回] · 记一笔。
   四个分区不再常驻，收进点阵那颗按钮后面的扇形里。
   两套皮肤共用这一套结构 —— 奶油纸现在是这个版式的一次换色，不是另一套版式。 */
function dockHtml(tab, fab) {
  /* 底栏两种状态，就地互换，不弹浮层：
       默认 —— 四个分区分坐两颗药丸里（稿子的默认态就是这个）
       点中间那颗 —— 换成 说一句 · 记一笔，点阵变深
     ui.navOpen 为真 = 露出那两颗动作键。 */
  const secs = TABS();
  const half = (from, to) => '<div class="navpill">' +
    secs.slice(from, to).map(([i, l, k]) =>
      '<div class="navb' + (k === tab ? " on" : "") + '" data-a="tab:' + k +
      '" title="' + esc(l) + '">' + ic(i, 22) + "</div>").join("") + "</div>";
  const acts = ui.navOpen;                 /* true = 露出说一句 / 记一笔 */
  return '<div class="dock">' +
    (acts
      ? (fab ? '<div class="act dark" data-a="assistant">' + ic("mic", 17) +
          "<span>" + t("as.speak") + "</span></div>" : '<div class="act ghost"></div>')
      : half(0, 2)) +
    '<div class="gridb' + (acts ? " open" : "") + '" data-a="nav" title="' +
    esc(t("nav.sections")) + '">' + ic("dots", 17) + "</div>" +
    (acts
      ? '<div class="act" data-a="jot">' + ic("plus", 17) +
        "<span>" + t("word.addOne") + "</span></div>"
      : half(2, 4)) +
    "</div>";
}

/* 自动扣款的目标，到了日子就自己把这个月记上（幂等）。真实实现里这是后端的定时任务。 */
function settleAutoGoals() {
  const m = thisMonth();
  S.debts.forEach((d) => {
    if (!d.auto || !d.marks || d.marks[m]) return;
    if (+today().slice(8) < d.day) return;
    d.marks[m] = { k: "auto", amt: d.monthly };
  });
  S.goals.forEach((g) => {
    if (!g.auto || g.marks[m]) return;
    if (+today().slice(8) < g.day) return;
    const per = Math.min(goalMonthly(g), g.target - g.saved);
    g.marks[m] = { k: "auto", amt: per };
    g.saved += per;
  });
}
/* 冷启动：先问收入和一个账户（5 个字段），进去就有一个对的结余。
   固定支出、还贷、储蓄之后在财况页按需补 —— 不要一上来 36 个字段。 */
function wizardView() {
  const step = ui.wizard || 0;
  const adding = ui.wizAdding !== false;
  const list = step === 1 ? S.fixedIn : step === 2 ? S.accounts : [];
  /* 「添加」在填够必填项之前是灰的。名目 + 金额就够 —— 日子留空按 1 号算，
     不然一个可选字段会把按钮卡住。 */
  const ready = step === 1
    ? !!(ui.f.name || "").trim() && num(ui.f.amount) > 0
    : !!(ui.f.aname || "").trim() && num(ui.f.abal) >= 0 && ui.f.abal !== undefined &&
      String(ui.f.abal).trim() !== "";

  const added = list.map((x, i) => '<div class="row" style="min-height:46px">' +
    '<div style="flex:1"><div style="font-size:15px">' + esc(x.name) + "</div>" +
    (step === 1 ? '<div class="sub" style="font-size:11px">' +
      t("date.onDay", { day: x.day }) + "</div>" : "") +
    "</div>" +
    '<div class="money" style="font-size:15px">' +
    yuan(step === 1 ? x.amount : x.balance) + "</div>" +
    '<span class="sub" data-a="wizDrop:' + i + '" style="cursor:pointer;color:var(--ink-faint);' +
    'font-size:11px">' + t("f.delete") + "</span></div>").join("");

  /* 第 0 步只有两排 chip，一定有值，所以「下一步」永远是亮的 */
  const pickers =
    '<div class="fld"><div class="lbl">' + t("set.language") + "</div>" +
    '<div style="display:flex;gap:7px">' + [["中文", "zh"], ["English", "en"]].map(([l, k]) =>
      '<div class="chip ' + (lang() === k ? "on" : "") + '" data-a="lang:' + k + '">' + l +
      "</div>").join("") + "</div></div>" +
    '<div class="fld"><div class="lbl">' + t("set.currency") + "</div>" +
    '<div style="display:flex;gap:7px">' + Object.keys(CUR).map((k) =>
      '<div class="chip ' + (S.currency === k ? "on" : "") + '" data-a="cur:' + k + '">' +
      CUR[k].sym + " " + k + "</div>").join("") + "</div></div>";

  const template = '<div class="dash" style="display:block;cursor:default;padding:13px 14px">' +
    (step === 1
      ? field(t("fx.name"), input("name", ui.f.name,
          'placeholder="' + esc(t("wz.namePh")) + '"')) +
        '<div style="height:10px"></div>' +
        field(t("fx.amount"), mInput("amount", ui.f.amount)) +
        '<div style="height:10px"></div>' +
        field(t("wz.dayLabel"), input("day", ui.f.day == null ? "" : ui.f.day,
          'type="text" inputmode="numeric" placeholder="' + esc(t("wz.dayPh")) + '"'))
      : field(t("wz.acctName"), input("aname", ui.f.aname,
          'placeholder="' + esc(t("wz.acctPh")) + '"')) +
        '<div style="height:10px"></div>' +
        field(t("wz.acctBal"), mInput("abal", ui.f.abal))) +
    errline() +
    '<div class="mbtn sm' + (ready ? "" : " off") + '" data-a="wizAdd" ' +
    'style="margin-top:12px">' + t("wz.add") + "</div></div>";

  return '<div class="inset"></div>' +
    '<div class="nav">' + (step > 0
      ? '<div data-a="wizBack" style="cursor:pointer">' + ic("back", 19) + "</div>" : "") +
    '<div class="navt" style="flex:1">' +
    t(["wz.step0", "wz.step1", "wz.step2"][step]) + "</div>" +
    '<div class="sub">' + (step + 1) + " / 3</div></div>" +
    '<div class="body" style="gap:12px">' +
    (step === 0 ? "" : '<div class="sub">' + t(["", "wz.hint1", "wz.hint2"][step]) +
      "</div>") +
    (step === 0 ? pickers
      : added +
        (adding ? template
          : '<div class="dash" data-a="wizMore" style="min-height:48px">' + ic("plus", 15) +
            " " + t("wz.addAnother") + "</div>")) +
    '<div class="mbtn pri' + (step === 0 || list.length ? "" : " off") +
    '" data-a="wizNext" style="margin-top:4px">' +
    t(step === 2 ? "wz.start" : "wz.next") + "</div>" +
    '<div class="sub" data-a="wizSkip" style="text-align:center;cursor:pointer;' +
    'text-decoration:underline">' + t("wz.skip") + "</div>" +
    '<div class="sub" style="font-size:11px;text-align:center;margin-top:auto">' +
    t("wz.footer") + "</div></div>";
}

/* render() 每次都把 app.innerHTML 整个重建，滚动位置也跟着没了 ——
   编辑完一笔回到列表就弹回顶部，翻了半天的位置全丢。
   同一个屏幕就把 .body 的 scrollTop 接回去；换屏幕才回到顶部（那是对的）。 */
function render() {
  settleAutoGoals();
  if (needsSetup(S)) { app.innerHTML = wizardView(); return; }
  const key = screen();
  const oldBody = app.querySelector(".body");
  const keepTop = oldBody && ui.lastScreen === key ? oldBody.scrollTop : 0;
  const animating = ui.anim;
  const v = (SCREENS[key] || SCREENS.dashboard)();
  const tab = v.tab === undefined ? TAB_OF[key] : v.tab;
  app.innerHTML = '<div class="inset"></div><div class="nav' +
    (v.navSplit ? " split" : "") + '">' + v.nav + "</div>" +
    '<div class="body' + (v.fab ? " hasfab" : "") + '">' + v.body + "</div>" +
    (!ui.sheet && (tab || v.fab) ? dockHtml(tab, v.fab) : "") +
    (ui.sheet ? '<div class="dim' + (ui.anim ? " anim" : "") + '" data-a="close"></div>' +
      '<div class="sheet' + (ui.anim ? " anim" : "") + '">' + SHEETS[ui.sheet]() + "</div>" : "") +
    (ui.toast ? '<div class="toast' + (ui.sheet ? " high" : "") + '">' + ic("check", 17) +
      '<div style="flex:1">' + esc(ui.toast) + "</div></div>" : "");
  ui.lastScreen = key;
  save();
  if (keepTop) {
    const b = app.querySelector(".body");
    /* 抽屉刚关掉时列表可能还没排完版，scrollTop 会被截断，所以下一帧再补一次 */
    if (b) { b.scrollTop = keepTop;
      requestAnimationFrame(() => { if (b.isConnected && b.scrollTop !== keepTop)
        b.scrollTop = keepTop; }); }
  }
  if (animating) ui.anim = false;
}
app.addEventListener("click", (e) => {
  if (swallowClick) { swallowClick = false; e.stopPropagation(); return; }
  /* 分区展开着的时候点别处 —— 收起来。没有蒙版可点，只能在这儿兜。 */
  if (ui.navOpen && !e.target.closest(".dock")) { ui.navOpen = false; render(); }
  const el = e.target.closest("[data-a]");
  if (!el || el.classList.contains("off")) {
    if (el && el.classList.contains("off")) return;
    if (!el) return;
  }
  const raw = el.dataset.a, i = raw.indexOf(":");
  const act = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? null : raw.slice(i + 1);
  if (ACT[act]) { e.stopPropagation(); ACT[act](arg); }
});
/* 手势：只认横向；纵向一律让给滚动。滑过阈值就吞掉这次 click，避免误触发行内动作 */
let swState = null, swallowClick = false;
const closeSwipes = (except) => app.querySelectorAll(".sw.open")
  .forEach((el) => { if (el !== except) el.classList.remove("open"); });
app.addEventListener("pointerdown", (e) => {
  /* 上一次滑动只吞掉紧跟其后的那一次 click；新的一次按下就解除，
     否则滑完再点「删除」会被白白吃掉一下。 */
  swallowClick = false;
  if (e.target.closest(".sw-del")) return;
  const srt = e.target.closest(".srt");
  if (srt) {
    const pid = e.pointerId, y0 = e.clientY;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      if (swState && swState.locked) return;   // 已经在左滑了，别抢
      swState = null;
      startDrag(srt, y0);
      try { srt.setPointerCapture(pid); } catch (err) { /* 鼠标下可能没捕获 */ }
    }, 380);
  }
  const el = e.target.closest(".sw");
  if (!el) { closeSwipes(); return; }
  swState = { el, x0: e.clientX, y0: e.clientY, dx: 0, locked: false };
});
app.addEventListener("pointermove", (e) => {
  if (dragState) { e.preventDefault(); dragTo(e.clientY - dragState.y0); return; }
  if (!swState) return;
  const dx = e.clientX - swState.x0, dy = e.clientY - swState.y0;
  /* 手指动了就不是长按 */
  if (pressTimer && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    clearTimeout(pressTimer); pressTimer = null;
  }
  if (!swState.locked) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swState = null; return; }
    if (Math.abs(dx) < 6) return;
    swState.locked = true;
    /* 玻璃卡里的行没有自己的底色，删除层平时是不画的 —— 滑起来才让它露出来 */
    swState.el.classList.add("sliding");
  }
  swState.dx = dx;
  const body = swState.el.querySelector(".sw-body");
  const base = swState.el.classList.contains("open") ? -76 : 0;
  body.style.transform = "translateX(" + Math.max(-76, Math.min(0, base + dx)) + "px)";
});
const endSwipe = () => {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (dragState) { endDrag(); swState = null; return; }
  if (!swState) return;
  const { el, dx } = swState;
  swState = null;
  el.querySelector(".sw-body").style.transform = "";
  el.classList.remove("sliding");
  if (Math.abs(dx) > 6) swallowClick = true;
  closeSwipes(el);
  if (dx < -38) el.classList.add("open");
  else el.classList.remove("open");
};
app.addEventListener("pointerup", endSwipe);
app.addEventListener("pointercancel", endSwipe);

/* 语音改成点一下开始、再点一下结束。
   原来是「按住说、上移取消」—— 手势更自然，但它和抽屉自己的下拉关闭在同一块
   面上打架，先不做了；ACT.mic → micStart()，micStart 里已经带了开关语义。 */

/* ---- 软键盘把抽屉顶上去 -------------------------------------------------
   iOS 上键盘弹出来不会改变 window.innerHeight，只会把 visualViewport 压矮。
   抽屉是 position:absolute; bottom:0，于是整个躺在键盘底下：底部的按钮够不着，
   人也「滑不下去」。把差值写进 --kb，抽屉照着上移。 */
const vv = window.visualViewport;
if (vv) {
  const syncKb = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    /* 一两像素的抖动别往上写，会让抽屉发颤 */
    app.style.setProperty("--kb", (kb > 24 ? kb : 0) + "px");
  };
  vv.addEventListener("resize", syncKb);
  vv.addEventListener("scroll", syncKb);
}

/* ---- 抽屉往下拖就关掉 ---------------------------------------------------
   从顶上那一截（把手 + 标题那一行）往下拉，抽屉跟手；松手时拉过 90px
   或者甩得够快就关掉，否则弹回去。
   只有抽屉已经滚到顶才接管 —— 不然会把内部滚动抢走。
   输入框和按钮上按下不接管，那儿的手势属于它们自己。 */
let shState = null;
const SH_GRAB = 72;                  /* 顶上这么高的一截算「把手区」 */
const shEl = () => app.querySelector(".sheet");

app.addEventListener("pointerdown", (e) => {
  const sh = e.target.closest(".sheet");
  if (!sh || shState) return;
  if (e.target.closest("input,textarea,select,button,[data-a]")) return;
  if (sh.scrollTop > 0) return;
  const top = sh.getBoundingClientRect().top;
  if (e.clientY - top > SH_GRAB) return;
  shState = { sh, y0: e.clientY, t0: performance.now(), dy: 0, on: false };
});
app.addEventListener("pointermove", (e) => {
  if (!shState) return;
  const dy = e.clientY - shState.y0;
  if (!shState.on) {
    if (dy < 6) { if (dy < -6) shState = null; return; }
    shState.on = true;
    shState.sh.classList.add("drag");
    shState.sh.classList.remove("anim", "snap");
  }
  /* 往上拉给阻尼，别让抽屉飞出屏幕 */
  shState.dy = dy < 0 ? dy / 4 : dy;
  shState.sh.style.transform = "translateY(" + shState.dy + "px)";
});
const endSheetDrag = () => {
  if (!shState) return;
  const { sh, dy, t0, on } = shState;
  shState = null;
  if (!on) return;
  sh.classList.remove("drag");
  const v = dy / Math.max(1, performance.now() - t0);   /* px/ms */
  /* 甩一下也能关，但必须先走够 40px —— 只看速度的话，指头一抖
     （几像素、几毫秒）算出来的速度是天文数字，抽屉会自己跑掉 */
  if (dy > 90 || (dy > 40 && v > 0.6)) {
    sh.classList.add("snap");
    sh.style.transform = "translateY(110%)";
    const d = app.querySelector(".dim"); if (d) d.classList.add("fading");
    setTimeout(close, 180);
  } else {
    sh.classList.add("snap");
    sh.style.transform = "";
    setTimeout(() => sh.classList.remove("snap"), 240);
  }
};
window.addEventListener("pointerup", endSheetDrag);
window.addEventListener("pointercancel", endSheetDrag);

/* ---- 长按拖动排序 -------------------------------------------------------
   不做把手：把手要么挤掉一列版式，要么在手机上太小点不中。长按 380ms 拿起来，
   和「点一下进详情」「左滑删除」都不冲突 —— 后两个都在 380ms 内就结束了。 */
const SORTED = {
  fin: () => S.fixedIn,
  fout: () => S.fixedOut,
  debt: () => S.debts,
  acct: () => S.accounts,
  goal: () => S.goals,
  wish: () => S.wishlist,
};
let dragState = null, pressTimer = null;

function reorder(group, fromId, beforeId) {
  const arr = SORTED[group] && SORTED[group]();
  if (!arr) return;
  const key = group === "acct" ? "name" : "id";
  const from = arr.findIndex((x) => String(x[key]) === String(fromId));
  if (from < 0) return;
  const [item] = arr.splice(from, 1);
  const to = beforeId == null ? arr.length
    : arr.findIndex((x) => String(x[key]) === String(beforeId));
  arr.splice(to < 0 ? arr.length : to, 0, item);
}

function startDrag(el, y0) {
  const group = el.dataset.sg;
  const peers = [...app.querySelectorAll('.srt[data-sg="' + group + '"]')];
  if (peers.length < 2) return;
  const rects = peers.map((p) => p.getBoundingClientRect());
  dragState = { el, group, peers, rects, y0, i0: peers.indexOf(el), dy: 0,
    h: el.getBoundingClientRect().height + 8 };
  el.classList.add("lift");
  app.classList.add("dragging");
  swallowClick = true;
  if (navigator.vibrate) navigator.vibrate(8);
}

function dragTo(dy) {
  const d = dragState;
  d.dy = dy;
  d.el.style.transform = "translateY(" + dy + "px)";
  const mid = d.rects[d.i0].top + d.rects[d.i0].height / 2 + dy;
  let target = d.i0;
  d.rects.forEach((r, i) => {
    if (i === d.i0) return;
    const c = r.top + r.height / 2;
    if (i < d.i0 && mid < c) target = Math.min(target, i);
    if (i > d.i0 && mid > c) target = Math.max(target, i);
  });
  d.target = target;
  d.peers.forEach((p, i) => {
    if (i === d.i0) return;
    let shift = 0;
    if (target > d.i0 && i > d.i0 && i <= target) shift = -d.h;
    if (target < d.i0 && i < d.i0 && i >= target) shift = d.h;
    p.style.transform = shift ? "translateY(" + shift + "px)" : "";
  });
}

function endDrag() {
  const d = dragState;
  dragState = null;
  app.classList.remove("dragging");
  d.peers.forEach((p) => { p.style.transform = ""; p.classList.remove("lift"); });
  const target = d.target == null ? d.i0 : d.target;
  if (target !== d.i0) {
    const moved = d.peers[d.i0].dataset.si;
    /* 往下拖：落在目标的后面，所以基准点是「目标的下一个」 */
    const anchor = target > d.i0 ? d.peers[target + 1] : d.peers[target];
    reorder(d.group, moved, anchor ? anchor.dataset.si : null);
    render();
  }
}

function liveLabel(el, text) {
  const t = el.parentElement.querySelector(".lbl.money, .sub .money");
  if (t) t.textContent = text;
}
/* 引导页那个「添加」按钮要跟着输入实时亮起来 —— 打字不重绘，所以直接改 class */
function liveWizardButton() {
  const btn2 = app.querySelector('[data-a="wizAdd"]');
  if (!btn2) return;
  const ready = (ui.wizard || 0) === 1
    ? !!(ui.f.name || "").trim() && num(ui.f.amount) > 0
    : !!(ui.f.aname || "").trim() && String(ui.f.abal == null ? "" : ui.f.abal).trim() !== "" &&
      num(ui.f.abal) >= 0;
  btn2.classList.toggle("off", !ready);
}
/* 文件选择框是动态渲染出来的，所以事件挂在 app 上 */
app.addEventListener("change", (e) => {
  if (e.target.id !== "importfile" || !e.target.files || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => ACT.applyImport(String(fr.result));
  fr.readAsText(e.target.files[0]);
});
app.addEventListener("input", (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  const v = e.target.value;
  if (f === "txq") { ui.txq = v; paintTxList(); return; }
  if (f === "qname") ui.quiz.name = v;
  else if (f === "qprice") ui.quiz.price = num(v);
  else if (f === "qnec") { ui.quiz.necessity = +v; liveLabel(e.target, v + " / 10"); }
  else if (f === "renec") { ui.f.renec = +v; liveLabel(e.target, v + " / 10"); }
  else ui.f[f] = v;
  if (needsSetup(S)) liveWizardButton();
});
/* 打字时只存值，不重绘 —— 重绘会重建抽屉，光标和滚动位置都会丢 */
app.addEventListener("change", (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  if (e.target.type === "range") { render(); return; }
  if (e.target.tagName !== "SELECT") return;
  /* 不依赖 input 事件来存 select 的值 */
  ui.f[f] = e.target.value;
  if (f === "planId") { const p = activePlans().find((x) => x.name === e.target.value);
    ui.f.planId = p ? p.id : null; }
  ui.f.err = null;
  render();
});

const EXAMPLES = ["今天吃拉面25.5元，打车18元，看电影60元",
  "从微信零钱转账500元到招商银行卡", "我想买一个3000块的相机 必要度打分8",
  "计划3年攒够20万买房", "每月还房贷3000", "存入2000到支付宝"];
document.getElementById("examples").innerHTML = EXAMPLES.map((x, i) =>
  '<li><a href="#" data-ex="' + i + '" style="color:var(--accent)">' + x + "</a></li>").join("");
function updateClock() {
  document.getElementById("clock").textContent = "原型时间：" +
    now().toISOString().slice(0, 16).replace("T", " ") +
    (clockOffset ? "（已快进 " + Math.round(clockOffset / 3600e3) + " 小时）" : "");
}
document.querySelector(".side").addEventListener("click", (e) => {
  const ex = e.target.closest("[data-ex]");
  if (ex) { e.preventDefault(); sheet("assistant", { text: EXAMPLES[+ex.dataset.ex] }); return; }
  const b = e.target.closest("[data-side]");
  if (!b) return;
  if (b.dataset.side === "fwd") { clockOffset += +b.dataset.h * 3600e3; updateClock(); render(); }
  if (b.dataset.side === "fresh") {
    S = emptySeed(); clockOffset = 0;
    ui = { stack: ["dashboard"], sheet: null, f: {}, fStack: [], toast: null, seg: {},
      wizard: 0, quiz: { name: "", price: 0, necessity: 5, dup: false } };
    updateClock(); render();
  }
  if (b.dataset.side === "reset") {
    S = seed(); clockOffset = 0;
    ui = { stack: ["dashboard"], sheet: null, f: {}, fStack: [], toast: null, seg: {},
      quiz: { name: "", price: 0, necessity: 5, dup: false } };
    updateClock(); render();
  }
});
ui.quiz = { name: "", price: 0, necessity: 5, dup: false };
applyTheme();
applySkin();
updateClock();
render();

/* 装 Service Worker：装完就能离线开。只在 https（或本机）下有效，
   file:// 打开时浏览器直接不给注册，所以要 try 住，别让整页崩掉。 */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* 没装上就当没有，功能不受影响 */ });
  });
}
</script>
