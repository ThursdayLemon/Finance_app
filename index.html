/* ==========================================================================
   7. 渲染 / 输入 / 启动
   ========================================================================== */
/* 图标本身就说明了去哪，胶囊里塞文字会挤 —— 选中态靠那圈浅底和放大表示 */
/* 底栏按样机：说一句 · 点阵 · [返回] · 记一笔。
   四个分区不再常驻，收进点阵那颗按钮后面的扇形里。
   两套皮肤共用这一套结构 —— 奶油纸现在是这个版式的一次换色，不是另一套版式。 */
function dockHtml(tab, fab) {
  /* 底栏两种状态，就地互换，不弹浮层：
       默认 —— 四个分区分坐两颗药丸里（稿子的默认态就是这个）
       点中间那颗 —— 换成 说一句 · 记一笔，点阵变深
     ui.navOpen 为真 = 露出那两颗动作键。 */
  const secs = TABS();
  const half = (from, to) => '<div class="navpill" data-pill="' + from + '">' +
    '<i class="navslide"></i>' +
    secs.slice(from, to).map(([i, l, k]) =>
      '<div class="navb' + (k === tab ? " on" : "") + '" data-a="tab:' + k +
      '" title="' + esc(l) + '">' + ic(i, 22) + "<span>" + esc(l) + "</span></div>")
      .join("") + "</div>";
  /* 两侧各包一层槽：切换时只换槽里的东西，中间那颗点阵始终是同一个节点，
     它的深浅才过渡得起来（整块重画的话，新节点一上来就是终态，没得过渡）。 */
  const left = (acts) => acts
    ? (fab ? '<div class="act dark" data-a="assistant">' + ic("mic", 17) +
        "<span>" + t("as.speak") + "</span></div>" : '<div class="act ghost"></div>')
    : half(0, 2);
  const right = (acts) => acts
    ? '<div class="act hot" data-a="jot">' + ic("plus", 17) +
      "<span>" + t("word.addOne") + "</span></div>"
    : half(2, 4);
  dockSlots = { left, right };
  const acts = ui.navOpen;                 /* true = 露出说一句 / 记一笔 */
  /* 悬浮的快速记一笔。只在「露着四个分区」那一态出现 —— 换出动作键之后
     底栏本来就有「记一笔」，再浮一颗就是重复的入口。 */
  const quick = acts ? "" :
    /* 别挂 tapout —— .tapout{position:relative} 和 .qlog 特异度相同、写在后面，
       会把 absolute 盖掉（第一版就是这么飞到左上角的）。42 本来就够热区。 */
    '<div class="qlog" data-a="jot" title="' + esc(t("word.addOne")) + '">' +
    ic("plus", 20) + "</div>";
  return quick + '<div class="dock">' +
    '<div class="dockside">' + left(acts) + "</div>" +
    '<div class="gridb' + (acts ? " open" : "") + '" data-a="nav" title="' +
    esc(t("nav.sections")) + '">' + ic("dots", 17) + "</div>" +
    '<div class="dockside">' + right(acts) + "</div>" +
    "</div>";
}
let dockSlots = null;
/* 只换两侧的槽，不重画整页 —— 中间那颗留在原地，深浅的过渡才跑得起来。 */
function paintDock() {
  const d = app.querySelector(".dock");
  if (!d || !dockSlots) return render();
  const sides = d.querySelectorAll(".dockside");
  const grid = d.querySelector(".gridb");
  if (sides.length !== 2 || !grid) return render();
  const acts = ui.navOpen;
  sides.forEach((el) => el.classList.add("swapping"));
  grid.classList.toggle("open", acts);
  setTimeout(() => {
    sides[0].innerHTML = dockSlots.left(acts);
    sides[1].innerHTML = dockSlots.right(acts);
    sides.forEach((el) => el.classList.remove("swapping"));
    playNav();     /* 这条路不走 render，滑块得自己就位 */
  }, 110);
}

/* 自动扣款的目标，到了日子就自己把这个月记上（幂等）。真实实现里这是后端的定时任务。 */
function settleAutoGoals() {
  const m = thisMonth();
  S.debts.forEach((d) => {
    if (!d.auto || !d.marks || d.marks[m]) return;
    if (+today().slice(8) < d.day) return;
    d.marks[m] = { k: "auto", amt: d.monthly };
  });
  allGoals().forEach((g) => {
    if (!g.auto || g.marks[m]) return;
    if (+today().slice(8) < g.day) return;
    const per = Math.min(goalMonthly(g), g.target - g.saved);
    g.marks[m] = { k: "auto", amt: per };
    g.saved += per;
  });
}
/* 冷启动：先问收入和一个账户（5 个字段），进去就有一个对的结余。
   固定支出、还贷、储蓄之后在财况页按需补 —— 不要一上来 36 个字段。 */
function wizardView() {
  const step = ui.wizard || 0;
  const adding = ui.wizAdding !== false;
  const list = step === 1 ? S.fixedIn : step === 2 ? S.accounts : [];
  /* 「添加」在填够必填项之前是灰的。名目 + 金额就够 —— 日子留空按 1 号算，
     不然一个可选字段会把按钮卡住。 */
  const ready = step === 1
    ? !!(ui.f.name || "").trim() && num(ui.f.amount) > 0
    : !!(ui.f.aname || "").trim() && num(ui.f.abal) >= 0 && ui.f.abal !== undefined &&
      String(ui.f.abal).trim() !== "";

  const added = list.map((x, i) => '<div class="row" style="min-height:46px">' +
    '<div style="flex:1"><div style="font-size:15px">' + esc(x.name) + "</div>" +
    (step === 1 ? '<div class="sub" style="font-size:11px">' +
      t("date.onDay", { day: x.day }) + "</div>" : "") +
    "</div>" +
    '<div class="money" style="font-size:15px">' +
    yuan(step === 1 ? x.amount : x.balance) + "</div>" +
    '<span class="sub" data-a="wizDrop:' + i + '" style="cursor:pointer;color:var(--ink-faint);' +
    'font-size:11px">' + t("f.delete") + "</span></div>").join("");

  /* 第 0 步只有两排 chip，一定有值，所以「下一步」永远是亮的 */
  const pickers =
    '<div class="fld"><div class="lbl">' + t("set.language") + "</div>" +
    '<div style="display:flex;gap:7px">' + [["中文", "zh"], ["English", "en"]].map(([l, k]) =>
      '<div class="chip ' + (lang() === k ? "on" : "") + '" data-a="lang:' + k + '">' + l +
      "</div>").join("") + "</div></div>" +
    '<div class="fld"><div class="lbl">' + t("set.currency") + "</div>" +
    '<div style="display:flex;gap:7px">' + Object.keys(CUR).map((k) =>
      '<div class="chip ' + (S.currency === k ? "on" : "") + '" data-a="cur:' + k + '">' +
      CUR[k].sym + " " + k + "</div>").join("") + "</div></div>";

  const template = '<div class="dash" style="display:block;cursor:default;padding:13px 14px">' +
    (step === 1
      ? field(t("fx.name"), input("name", ui.f.name,
          'placeholder="' + esc(t("wz.namePh")) + '"')) +
        '<div style="height:10px"></div>' +
        field(t("fx.amount"), mInput("amount", ui.f.amount)) +
        '<div style="height:10px"></div>' +
        field(t("wz.dayLabel"), input("day", ui.f.day == null ? "" : ui.f.day,
          'type="text" inputmode="numeric" placeholder="' + esc(t("wz.dayPh")) + '"'))
      : field(t("wz.acctName"), input("aname", ui.f.aname,
          'placeholder="' + esc(t("wz.acctPh")) + '"')) +
        '<div style="height:10px"></div>' +
        field(t("wz.acctBal"), mInput("abal", ui.f.abal))) +
    errline() +
    '<div class="mbtn sm' + (ready ? "" : " off") + '" data-a="wizAdd" ' +
    'style="margin-top:12px">' + t("wz.add") + "</div></div>";

  return '<div class="inset"></div>' +
    '<div class="nav">' + (step > 0
      ? '<div data-a="wizBack" style="cursor:pointer">' + ic("back", 19) + "</div>" : "") +
    '<div class="navt" style="flex:1">' +
    t(["wz.step0", "wz.step1", "wz.step2"][step]) + "</div>" +
    '<div class="sub">' + (step + 1) + " / 3</div></div>" +
    '<div class="body" style="gap:12px">' +
    (step === 0 ? "" : '<div class="sub">' + t(["", "wz.hint1", "wz.hint2"][step]) +
      "</div>") +
    (step === 0 ? pickers
      : added +
        (adding ? template
          : '<div class="dash" data-a="wizMore" style="min-height:48px">' + ic("plus", 15) +
            " " + t("wz.addAnother") + "</div>")) +
    '<div class="mbtn pri' + (step === 0 || list.length ? "" : " off") +
    '" data-a="wizNext" style="margin-top:4px">' +
    t(step === 2 ? "wz.start" : "wz.next") + "</div>" +
    '<div class="sub" data-a="wizSkip" style="text-align:center;cursor:pointer;' +
    'text-decoration:underline">' + t("wz.skip") + "</div>" +
    '<div class="sub" style="font-size:11px;text-align:center;margin-top:auto">' +
    t("wz.footer") + "</div></div>";
}

/* render() 每次都把 app.innerHTML 整个重建，滚动位置也跟着没了 ——
   编辑完一笔回到列表就弹回顶部，翻了半天的位置全丢。
   同一个屏幕就把 .body 的 scrollTop 接回去；换屏幕才回到顶部（那是对的）。 */
function render() {
  /* 抽屉正在往下走的时候，本来是整个跳过 render 让动画演完的（v65）。
     那 180ms 里点底栏，go() 改了状态却画不出来 —— 看着就是「点了没反应、
     导航状态也不变」。画面正确性比动画完整重要：有新东西要画就提前收场。 */
  if (sheetOut) sheetOut = false;
  settleAutoGoals();
  if (needsSetup(S)) { app.innerHTML = wizardView(); return; }
  const key = screen();
  const oldBody = app.querySelector(".body");
  const keepTop = oldBody && ui.lastScreen === key ? oldBody.scrollTop : 0;
  const animating = ui.anim;
  const v = (SCREENS[key] || SCREENS.dashboard)();
  const tab = v.tab === undefined ? TAB_OF[key] : v.tab;
  app.innerHTML = '<div class="inset"></div><div class="nav' +
    (v.navSplit ? " split" : "") + '">' + v.nav + "</div>" +
    '<div class="body' + (v.fab ? " hasfab" : "") +
      (!ui.sheet && (tab || v.fab) ? " dockfade" : "") + '">' + v.body + "</div>" +
    (!ui.sheet && (tab || v.fab) ? dockHtml(tab, v.fab) : "") +
    (ui.sheet ? '<div class="dim' + (ui.anim ? " anim" : "") + '" data-a="close"></div>' +
      /* 语音和打字是「被推上来」的，给一条会过冲的曲线；别的抽屉稳稳滑上来 */
      '<div class="sheet' + (ui.anim ? " anim" : "") +
      (/^(assistant|jot)$/.test(ui.sheet) ? " bouncy" : "") +
      /* quick 那套 8px 的紧内边距是给贴着键盘的输入屏的；
         走到解析预览就是一张普通抽屉了，再压着就挤成一团 */
      (ui.sheet === "jot" && !ui.f.parsed ? " quick" : "") + '">' +
      SHEETS[ui.sheet]() + "</div>" : "") +
    (ui.toast ? '<div class="toast' + (ui.sheet ? " high" : "") + '">' + ic("check", 17) +
      '<div style="flex:1">' + esc(ui.toast) + "</div></div>" : "");
  ui.lastScreen = key;
  save();
  if (keepTop) {
    const b = app.querySelector(".body");
    /* 抽屉刚关掉时列表可能还没排完版，scrollTop 会被截断，所以下一帧再补一次 */
    if (b) { b.scrollTop = keepTop;
      requestAnimationFrame(() => { if (b.isConnected && b.scrollTop !== keepTop)
        b.scrollTop = keepTop; }); }
  }
  if (animating) ui.anim = false;
  if (ui.flip) playFlip();
  else if (ui.flipBack) playFlipBack();
  else if (ui.grow) playGrow();
  playSeg();
  playNav();
}

/* 底栏那颗白底：同一半边里换格子就横着滑过去（苹果那个手感），
   换到另一半边就没法滑了 —— 中间隔着点阵那颗按钮，滑过去要穿过它。
   那种情况旧的淡出、新的在目标位置淡入。
   位置是量出来的不是算出来的：两格之间是 space-between，
   间隔随药丸宽度变，写死一个数迟早对不上。 */
function playNav() {
  const was = ui.navWas || (ui.navWas = {});
  app.querySelectorAll(".navpill").forEach((pill) => {
    const sl = pill.querySelector(".navslide");
    if (!sl) return;
    const key = pill.dataset.pill;
    const on = pill.querySelector(".navb.on");
    const prev = was[key];
    if (!on) { was[key] = null; sl.style.opacity = "0"; return; }
    const x = on.offsetLeft;
    was[key] = x;
    sl.style.width = on.offsetWidth + "px";
    if (reduced()) {
      /* 不横滑，但也不硬跳：原地淡掉、换到新位置、再淡回来。
         这就是苹果 Reduce Motion 的做法 —— 位移换成淡入淡出，不是没有动画。 */
      if (prev == null || prev === x) {
        sl.style.transition = "none";
        sl.style.transform = "translateX(" + x + "px)";
        void sl.offsetHeight;
        sl.style.transition = "opacity .18s ease";
        sl.style.opacity = "1";
        return;
      }
      sl.style.transition = "opacity .14s ease";
      sl.style.opacity = "0";
      setTimeout(() => {
        if (!sl.isConnected) return;
        sl.style.transition = "none";
        sl.style.transform = "translateX(" + x + "px)";
        void sl.offsetHeight;
        sl.style.transition = "opacity .18s ease";
        sl.style.opacity = "1";
      }, 150);
      return;
    }
    if (prev == null) {                    /* 这半边刚亮起来：位置直接就位，只淡入 */
      sl.style.transition = "none";
      sl.style.opacity = "0";
      sl.style.transform = "translateX(" + x + "px)";
      void sl.offsetHeight;
      sl.style.transition = "";
      sl.style.opacity = "1";
      return;
    }
    sl.style.opacity = "1";
    if (prev === x) return;                /* 没换格，别白动一次 */
    sl.style.transition = "none";          /* 先退回上一格，逼画一帧，再放它滑 */
    sl.style.transform = "translateX(" + prev + "px)";
    void sl.offsetHeight;
    sl.style.transition = "";
    sl.style.transform = "translateX(" + x + "px)";
  });
}

/* 首页那张小卡长成分析页那张大卡。和 playFlip 是同一套 FLIP，只是这次
   连尺寸一起变 —— 两张卡的宽高比不一样，非等比 scale 会把里面的字和图
   压扁。所以内容不跟着缩：卡在长的时候内容是透明的，长到一半才淡进来，
   变形那一段根本看不见。 */
function playGrow() {
  const from = ui.grow; ui.grow = null;
  const card = app.querySelector(".anchart");
  if (!card) return;
  if (reduced()) return fadeIn([card]);
  const to = card.getBoundingClientRect();
  if (!to.width || !to.height) return;
  const sx = from.width / to.width, sy = from.height / to.height;
  const dx = from.left - to.left, dy = from.top - to.top;
  const kids = [];
  card.childNodes.forEach((k) => { if (k.nodeType === 1) kids.push(k); });
  card.style.transformOrigin = "top left";
  card.style.transition = "none";
  card.style.transform = "translate(" + dx + "px," + dy + "px) scale(" +
    sx.toFixed(4) + "," + sy.toFixed(4) + ")";
  kids.forEach((k) => { k.style.transition = "none"; k.style.opacity = "0"; });
  void card.offsetHeight;
  requestAnimationFrame(() => {
    card.style.transition = "transform .34s " + ARRIVE;
    card.style.transform = "translate(0,0) scale(1,1)";
    kids.forEach((k) => {
      k.style.transition = "opacity .24s ease .1s"; k.style.opacity = "1"; });
  });
  setTimeout(() => {
    if (card.isConnected) {
      card.style.transition = ""; card.style.transform = "";
      card.style.transformOrigin = ""; }
    kids.forEach((k) => { if (k.isConnected) {
      k.style.transition = ""; k.style.opacity = ""; } });
  }, 420);
}

/* 分段滑块那条 .34s 的过冲曲线，在这之前一次都没跑过 —— render 是整屏
   重建 innerHTML，滑块每次都是个新元素，新元素没有「上一个位置」，
   transition 自然无从谈起。这里补上起点：先把它按上一次那格摆好，
   逼浏览器画一帧，再放它去新那格。 */
function playSeg() {
  const was = ui.segWas || (ui.segWas = {});
  app.querySelectorAll(".segpill").forEach((el) => {
    const key = el.dataset.seg, now = +el.dataset.i;
    const prev = was[key];
    was[key] = now;
    if (prev == null || prev === now) return;
    if (reduced()) {          /* 同上：位移换成淡入淡出 */
      el.style.transition = "opacity .14s ease";
      el.style.opacity = "0";
      setTimeout(() => { if (el.isConnected) {
        el.style.transition = "opacity .18s ease"; el.style.opacity = "1"; } }, 150);
      return;
    }
    el.style.transition = "none";
    el.style.transform = "translateX(calc(100% * " + prev + "))";
    void el.offsetHeight;
    el.style.transition = "";
    el.style.transform = "translateX(calc(100% * " + now + "))";
  });
}

/* 回程。和 playFlip 是同一套，只是这次动的是列表里的那张卡：
   它现在在原位（Last），把它推到详情页卡松手时的位置（Invert），再放开。 */
function playFlipBack() {
  const from = ui.flipBack; ui.flipBack = null;
  let card = null;
  app.querySelectorAll(".acard").forEach((x) => {
    if (x.dataset.card === ui.jarName) card = x; });
  if (!card) return;
  if (reduced()) return fadeIn([card]);
  /* 列表是从头渲染的，目标卡可能在屏幕外 —— 先滚到它，再量位置，顺序反了就白量 */
  const body = app.querySelector(".body");
  if (body) {
    const r = card.getBoundingClientRect(), br = body.getBoundingClientRect();
    if (r.top < br.top || r.bottom > br.bottom) card.scrollIntoView({ block: "center" });
  }
  const to = card.getBoundingClientRect();
  const dx = from.left - to.left, dy = from.top - to.top;
  if (!dx && !dy) return;
  card.style.transition = "none";
  card.style.transform = "translate(" + dx + "px," + dy + "px)";
  /* 卡堆里后面的卡会盖住它，飞回来这一路得压在最上面 */
  card.style.zIndex = "3";
  /* 它底下的那些先让开一点，等它落位了再依次收回来 —— 
     不然卡飞回一个纹丝不动的堆里，像插进去的，不像回到自己那一格。 */
  const below = [];
  const stack = card.parentNode;
  if (stack && stack.classList.contains("cstack")) {
    let seen = false;
    stack.querySelectorAll(".acard").forEach((c) => {
      if (c === card) { seen = true; return; }
      if (seen) below.push(c);
    });
  }
  below.forEach((c, k) => {
    c.style.transition = "none";
    c.style.transform = "translateY(" + (24 + k * 9) + "px)";
  });
  /* 逼浏览器把「让开」这一帧真画出来，不然它会和下面的「归位」合并掉 */
  void card.offsetHeight;
  /* 时序是这一段的全部：
       0    卡起飞（360）
       210  紧邻的那张就开始上来，卡还在半路
       240  撤 z-index —— 飞行还剩三分之一，卡是「钻进去」落位的，
            不是落到顶上再被盖住。再早就会在半路被前面的卡挡住。
       360  卡落位，这时邻居已经压了它 150ms
       270+ 剩下的每隔 60 依次上来 */
  requestAnimationFrame(() => {
    card.style.transition = "transform .36s cubic-bezier(.22,1,.36,1)";
    card.style.transform = "translate(0,0)";
    below.forEach((c, k) => {
      /* 延迟封顶 450：卡多的时候排在后面的不该真等那么久 */
      const wait = Math.min(210 + k * 60, 450);
      c.style.transition = "transform .3s " + ARRIVE + " " + wait + "ms";
      c.style.transform = "";
    });
  });
  setTimeout(() => { if (card.isConnected) card.style.zIndex = ""; }, 240);
  setTimeout(() => { if (card.isConnected) {
    card.style.transition = ""; card.style.transform = ""; } }, 400);
  setTimeout(() => { below.forEach((c) => { if (c.isConnected) {
    c.style.transition = ""; c.style.transform = ""; } }); }, 800);
}

/* 卡从列表里飞到详情页顶上。FLIP：旧位置已经量好了（First），
   现在这一帧是新位置（Last），先用 transform 把它推回旧位置（Invert），
   下一帧松手让它自己滑回来（Play）。全程只动 transform，不碰布局，
   所以 60 帧稳得住。history 那一列晚 60ms 从下面跟上来。 */
function playFlip() {
  const from = ui.flip; ui.flip = null;
  const card = app.querySelector(".acard.still");
  if (!card) return;
  if (reduced()) return fadeIn([card, app.querySelector(".acctlog")]);
  const to = card.getBoundingClientRect();
  const dx = from.left - to.left, dy = from.top - to.top;
  if (!dx && !dy) return;
  const log = app.querySelector(".acctlog");
  const EASE = "cubic-bezier(.22,1,.36,1)";
  card.style.transition = "none";
  card.style.transform = "translate(" + dx + "px," + dy + "px)";
  if (log) { log.style.transition = "none"; log.style.transform = "translateY(26px)";
    log.style.opacity = "0"; }
  requestAnimationFrame(() => {
    card.style.transition = "transform .42s " + EASE;
    card.style.transform = "translate(0,0)";
    if (log) {
      log.style.transition = "transform .42s " + EASE + " .06s,opacity .28s ease .06s";
      log.style.transform = "translateY(0)"; log.style.opacity = "1";
    }
  });
  /* 收尾：inline 的 transform 留着会压住后面的 :active 之类，清掉 */
  setTimeout(() => {
    [card, log].forEach((el) => { if (el && el.isConnected) {
      el.style.transition = ""; el.style.transform = ""; el.style.opacity = ""; } });
  }, 520);
}
/* ---- 触感 ------------------------------------------------------------
   你说的那个「点下去有重量」是 Taptic Engine。Web 上没有直通它的 API：
     · Android / Chrome：navigator.vibrate 能用，给不同的时长就是不同的轻重。
     · iOS Safari：不实现 Vibration API（至今没有）。唯一能敲到马达的口子是
       iOS 17.4 起的 <input type="checkbox" switch> —— 它被真人点一下会震一下。
       所以藏一个这种开关，需要震的时候用真实的 click 去拨它。
   这是个偏门做法，苹果哪天改了就没了；所以只当锦上添花，功能一点都不依赖它。 */
let hapticSwitch = null;
function haptics() {
  if (hapticSwitch) return hapticSwitch;
  const wrap = document.createElement("label");
  wrap.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;" +
    "pointer-events:none;left:-9999px;top:0";
  const inp = document.createElement("input");
  inp.type = "checkbox";
  inp.setAttribute("switch", "");           /* iOS 17.4+ 才认得这个属性 */
  inp.tabIndex = -1;
  inp.setAttribute("aria-hidden", "true");
  wrap.appendChild(inp);
  document.body.appendChild(wrap);
  hapticSwitch = { wrap, inp, ok: "switch" in inp || inp.matches("input[switch]") };
  return hapticSwitch;
}
/* kind: "light" 轻点（切换、选中）/ "solid" 落定（提交、删除） */
function buzz(kind) {
  if (S.haptics === false) return;
  if (navigator.vibrate) { navigator.vibrate(kind === "solid" ? 18 : 8); return; }
  const h = haptics();
  if (h.ok) { try { h.inp.click(); } catch (err) { /* 拨不动就算了 */ } }
}
/* 落定感更重的那几个动作，其余一律轻点 */
const SOLID = /^(commit|submit|delTx|delFixed|delGoal|delDebt|delAcct|delWish|wipeData|parse|confirm|goalDone|debtDone)/;

app.addEventListener("click", (e) => {
  if (swallowClick) {
    swallowClick = false;
    if (Date.now() - swallowAt < 400) { e.stopPropagation(); return; }
  }
  /* 分区展开着的时候点别处 —— 收起来。没有蒙版可点，只能在这儿兜。 */
  if (ui.navOpen && !e.target.closest(".dock")) { ui.navOpen = false; render(); }
  const el = e.target.closest("[data-a]");
  if (!el || el.classList.contains("off")) {
    if (el && el.classList.contains("off")) return;
    if (!el) return;
  }
  const raw = el.dataset.a, i = raw.indexOf(":");
  const act = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? null : raw.slice(i + 1);
  if (ACT[act]) { buzz(SOLID.test(act) ? "solid" : "light"); e.stopPropagation(); ACT[act](arg); }
});
/* 手势：只认横向；纵向一律让给滚动。滑过阈值就吞掉这次 click，避免误触发行内动作 */
/* 只吞紧跟其后的那一次 click。按下时会清一次，但手势要是没能正常收尾
   （pointerup 丢了、DOM 被重建导致 click 压根没派发），它就会挂在那儿，
   下一次点哪儿都被吃掉。加个时效兜底：过了 400ms 自动失效。 */
let swState = null, swallowClick = false, swallowAt = 0;
const swallow = () => { swallowClick = true; swallowAt = Date.now(); };
const closeSwipes = (except) => app.querySelectorAll(".sw.open")
  .forEach((el) => { if (el !== except) el.classList.remove("open"); });
app.addEventListener("pointerdown", (e) => {
  /* 上一次滑动只吞掉紧跟其后的那一次 click；新的一次按下就解除，
     否则滑完再点「删除」会被白白吃掉一下。 */
  swallowClick = false;
  if (e.target.closest(".sw-del")) return;
  const srt = e.target.closest(".srt");
  if (srt) {
    const pid = e.pointerId, y0 = e.clientY;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      if (swState && swState.locked) return;   // 已经在左滑了，别抢
      swState = null;
      startDrag(srt, y0);
      try { srt.setPointerCapture(pid); } catch (err) { /* 鼠标下可能没捕获 */ }
    }, 380);
  }
  const el = e.target.closest(".sw");
  if (!el) { closeSwipes(); return; }
  swState = { el, x0: e.clientX, y0: e.clientY, dx: 0, locked: false };
});
app.addEventListener("pointermove", (e) => {
  if (dragState) { e.preventDefault(); dragTo(e.clientY - dragState.y0); return; }
  if (!swState) return;
  const dx = e.clientX - swState.x0, dy = e.clientY - swState.y0;
  /* 手指动了就不是长按 */
  if (pressTimer && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    clearTimeout(pressTimer); pressTimer = null;
  }
  if (!swState.locked) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swState = null; return; }
    if (Math.abs(dx) < 6) return;
    swState.locked = true;
  }
  swState.dx = dx;
  const body = swState.el.querySelector(".sw-body");
  const base = swState.el.classList.contains("open") ? -76 : 0;
  const move = Math.max(-76, Math.min(0, base + dx));
  body.style.transform = "translateX(" + move + "px)";
  /* 删除层跟着走，位移差正好是一个身位：行让开多少，红就进来多少。
     行的底色是透明的，红块要是留在原地就会从金额底下透上来。 */
  const del = swState.el.querySelector(".sw-del");
  if (del) del.style.transform = "translateX(" + (76 + move) + "px)";
});
/* 详情页那张卡上往下拉 = 送它回列表。
   卡是 touch-action:none 的，纵向也归我们管，所以得自己分流：
   列表还没滚到顶就当滚动使（手动同步 scrollTop），滚到顶了再往下拉才是 dismiss。
   一路滚回顶还在继续下拉的，中途把棒交给 dismiss，不用松手重来。 */
let cardDrag = null;
app.addEventListener("pointerdown", (e) => {
  const card = e.target.closest(".acard.still");
  if (!card) return;
  const body = app.querySelector(".body");
  cardDrag = { card, body, y0: e.clientY, x0: e.clientX,
    top0: body ? body.scrollTop : 0, dy: 0, mode: null };
});
function paintCardDrag(dy) {
  const d = cardDrag; if (!d) return;
  const k = Math.min(1, dy / 300);
  d.card.style.transition = "none";
  d.card.style.transform = "translateY(" + dy + "px)";
  /* history 跟着走，但只走 55% —— 有点视差，卡才像是被拉起来的那一层。
     减弱动效时两层同步走、也不淡出：跟手是必须留的（这一拉会翻页），
     视差和淡出只是修辞。 */
  const log = app.querySelector(".acctlog");
  if (log) { log.style.transition = "none";
    log.style.transform = "translateY(" + (reduced() ? dy : dy * 0.55) + "px)";
    if (!reduced()) log.style.opacity = String(Math.max(0, 1 - k * 1.3)); }
}
app.addEventListener("pointermove", (e) => {
  const d = cardDrag; if (!d) return;
  const dy = e.clientY - d.y0, dx = e.clientX - d.x0;
  if (!d.mode) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { cardDrag = null; return; }
    if (Math.abs(dy) < 6) return;
    d.mode = (dy > 0 && d.top0 <= 0) ? "dismiss" : "scroll";
    /* 判成滚动就彻底撒手 —— 这一手全交给浏览器，才有惯性和减速 */
    if (d.mode === "scroll") { cardDrag = null; return; }
  }
  d.dy = Math.max(0, dy);
  paintCardDrag(d.dy);
});
const endCardDrag = () => {
  const d = cardDrag; if (!d) return;
  cardDrag = null;
  if (d.mode !== "dismiss") return;
  const log = app.querySelector(".acctlog");
  if (d.dy > 90) {
    /* 过线：把卡此刻的位置交给下一屏，让列表里的那张从这儿飞回原位 */
    ui.flipBack = d.card.getBoundingClientRect();
    swallow();
    pop();
    return;
  }
  const EASE = "cubic-bezier(.22,1,.36,1)";
  [d.card, log].forEach((el) => { if (!el) return;
    el.style.transition = "transform .3s " + EASE + ",opacity .2s ease";
    el.style.transform = ""; el.style.opacity = ""; });
  setTimeout(() => { [d.card, log].forEach((el) => {
    if (el && el.isConnected) el.style.transition = ""; }); }, 340);
};
app.addEventListener("pointerup", endCardDrag);
app.addEventListener("pointercancel", endCardDrag);

/* 卡堆往下拉：越靠下的卡走得越远，卡堆就被拉开了（Wallet 那个手感）。
   位移不是线性跟手的 —— 走 rubber() 这条指数饱和曲线，越拉越沉、
   拉到底也就到 RUB_MAX，松手再依次弹回去，像一根橡皮筋。 */
/* CSS 里那两条 @media (prefers-reduced-motion) 管不到下面这些动画 ——
   它们的 transition 是 JS 写在 inline style 上的，媒体查询够不着。
   所以 JS 得自己问一次。开了减弱动效之后：
     · 位移一律不做，但「这一屏换了」还是要交代 —— 用一次短淡入顶上
     · 拉皮筋整个停掉：它不改变任何状态，纯装饰，正是该减掉的那类
     · 下拉返回保留跟手：它会触发导航，是功能性反馈，减掉就没法用了 */
const REDUCE = window.matchMedia
  ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
const reduced = () => !!(REDUCE && REDUCE.matches);
/* 苹果的 Reduce Motion 不是「不动」，是把**位移**换成**淡入淡出** —— 动画还在。
   而且它从不砍「手指按着的东西跟着走」：那是直接操作的反馈，不是转场修辞。
   所以这一版的分界是「谁在动」而不是「动不动」：
     自动播放的位移（飞入、归位、滑块横移）→ 换成淡入淡出
     手指拖着的跟随（拉皮筋、下拉返回）→ 留着，只把修辞去掉（阶梯、视差） */
/* 换一屏时用的那次淡入 —— 位移的替身 */
function fadeIn(els) {
  els.forEach((el) => { if (!el) return;
    el.style.transition = "none"; el.style.opacity = "0"; });
  if (els[0]) void els[0].offsetHeight;
  els.forEach((el) => { if (!el) return;
    el.style.transition = "opacity .22s ease"; el.style.opacity = "1"; });
  setTimeout(() => { els.forEach((el) => { if (el && el.isConnected) {
    el.style.transition = ""; el.style.opacity = ""; } }); }, 260);
}
const RUB_MAX = 170;
const rubber = (d) => RUB_MAX * (1 - Math.exp(-Math.max(0, d) / RUB_MAX));
/* 过冲只留给「被拉长的东西弹回去」这一件事 —— 橡皮筋有这个物理，别处没有。
   其余一律走确定的减速：到位就是到位，不回头。 */
const SPRING = "cubic-bezier(.2,1.25,.35,1)";
const ARRIVE = "cubic-bezier(.16,1,.3,1)";
let stackDrag = null;
app.addEventListener("pointerdown", (e) => {
  const stack = e.target.closest(".cstack");
  if (!stack) return;
  const body = app.querySelector(".body");
  const cards = [];
  stack.querySelectorAll(".acard").forEach((c) => cards.push(c));
  if (!cards.length) return;
  stackDrag = { stack, body, cards, y0: e.clientY, x0: e.clientX,
    top0: body ? body.scrollTop : 0, dy: 0, mode: null };
});
app.addEventListener("pointermove", (e) => {
  const d = stackDrag; if (!d) return;
  const dy = e.clientY - d.y0, dx = e.clientX - d.x0;
  if (!d.mode) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { stackDrag = null; return; }
    if (Math.abs(dy) < 6) return;
    /* 和详情页那张卡同一套分流：没到顶就当滚动使，到顶了往下拉才是拉皮筋 */
    d.mode = (dy > 0 && d.top0 <= 0) ? "rub" : "scroll";
    if (d.mode === "scroll") { stackDrag = null; return; }
  }
  d.dy = Math.max(0, dy);
  const pull = rubber(d.dy);
  d.cards.forEach((c, i) => {
    /* 阶梯：第一张跟手最少，每往下一张多拽一截 —— 卡缝就这么拉开的。
       减弱动效时整摞一起走、不拉开：跟手留着（手指按着呢），阶梯是修辞，去掉。 */
    c.style.transition = "none";
    const k = reduced() ? 0.5 : (0.35 + i * 0.2);
    c.style.transform = "translateY(" + (pull * k).toFixed(2) + "px)";
  });
});
const endStackDrag = () => {
  const d = stackDrag; if (!d) return;
  stackDrag = null;
  if (d.mode !== "rub") return;
  if (d.dy > 6) swallow();   /* 拉过就别再当成点卡 */
  /* 从上往下依次松手 —— 底下那张被拽得最远、最后归位，像鞭子收回来 */
  d.cards.forEach((c, i) => {
    c.style.transition = reduced() ? "transform .3s " + ARRIVE
      : "transform .42s " + SPRING + " " + (i * 18) + "ms";
    c.style.transform = "";
  });
  const cards = d.cards;
  setTimeout(() => { cards.forEach((c) => {
    if (c.isConnected) c.style.transition = ""; }); }, 460 + cards.length * 18);
};
/* 只有「按下时就在顶端 + 正在往下拉」这一手才拦，其余一概放行给原生滚动。
   必须在第一次 touchmove 就拦下 —— 让浏览器先滚起来之后再拦是拦不住的。 */
app.addEventListener("touchmove", (e) => {
  const d = stackDrag || cardDrag;
  if (!d) return;
  if (d.mode === "rub" || d.mode === "dismiss") { e.preventDefault(); return; }
  if (d.mode) return;
  const tY = e.touches && e.touches[0] ? e.touches[0].clientY : null;
  if (tY != null && d.top0 <= 0 && tY - d.y0 > 0) e.preventDefault();
}, { passive: false });
app.addEventListener("pointerup", endStackDrag);
app.addEventListener("pointercancel", endStackDrag);

const endSwipe = () => {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (dragState) { endDrag(); swState = null; return; }
  if (!swState) return;
  const { el, dx } = swState;
  swState = null;
  el.querySelector(".sw-body").style.transform = "";
  /* 交回给 CSS：open 的停在 0，没 open 的弹回行外 */
  const delEl = el.querySelector(".sw-del");
  if (delEl) delEl.style.transform = "";
  if (Math.abs(dx) > 6) swallow();
  closeSwipes(el);
  if (dx < -38) el.classList.add("open");
  else el.classList.remove("open");
};
app.addEventListener("pointerup", endSwipe);
app.addEventListener("pointercancel", endSwipe);

/* 语音改成点一下开始、再点一下结束。
   原来是「按住说、上移取消」—— 手势更自然，但它和抽屉自己的下拉关闭在同一块
   面上打架，先不做了；ACT.mic → micStart()，micStart 里已经带了开关语义。 */

/* ---- 软键盘 -------------------------------------------------------------
   前两版是「把抽屉往上挪 --kb」。真机上不成 —— iOS 自己还会滚一道、布局
   视口又不缩，两边一叠，抽屉就飞到半空。

   这一版换了个根：**把整台「手机」缩到可视视口那么高**。
   `.phone` 的高度 = visualViewport.height，里面的正文、底栏、抽屉全都跟着
   重排一遍，`bottom:0` 自然落在键盘上沿 —— 不需要谁去补偿谁。
   键盘收回去，vv.height 变回满屏，高度也就还原。

   只在真机尺寸下这么做：桌面上 .phone 是一台画出来的手机，不该跟着窗口缩。 */
const vv = window.visualViewport;
const onPhone = () => matchMedia("(max-width:600px)").matches ||
  matchMedia("(display-mode:standalone)").matches;
/* 老浏览器不认 overflow:clip 的话，被滚了就滚回去 */
app.addEventListener("scroll", () => { if (app.scrollTop) app.scrollTop = 0; });
/* 背景那层 64 秒的循环：页面切到后台就暂停。浏览器多半也会替我们降频，
   但它只是「多半」，而这一层是常驻的。 */
document.addEventListener("visibilitychange", () => {
  document.documentElement.classList.toggle("bg-still", document.hidden);
});
if (vv) {
  const syncKb = () => {
    const kb = Math.max(0, window.innerHeight - vv.height);
    /* 一两像素的抖动别往上写，会让抽屉发颤 */
    app.style.setProperty("--kb", (kb > 24 ? kb : 0) + "px");
    if (onPhone()) app.style.height = Math.round(vv.height) + "px";
    else app.style.removeProperty("height");
    /* iOS 还会为了露光标把窗口滚一道 —— 滚回去，不然又多一次位移 */
    if (vv.offsetTop > 0 || window.scrollY > 0) window.scrollTo(0, 0);
    if (app.scrollTop) app.scrollTop = 0;
  };
  vv.addEventListener("resize", syncKb);
  vv.addEventListener("scroll", syncKb);
  window.addEventListener("orientationchange", () => setTimeout(syncKb, 200));
  syncKb();
}

/* ---- 抽屉往下拖就关掉 ---------------------------------------------------
   从顶上那一截（把手 + 标题那一行）往下拉，抽屉跟手；松手时拉过 90px
   或者甩得够快就关掉，否则弹回去。
   只有抽屉已经滚到顶才接管 —— 不然会把内部滚动抢走。
   输入框和按钮上按下不接管，那儿的手势属于它们自己。 */
let shState = null;
const SH_GRAB = 72;                  /* 顶上这么高的一截算「把手区」 */
const shEl = () => app.querySelector(".sheet");

app.addEventListener("pointerdown", (e) => {
  const sh = e.target.closest(".sheet");
  if (!sh || shState) return;
  if (e.target.closest("input,textarea,select,button,[data-a]")) return;
  if (sh.scrollTop > 0) return;
  const top = sh.getBoundingClientRect().top;
  if (e.clientY - top > SH_GRAB) return;
  shState = { sh, y0: e.clientY, t0: performance.now(), dy: 0, on: false };
});
app.addEventListener("pointermove", (e) => {
  if (!shState) return;
  const dy = e.clientY - shState.y0;
  if (!shState.on) {
    if (dy < 6) { if (dy < -6) shState = null; return; }
    shState.on = true;
    shState.sh.classList.add("drag");
    shState.sh.classList.remove("anim", "snap");
  }
  /* 往上拉给阻尼，别让抽屉飞出屏幕 */
  shState.dy = dy < 0 ? dy / 4 : dy;
  shState.sh.style.transform = "translateY(" + shState.dy + "px)";
});
const endSheetDrag = () => {
  if (!shState) return;
  const { sh, dy, t0, on } = shState;
  shState = null;
  if (!on) return;
  sh.classList.remove("drag");
  const v = dy / Math.max(1, performance.now() - t0);   /* px/ms */
  /* 甩一下也能关，但必须先走够 40px —— 只看速度的话，指头一抖
     （几像素、几毫秒）算出来的速度是天文数字，抽屉会自己跑掉 */
  if (dy > 90 || (dy > 40 && v > 0.6)) {
    sh.classList.add("snap");
    sh.style.transform = "translateY(110%)";
    const d = app.querySelector(".dim"); if (d) d.classList.add("fading");
    setTimeout(closeNow, 180);   /* 这条路自己放过动画了，别再走一遍 close */
  } else {
    sh.classList.add("snap");
    sh.style.transform = "";
    setTimeout(() => sh.classList.remove("snap"), 240);
  }
};
window.addEventListener("pointerup", endSheetDrag);
window.addEventListener("pointercancel", endSheetDrag);

/* ---- 长按拖动排序 -------------------------------------------------------
   不做把手：把手要么挤掉一列版式，要么在手机上太小点不中。长按 380ms 拿起来，
   和「点一下进详情」「左滑删除」都不冲突 —— 后两个都在 380ms 内就结束了。 */
const SORTED = {
  fin: () => S.fixedIn,
  fout: () => S.fixedOut,
  debt: () => S.debts,
  acct: () => S.accounts,
  goal: () => S.goals,
  wish: () => S.wishlist,
};
let dragState = null, pressTimer = null;

function reorder(group, fromId, beforeId) {
  const arr = SORTED[group] && SORTED[group]();
  if (!arr) return;
  const key = group === "acct" ? "name" : "id";
  const from = arr.findIndex((x) => String(x[key]) === String(fromId));
  if (from < 0) return;
  const [item] = arr.splice(from, 1);
  const to = beforeId == null ? arr.length
    : arr.findIndex((x) => String(x[key]) === String(beforeId));
  arr.splice(to < 0 ? arr.length : to, 0, item);
}

function startDrag(el, y0) {
  const group = el.dataset.sg;
  const peers = [...app.querySelectorAll('.srt[data-sg="' + group + '"]')];
  if (peers.length < 2) return;
  const rects = peers.map((p) => p.getBoundingClientRect());
  dragState = { el, group, peers, rects, y0, i0: peers.indexOf(el), dy: 0,
    h: el.getBoundingClientRect().height + 8 };
  el.classList.add("lift");
  app.classList.add("dragging");
  swallow();
  if (navigator.vibrate) navigator.vibrate(8);
}

function dragTo(dy) {
  const d = dragState;
  d.dy = dy;
  d.el.style.transform = "translateY(" + dy + "px)";
  const mid = d.rects[d.i0].top + d.rects[d.i0].height / 2 + dy;
  let target = d.i0;
  d.rects.forEach((r, i) => {
    if (i === d.i0) return;
    const c = r.top + r.height / 2;
    if (i < d.i0 && mid < c) target = Math.min(target, i);
    if (i > d.i0 && mid > c) target = Math.max(target, i);
  });
  d.target = target;
  d.peers.forEach((p, i) => {
    if (i === d.i0) return;
    let shift = 0;
    if (target > d.i0 && i > d.i0 && i <= target) shift = -d.h;
    if (target < d.i0 && i < d.i0 && i >= target) shift = d.h;
    p.style.transform = shift ? "translateY(" + shift + "px)" : "";
  });
}

function endDrag() {
  const d = dragState;
  dragState = null;
  app.classList.remove("dragging");
  d.peers.forEach((p) => { p.style.transform = ""; p.classList.remove("lift"); });
  const target = d.target == null ? d.i0 : d.target;
  if (target !== d.i0) {
    const moved = d.peers[d.i0].dataset.si;
    /* 往下拖：落在目标的后面，所以基准点是「目标的下一个」 */
    const anchor = target > d.i0 ? d.peers[target + 1] : d.peers[target];
    reorder(d.group, moved, anchor ? anchor.dataset.si : null);
    render();
  }
}

function liveLabel(el, text) {
  const t = el.parentElement.querySelector(".lbl.money, .sub .money");
  if (t) t.textContent = text;
}
/* 引导页那个「添加」按钮要跟着输入实时亮起来 —— 打字不重绘，所以直接改 class */

/* 文件选择框是动态渲染出来的，所以事件挂在 app 上 */
app.addEventListener("change", (e) => {
  if (e.target.id !== "importfile" || !e.target.files || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => ACT.applyImport(String(fr.result));

});
app.addEventListener("input", (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  const v = e.target.value;
  if (f === "txq") { ui.txq = v; paintTxList(); return; }
  if (f === "pfname") { prof().name = v; save(); return; }
  if (f === "pfpayday") {
    /* 空着就是没设；1–31 之外的一律当没设，别让 0 或 45 号混进去 */
    const n = parseInt(v, 10);
    prof().payday = (n >= 1 && n <= 31) ? n : null;
    save(); return;
  }
  if (f === "qname") ui.quiz.name = v;
  else if (f === "qprice") ui.quiz.price = num(v);
  else if (f === "qnec") { ui.quiz.necessity = +v; liveLabel(e.target, v + " / 10"); }
  else if (f === "renec") { ui.f.renec = +v; liveLabel(e.target, v + " / 10"); }
  else ui.f[f] = v;
  if (f === "text") { const ok = document.getElementById("jotok");
    if (ok) ok.classList.toggle("hide", !v.trim()); }
  if (needsSetup(S)) liveWizardButton();
});
/* 「记一笔」里回车就是确认 —— 稿子那张贴着键盘，submit 键就是提交键。
   Shift+回车留给换行；中文输入法选词按的也是回车，isComposing 那一下得放过，
   不然拼音还没落地就被拿去解析了。 */
app.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.isComposing || e.keyCode === 229) return;
  if (!e.target.classList || !e.target.classList.contains("jotin")) return;
  e.preventDefault();
  ui.f.text = e.target.value;
  buzz("light");
  ACT.parse();
});
/* 打字时只存值，不重绘 —— 重绘会重建抽屉，光标和滚动位置都会丢 */
app.addEventListener("change", (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  if (e.target.type === "range") { render(); return; }
  if (e.target.tagName !== "SELECT") return;
  /* 不依赖 input 事件来存 select 的值 */
  ui.f[f] = e.target.value;
  if (f === "planId") { const p = activePlans().find((x) => x.name === e.target.value);
    ui.f.planId = p ? p.id : null; }
  ui.f.err = null;
  render();
});

const EXAMPLES = ["今天吃拉面25.5元，打车18元，看电影60元",

    updateClock(); render();
  }
  if (b.dataset.side === "reset") {
    adopt(seed()); clockOffset = 0;
    ui = { stack: ["dashboard"], sheet: null, f: {}, fStack: [], toast: null, seg: {},
      quiz: { name: "", price: 0, necessity: 5, dup: false } };
    updateClock(); render();
  }
});
ui.quiz = { name: "", price: 0, necessity: 5, dup: false };
applyTheme();
applySkin();
updateClock();
render();

/* 装 Service Worker：装完就能离线开。只在 https（或本机）下有效，
   file:// 打开时浏览器直接不给注册，所以要 try 住，别让整页崩掉。 */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* 没装上就当没有，功能不受影响 */ });
  });
}
</script>
</body>
</html>
