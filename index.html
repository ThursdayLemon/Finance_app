<meta name="mobile-web-app-capable" content="yes">

<title>储蓄教练 · 可点击原型</title>
<style>
/* ==========================================================================
   Token 层 —— 全站唯一的取色处。换肤和深色模式都只动这一块。
   语义命名，不是「灰1灰2」：以后换一套视觉，对着角色填就行。
   ========================================================================== */
:root{
  /* Phantom：单色紫 + 近白纸面。结构色只有一个 aubergine。
     判定色的黄和红是往紫里调过的 —— 直接上鲜艳橙红会打破这套的克制。 */
  --aubergine:#3c315b; --ghost:#b9a9f5; --peri:#ab9ff2;
  --ink:#1c1c1c;          /* 正文墨色 */
  --ink-2:#3c315b;        /* 次级正文 —— 用品牌紫，标题和导航靠它 */
  --muted:#86848d;        /* 说明小字 */
  --faint:#9a97a2;        /* 更弱的字、图标 */
  --ghosted:#bbb8c4;      /* 禁用态 */
  --paper:#f4f2f6;        /* 页面底 —— 比卡片深一点，卡片才不用描边 */
  --surface:#fdfcfe;      /* 卡片底 */
  --surface-2:#eae8ee;    /* 次级面：按下、条带 */
  --surface-3:#3c315b;    /* 三级面：底部 tab 栏走深紫 */
  --line:#eceaf0;         /* 分隔线 */
  --line-2:#fdfcfe;       /* 卡片描边 —— 和卡片同色，等于没有边 */
  --edge:#e0dee4;         /* 控件描边 */
  --edge-2:#dcdae1;       /* 输入框描边 */
  --track:#e9e8ea;        /* 进度条底槽 */
  --press:#eceaf0;        /* 按下反馈 */
  --chev:#bbb8c4;         /* 右侧箭头 */
  /* 深紫 tab 栏上的字：不能跟着 --paper 走，深色下 --paper 也是暗的，
     选中那一项会变成深字压深底，直接看不见 */
  --nav-ink:#9a92b4; --nav-on:#fdfcfe;
  --link:#7a6bc4;         /* 文字链 */
  /* 看真机截图改的：Phantom 自己的 app 里涨跌就是鲜明的红绿，
     没有往紫里调 —— 判定一眼就得认出来，这比色板统一重要 */
  --good:#12b76a;
  --warn:#dc9317;
  --bad:#e8383b;
  --good-bg:#e8f8f0;
  --warn-bg:#fdf3e2;
  --bad-bg:#fdedec;
  --ramp-1:#3c315b; --ramp-2:#6a5d90; --ramp-3:#9a8fbb;
  --ramp-4:#bdb4d6; --ramp-5:#d6d0e8; --ramp-6:#e9e6f2;
  --stage:#eae8ee;        /* 桌面上手机外面那片底 */
  --note:#fffec4;         /* 桌面说明栏里的便签 */
  --note-line:#d8d4a0;
  --note-ink:#6b6730;
  /* 「一切都是胶囊」是这套的签名，圆角整体推大一档 */
  --r-sm:10px; --r:16px; --r-md:20px; --r-lg:28px; --r-pill:100px;
  /* 这套只允许一处阴影：主按钮那圈淡紫光晕 */
  --shadow-fab:none;
  --shadow-pill:rgb(226,223,254) 0 0 4px 0;
  --shadow-sheet:0 -12px 40px -24px rgba(60,49,91,.45);
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",
    -apple-system,"Helvetica Neue",Helvetica,sans-serif;
  /* 那份 style reference 写的是官网：350 whisper weight。但真机截图里
     app 本身不是那样 —— 段落标题和所有数值都是实打实的粗体。
     做 app 以 app 为准：正文 400，标题和金额 600。 */
  --w-body:400; --w-mid:500; --w-bold:600;
}

/* ---- 深色 ---------------------------------------------------------------
   不是把浅色反过来 —— 纸墨互换之后对比度和判定色都得重新挑。
   三种状态：跟随系统（不带 data-theme）、明确选浅色、明确选深色。 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
  --aubergine:#e2dffe; --ghost:#b9a9f5; --peri:#ab9ff2;
    --ink:#f5f5f5; --ink-2:#f5f5f5; --muted:#8e8e93; --faint:#7a7a80; --ghosted:#5a5a60;
    --paper:#0b0b0c; --surface:#161617; --surface-2:#1f1f21; --surface-3:#000;
    --line:#252527; --line-2:#161617; --edge:#2c2c2f; --edge-2:#38383c;
    --track:#2c2c2f; --press:#252527; --chev:#5a5a60; --link:#ab9ff2;
    --nav-ink:#6e6e75; --nav-on:#ffffff;
    --good:#32d583; --warn:#f5b445; --bad:#ff4d4f;
    --good-bg:#12291f; --warn-bg:#2b2313; --bad-bg:#2c1516;
    --ramp-1:#ab9ff2; --ramp-2:#8b7fd0; --ramp-3:#6d63a8;
    --ramp-4:#524a80; --ramp-5:#3a3459; --ramp-6:#282436;
    --stage:#000; --note:#2b2313; --note-line:#5c4a1c; --note-ink:#e0cd8c;
    --shadow-fab:none;
    --shadow-pill:none;
    --shadow-sheet:0 -12px 40px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] { color-scheme: dark;
  --aubergine:#e2dffe; --ghost:#b9a9f5; --peri:#ab9ff2;
  --ink:#f5f5f5; --ink-2:#f5f5f5; --muted:#8e8e93; --faint:#7a7a80; --ghosted:#5a5a60;
  --paper:#0b0b0c; --surface:#161617; --surface-2:#1f1f21; --surface-3:#000;
  --line:#252527; --line-2:#161617; --edge:#2c2c2f; --edge-2:#38383c;
  --track:#2c2c2f; --press:#252527; --chev:#5a5a60; --link:#ab9ff2;
  --nav-ink:#6e6e75; --nav-on:#ffffff;
  --good:#32d583; --warn:#f5b445; --bad:#ff4d4f;
  --good-bg:#12291f; --warn-bg:#2b2313; --bad-bg:#2c1516;
  --ramp-1:#ab9ff2; --ramp-2:#8b7fd0; --ramp-3:#6d63a8;
  --ramp-4:#524a80; --ramp-5:#3a3459; --ramp-6:#282436;
  --stage:#000; --note:#2b2313; --note-line:#5c4a1c; --note-ink:#e0cd8c;
  --shadow-fab:none;
  --shadow-pill:none;
  --shadow-sheet:0 -12px 40px -24px rgba(0,0,0,.9);
}

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--stage);color:var(--ink);line-height:1.5;font-size:14px;
 font-weight:var(--w-body);
 font-family:var(--font);
 -webkit-font-smoothing:antialiased}
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;
 padding:40px 28px 80px;flex-wrap:wrap}
.side{width:300px;padding-top:6px}
.side h1{font-size:22px;font-weight:600;margin:0 0 8px}
.side p{font-size:13px;color:var(--ink-2);margin:0 0 14px;line-height:1.65}
.side h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);
 margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--chev)}
.side .k{display:flex;flex-wrap:wrap;gap:7px}
.side button{font:inherit;font-size:12px;border:1px solid var(--ink);background:var(--paper);
 border-radius:var(--r-pill);padding:6px 12px;cursor:pointer}
.side button:hover{background:var(--ink);color:var(--paper)}
.side .hint{font-family:"Caveat",cursive;font-size:16px;color:var(--note-ink);background:var(--note);
 border:1px dashed var(--note-line);border-radius:var(--r-sm);padding:8px 11px;line-height:1.35}
.side .ex{font-size:12px;color:var(--ink-2);line-height:1.9;margin:0;padding-left:16px}
.side .clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);margin:8px 0 0}

.phone{width:390px;height:844px;border:1px solid var(--line-2);border-radius:var(--r-lg);
 background:var(--paper);
 overflow:hidden;display:flex;flex-direction:column;position:relative;flex-shrink:0;
 box-shadow:var(--shadow-sheet)}
.inset{height:40px;flex-shrink:0}
.nav{min-height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0;
 border-bottom:1px solid var(--line)}
.navt{font-size:20px;font-weight:var(--w-bold);color:var(--ink-2);letter-spacing:-.02em}
.body{flex:1;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;
 overflow-y:auto;overflow-x:hidden}
/* flex 列里子项默认会被压扁去适配容器（.sw 带 overflow:hidden 会直接塌成一条缝）—— 
   一律不许收缩，超出就滚动 */
.body > *{flex-shrink:0}
/* 悬浮按钮浮在正文之上（bottom:78 + 56 高 = 盖住标签栏往上 72px），
   所以有它的页面要把这块高度垫出来，不然年视图这种长页面最后一张卡会被压住 */
.body.hasfab{padding-bottom:88px}
.tabs{height:66px;border-top:1px solid var(--line);display:flex;flex-shrink:0;
 background:var(--surface-3)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 font-size:10px;color:var(--nav-ink);cursor:pointer}
.tab.on{color:var(--nav-on);font-weight:var(--w-mid)}
.tab:active{background:rgba(255,255,255,.07)}
.fab{position:absolute;right:16px;bottom:78px;width:56px;height:56px;border-radius:50%;
 background:var(--ink-2);color:var(--paper);display:flex;align-items:center;
 justify-content:center;cursor:pointer;box-shadow:var(--shadow-fab)}
.fab:active{transform:scale(.94)}
.fabrow{position:absolute;right:16px;bottom:78px;display:flex;align-items:center;gap:10px}
.fabrow .fab{position:static}
.fabpill{height:56px;border-radius:var(--r-pill);background:var(--ghost);border:0;
 color:#1c1c1c;
 display:flex;align-items:center;gap:7px;padding:0 20px;font-size:15px;font-weight:500;
 cursor:pointer;box-shadow:var(--shadow-pill);white-space:nowrap}
.fabpill:active{transform:scale(.97)}

/* 真机上卡片没有描边 —— 靠自己的填充比页面底浅一档来分层 */
.card{border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);
 padding:17px 18px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--surface-2)}
.lbl,.sub{font-size:12px;color:var(--muted)}
.h2{font-size:16px;font-weight:var(--w-bold);color:var(--ink-2)}
.big{font-size:34px;font-weight:var(--w-bold);font-variant-numeric:tabular-nums;
 letter-spacing:-.025em}
.num{font-size:17px;font-weight:var(--w-bold);font-variant-numeric:tabular-nums;
 letter-spacing:-.025em}
/* 金额破例走 500；负字距只给数字，压中文会让字挤在一起 */
.money{font-variant-numeric:tabular-nums;font-weight:var(--w-bold);letter-spacing:-.025em}
.row{min-height:54px;display:flex;align-items:center;gap:11px;padding:7px 0;
 border-bottom:1px solid var(--line)}
.card .row:last-child{border-bottom:0}
.chip{border:1px solid var(--edge);border-radius:var(--r-pill);padding:5px 13px;
 font-size:12px;background:var(--surface-2);color:var(--ink-2);
 display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ghost);border-color:var(--ghost);color:#1c1c1c;
 font-weight:var(--w-mid);box-shadow:var(--shadow-pill)}
.chip.flat{cursor:default}
/* 自定义分类就是普通标签，只是右边多一个 ×；「新建」是同一个壳子，描边改虚线 */
.chip.newcat{border-style:dashed;color:var(--muted)}
.chip .tag-x{margin:-4px -8px -4px -1px;padding:4px 8px;display:inline-flex;align-items:center;
 color:var(--ghosted)}
.chip .tag-x:active{color:var(--ink)}
.mbtn{min-height:50px;border:1px solid var(--edge);background:var(--surface-2);
 border-radius:var(--r-pill);display:flex;align-items:center;
 justify-content:center;gap:7px;font-size:15px;font-weight:500;background:var(--surface);padding:0 14px;
 cursor:pointer;text-align:center;color:var(--ink)}
.mbtn:active{transform:translateY(1px)}
.mbtn.pri{background:var(--ghost);border-color:var(--ghost);color:#1c1c1c;
 font-weight:var(--w-bold);box-shadow:var(--shadow-pill)}
.mbtn.off{color:var(--ghosted);border-color:var(--chev);background:var(--surface-2);cursor:not-allowed}
.mbtn.sm{min-height:40px;font-size:13px}
.barh{height:8px;background:var(--track);border-radius:var(--r-pill);overflow:hidden}
.barh>i{display:block;height:100%;background:var(--peri);transition:width .35s ease}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.banner{border:1px solid;border-radius:var(--r-md);padding:12px 14px;font-size:13px;
 display:flex;gap:9px;
 align-items:flex-start;line-height:1.45}
.banner.tap{cursor:pointer}
.dash{border:1px dashed var(--peri);border-radius:var(--r-pill);background:transparent;
 min-height:54px;
 display:flex;align-items:center;justify-content:center;gap:7px;color:var(--faint);font-size:14px;
 cursor:pointer}
.dash:active{background:var(--press)}
.fld{display:flex;flex-direction:column;gap:5px}
.fldbox,input.fldbox,select.fldbox{min-height:48px;border:1px solid var(--edge-2);
 background:var(--surface-2);border-radius:var(--r);
 background:var(--surface);display:flex;align-items:center;padding:0 12px;font-size:15px;gap:8px;
 font-family:inherit;color:inherit;width:100%}
input.fldbox,select.fldbox{-webkit-appearance:none;appearance:none}
input.fldbox:focus,select.fldbox:focus{outline:none;border-color:var(--ink);border-width:1.5px}
select.fldbox{cursor:pointer;background-image:linear-gradient(45deg,transparent 49%,var(--faint) 51%),
 linear-gradient(135deg,var(--faint) 49%,transparent 51%);
 background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.fldbox.err{border-color:var(--bad);border-width:1.5px}
.errline{display:flex;gap:7px;font-size:13px;color:var(--bad);align-items:flex-start}
.seg{display:flex;border:0;border-radius:var(--r-pill);overflow:hidden;
 background:var(--surface-2);padding:3px;font-weight:var(--w-mid)}
.seg>span{flex:1;padding:9px 0;text-align:center;font-size:14px;cursor:pointer;
 border-radius:var(--r-pill);color:var(--ink-2)}
.seg>span.on{background:var(--surface);color:var(--ink);font-weight:var(--w-bold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:var(--r-pill);
 background:var(--track);margin:16px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
 border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);cursor:pointer}
.toggle{width:44px;height:26px;border-radius:var(--r-pill);border:1px solid var(--edge);
 background:var(--surface-2);
 position:relative;flex-shrink:0;cursor:pointer;transition:background .2s}
.toggle>i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
 background:var(--line-2);transition:left .2s,background .2s}
.toggle.on{background:var(--peri);border-color:var(--peri)}
.toggle.on>i{left:21px;background:var(--paper)}
/* 左滑删除：红底垫在下面，内容层往左推 */
/* 红底放在删除面板上，不要放在容器上 —— 容器铺红色会在行与行之间透出红缝 */
/* 跟着里面卡片的圆角裁 —— 否则四个圆角处会透出底下的红色删除面板 */
/* 外壳的圆角必须 >= 里面卡片的，否则卡片四角外会露出底下那层红 */
.sw{position:relative;overflow:hidden;border-radius:var(--r-lg)}
/* 自己也圆一下：不然它的直角顶在卡片圆角的抗锯齿边上，会透出一条红发丝 */
.sw-del{position:absolute;top:0;right:0;bottom:0;width:76px;color:#fff;
 border-radius:var(--r-lg);display:flex;
 align-items:center;justify-content:center;cursor:pointer;background:var(--bad)}
/* 跟外壳一样圆：卡片圆角外那一圈才不会露出底下的红 */
.sw-body{position:relative;background:var(--paper);border-radius:inherit;
 transition:transform .18s ease;touch-action:pan-y}
/* 长按拿起来排序：不加把手，不改版式 —— 点还是进详情，左滑还是删除 */
.srt{transition:transform .16s ease}
.srt.lift{position:relative;z-index:6;transition:none;
 box-shadow:0 10px 24px -10px rgba(34,32,28,.55);border-radius:var(--r-md)}
.srt.lift .sw-body,.srt.lift.card{background:var(--paper)}
.dragging{touch-action:none;user-select:none}
.card .sw-body{background:var(--surface)}
.sw.open .sw-body{transform:translateX(-76px)}
.dim{position:absolute;inset:0;background:rgba(34,32,28,.36)}
.dim.anim{animation:fade .18s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:0;
 border-radius:var(--r-lg) var(--r-lg) 0 0;padding:10px 16px 20px;display:flex;flex-direction:column;gap:11px;
 max-height:88%;overflow-y:auto}
.sheet.anim{animation:up .24s cubic-bezier(.2,.8,.3,1)}
.grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--chev);align-self:center;
 margin-bottom:5px;flex-shrink:0}
.toast.high{bottom:auto;top:52px}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink-2);
 color:var(--paper);border-radius:var(--r-pill);
 border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;
 animation:up .2s ease;z-index:5}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wave{display:flex;gap:4px;align-items:center;justify-content:center;height:44px}
.wave>span{width:3px;background:var(--chev);border-radius:var(--r-sm);height:9px}
.wave.on>span{background:var(--ink);animation:w .9s ease-in-out infinite}
@keyframes w{0%,100%{height:9px}50%{height:34px}}
textarea.fldbox{min-height:72px;padding:11px 12px;resize:none;line-height:1.5;
 align-items:flex-start;display:block}

/* ---- 真机 ----------------------------------------------------------------
   桌面上是一台画出来的手机（边框 + 右边的说明栏）；真在手机上打开时那圈边框
   反而挡地方，所以铺满屏幕，并把刘海和 home 条的高度让出来。
   加到主屏幕后 display-mode:standalone 也走这一套。 */
@media (max-width:600px), (display-mode:standalone) {
  body{overflow:hidden}
  .stage{display:block;padding:0;gap:0}
  .side{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .inset{height:env(safe-area-inset-top)}
  .tabs{height:calc(62px + env(safe-area-inset-bottom));
   padding-bottom:env(safe-area-inset-bottom)}
  .fab,.fabrow,.toast{bottom:calc(78px + env(safe-area-inset-bottom))}
  .body.hasfab{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .toast.high{bottom:auto}
}
</style>
</head>
<body>
<div class="stage">
  <div class="side">
    <h1>储蓄教练 · 可点击原型</h1>
    <p>和线框同一套视觉，但逻辑是真的：决策分数按 <code>finance_core</code>
       的公式算，余额不够真的会被拦，冷静期和攒物计划都是真状态。</p>
    <div class="hint">底部四个 Tab 都能点。财况页的月份可以往前翻，<br/>右下角麦克风试试说一句话。</div>

    <h2>试试这些语音</h2>
    <ol class="ex" id="examples"></ol>

    <h2>时间</h2>

const FLOOR_RATIO = 0.05;
const floorBudget = (income) => Math.max(0, Math.round(income * FLOOR_RATIO));

function evaluatePurchase(price, budget, necessity, saveMode, dup) {
  const base = necessity * 10;
  const ratio = budget > 0 ? (price / budget) * 100 : 100;
  const incomePenalty = ratio * (saveMode ? 4 : 1.5);
  const modePenalty = saveMode ? 10 : 0;
  const dupPenalty = dup ? (saveMode ? 40 : 15) * Math.min(1, ratio / 1) : 0;
  const score = Math.max(0, Math.min(100,
    base - incomePenalty - dupPenalty - modePenalty));
  const r1 = (n) => Math.round(n * 10) / 10;
  return {
    score: r1(score), base: r1(base), ratio: Math.round(ratio * 100) / 100,
    incomePenalty: r1(incomePenalty), dupPenalty: r1(dupPenalty),
    modePenalty: r1(modePenalty), saveMode, dup,
    verdict: score >= 75 ? "green" : score >= 45 ? "amber" : "red",
  };
}
const goalMonthly = (g) =>
  g.months > 0 ? Math.round(Math.max(0, g.target - g.saved) / g.months) : 0;
const goalPct = (g) =>
  g.target > 0 ? Math.max(0, Math.min(100, (g.saved / g.target) * 100)) : 100;
const debtCommit = (s) => s.debts.reduce((a, d) => a + d.monthly, 0);
const goalCommit = (s) => s.goals.reduce((a, g) => a + goalMonthly(g), 0);
/* 固定收入 / 固定支出（含还贷）—— 每个月都算，不需要记进账本 */
const fixedIn = (s) => s.fixedIn.reduce((a, x) => a + x.amount, 0);
const fixedOut = (s) => s.fixedOut.reduce((a, x) => a + x.amount, 0) + debtCommit(s);
const committed = (s) => fixedOut(s) + goalCommit(s);
const netAssets = (s) => s.accounts.reduce((a, j) => a + j.balance, 0);
/* 攒钱不是支出，是结余的去处 —— 所以只统计「这个月划走了多少」，不进支出 */
/* 只扣「已经确认发生」的：自动的到日子自动记，手动的要你点过「这月已存」。
   没兑现的那部分只提示「还需存」，不扣 —— 扣了就是把还没走的钱当走了。 */
const savedIn = (m) => S.goals.reduce((a, g) => a + ((g.marks[m] || {}).amt || 0), 0);
const stillToSave = (s2) => Math.max(0, goalCommit(s2) - savedIn(thisMonth()));

/* 一个账户里有多少钱已经被目标预留 */
const lifePct = () => S.lifeGoal && S.lifeGoal.target > 0
  ? Math.min(100, (netAssets(S) / S.lifeGoal.target) * 100) : 0;
const earmarkOn = (name) => S.goals.filter((g) => g.account === name)
  .reduce((a, g) => a + g.saved, 0);
/* 这个月这个目标存了没：自动的按日子算，手动的看用户答过没 */
/* marks[月份] = {k:"done"|"skip"|"auto", amt} —— amt 记下当时加了多少，
   撤销才退得回原值（按当下的「每月必存」倒扣会差一截） */

  /* 用空格替换而不是删掉：直接删会让「spent」和「on」粘成「spenton」，
     后面那步按词删动词就再也匹配不上 */
  const d = R().tidy(clause.replace(R().unit, " ").replace(R().verb, " ").trim());
  return d || (isIncome ? t("parse.someIncome") : t("parse.someSpend", { cat: catLabel(cat) }));
}
function isAssetMove(t2) {
  return has(t2, R().strongAsset) || R().assetMove.test(t2);
}
function parseUtterance(text) {
  const raw = (text || "").trim();
  if (!raw) return null;

  if (!has(raw, R().nonLedger) && !isAssetMove(raw)) {
    const drafts = [];
    for (const clause of raw.split(R().clause)) {
      const c = (clause || "").trim();
      if (!c) continue;
      const amts = extractAmounts(c);
      if (!amts.length) continue;
      const isIncome = has(c, R().income);
      const cat = classify(c, isIncome);
      drafts.push({ type: isIncome ? "in" : "out", amount: amts[0],
        category: cat, description: cleanDesc(c, cat, isIncome), date: today() });
    }
    if (drafts.length > 1) return { intent: "multi_ledger", raw, drafts };
    if (drafts.length === 1) return { intent: "ledger", raw, drafts };
  }

  const amts = extractAmounts(raw);
  const amount = amts[0] || 0;

  if (has(raw, R().decision)) {
    let necessity = R().necessity(raw);
    if (necessity != null) necessity = Math.max(1, Math.min(10, necessity));
    else {
      necessity = 5;
      for (const a of amts)
        if (a !== amount && a >= 100 && a <= 1000) { necessity = a / 100; break; }
    }
    const name = R().wantName(raw) || t("parse.someThing");
    return { intent: "decision", raw, item: { name, price: amount,
      necessity, dup: has(raw, R().dup) } };
  }

  if (has(raw, R().plan)) {
    if (has(raw, R().debt)) {
      return { intent: "debt", raw,
        debt: { description: t("parse.debt." + R().debtKind(raw)), monthly: amount } };
    }
    const months = R().months(raw) || 12;
    const name = R().goalName(raw) || t("parse.someGoal");
    return { intent: "goal", raw, goal: { name, target: amount, months } };
  }

  if (has(raw, R().asset) || isAssetMove(raw)) {
    const parts = R().transferParts(raw);
    const from = parts.from ? canonAccount(parts.from) : "";
    const to = parts.to ? canonAccount(parts.to) : "";
    if (from && to) return { intent: "transfer", raw, move: { from, to, amount } };
    return { intent: "deposit", raw,
      move: { to: to || biggestJar(), amount } };
  }

  const isIncome = has(raw, R().income);
  const cat = classify(raw, isIncome);
  return { intent: "ledger", raw, drafts: [{ type: isIncome ? "in" : "out",
    amount, category: cat,
    description: raw.length > 15 ? raw.slice(0, 15) + "…" : raw, date: today() }] };
}

const SAVE_KEY = "savingcoach.v1";

const MIGRATIONS = {};

let saveTimer = null, saveBroken = false;
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    try {
      localStorage.setItem(SAVE_KEY,
        JSON.stringify({ v: SCHEMA, savedAt: Date.now(), data: S }));
      saveBroken = false;
    } catch (err) {
      /* 无痕模式、存储写满、被系统清了 —— 记账这个动作不能因此崩掉，
         但要让人知道这次没存下，否则他以为存了 */
      if (!saveBroken) { saveBroken = true; toast(t("k.saveFailed")); }
    }
  }, 300);
}

function stash(raw, why) {                 // 读不懂的原样留一份，绝不覆盖
  /* 只用毫秒当后缀不够：同一毫秒里存两份，第二份会把第一份盖掉 */
  try { localStorage.setItem(SAVE_KEY + ".broken." + Date.now() + "-" + ++stashN,
    JSON.stringify({ why, raw })); } catch (err) { /* 存不下也只能算了 */ }
}
function load() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (err) { return null; }
  if (!raw) return null;
  let box;
  try { box = JSON.parse(raw); } catch (err) { stash(raw, "parse"); return null; }
  const v = box && box.v, d = box && box.data;
  if (!d || typeof v !== "number") { stash(raw, "shape"); return null; }
  if (v > SCHEMA) { stash(raw, "newer"); return null; }   // 老代码遇到新数据：不动它
  let cur = v;
  while (cur < SCHEMA) {
    const step = MIGRATIONS[cur];
    if (!step) { stash(raw, "no-migration-" + cur); return null; }
    try { step(d); } catch (err) { stash(raw, "migration-" + cur); return null; }
    cur++;
  }

}

function donut(cats, size, thick) {
  const total = cats.reduce((a, c) => a + c[1], 0) || 1;
  const r = (size - thick) / 2, C = 2 * Math.PI * r;

  const segs = cats.map(([, v], i) => {
    const len = (v / total) * C;

    const el = '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r +
      '" fill="none" stroke="' + RAMP[Math.min(i, RAMP.length - 1)] +
      '" stroke-width="' + thick + '" stroke-dasharray="' + draw.toFixed(2) + " " +
      (C - draw).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"></circle>';
    off += len;
    return el;

function yearView() {
  const y = viewYear(), act = activeMonths(y), shown = shownMonths(y);
  const inc = sumOver(act, (m) => incomeIn(S, m));
  const out = sumOver(act, (m) => outgoIn(S, m));
  const saved = sumOver(act, savedIn);
  const net = inc - out - saved;
  const n = act.length;
  const fixInc = fixedIn(S) * n;
  const fixOut = S.fixedOut.reduce((a, x) => a + x.amount, 0) * n;
  const debtOut = debtCommit(S) * n;
  const txIn = sumOver(act, (m) => earnedIn(S, m));
  const txOut = sumOver(act, (m) => spentIn(S, m));
  const label = (name, v) => '<div style="display:flex;align-items:baseline;gap:9px;' +
    'padding:6px 0;border-bottom:1px dotted var(--line-2)">' +
    '<div class="sub" style="flex:1">' + name + "</div>" +
    '<div class="money" style="font-size:14px">' + yuan(v) + "</div></div>";
  const arrow = (dir, on) => '<div ' + (on ? 'data-a="month:' + dir + '"' : "") +
    ' style="padding:6px;cursor:' + (on ? "pointer" : "default") + ";color:" +
    (on ? "var(--ink)" : "var(--chev)") + '">' + ic(dir === "prev" ? "back" : "chev", 17) + "</div>";
  const monthNames = act.map((x) => t("date.monthShort", { m: x.slice(5) }));
  const sep = isEn() ? ", " : "、";
  return { tab: "dashboard", fab: "both",
    nav: '<div class="chip" data-a="settings" style="padding:4px 9px">' + t("nav.me") + "</div>" +
      '<div style="flex:1;display:flex;align-items:center;justify-content:center;gap:2px">' +
      arrow("prev", true) +
      '<div class="h2" style="min-width:78px;text-align:center">' +
      t("date.year", { y }) + "</div>" +
      arrow("next", +y < +thisMonth().slice(0, 4)) + "</div>" +
      scopeToggle(),
    body:
      (n === 0
        ? '<div class="dash" style="min-height:150px;cursor:default;flex-direction:column;' +
          'gap:6px;padding:0 26px;text-align:center">' + t("yr.empty", { y }) + "<br/>" +
          t("yr.emptyHint") + "</div>"
        : '<div class="card">' +
          '<div class="lbl">' + t("yr.headline", { y, neg: net < 0 }) + "</div>" +
          '<div class="big" style="margin:2px 0;color:' + (net < 0 ? RED : GREEN) + '">' +
          (net < 0 ? neg(-net) : plus(net)) + "</div>" +
          '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:2px">' +
          '<div class="sub">' + t("word.income") +
          ' <span class="money" style="color:var(--ink)">' + yuan(inc) + "</span></div>" +
          '<div class="sub">− ' + t("word.spending") +
          ' <span class="money" style="color:var(--ink)">' + yuan(out) + "</span></div>" +
          (saved ? '<div class="sub">− ' + t("word.savings") +
            ' <span class="money" style="color:var(--ink)">' + yuan(saved) + "</span></div>"
            : "") + "</div>" +
          '<div class="sub" style="font-size:11px;margin-top:8px;padding-top:7px;' +
          'border-top:1px solid var(--line)">' + t("yr.range", {
            from: firstMonth().slice(5),
            list: monthNames.length <= 4 ? monthNames.join(sep)
              : monthNames[0] + " – " + monthNames[monthNames.length - 1], n }) +
          "</div></div>" +

          '<div class="card">' +
          '<div class="h2" style="margin-bottom:4px">' + t("word.income") + " " +
          '<span class="money sub">' + yuan(inc) + "</span></div>" +
          label(t("yr.timesN", { what: t("word.fixedIn"), n }), fixInc) +
          label(t("yr.ledgerIn"), txIn) +
          '<div class="h2" style="margin:12px 0 4px">' + t("word.spending") + " " +
          '<span class="money sub">' + yuan(out) + "</span></div>" +
          label(t("yr.timesN", { what: t("word.fixedOut"), n }), fixOut) +
          label(t("yr.timesN", { what: t("word.debt"), n }), debtOut) +
          label(t("yr.ledgerOut"), txOut) +
          '<div class="h2" style="margin:12px 0 4px">' + t("word.savings") + " " +
          '<span class="money sub">' + yuan(saved) + "</span></div>" +
          label(t("yr.confirmed"), saved) +
          '<div class="sub" style="font-size:11px;margin-top:8px">' + t("yr.note") +
          "</div></div>" +

          '<div style="display:flex;align-items:center;gap:9px;margin-top:2px">' +
          '<div class="h2" style="flex:1">' + t("yr.monthly") + "</div>" +
          '<div class="sub" data-a="cats" style="cursor:pointer;color:var(--link)">' +
          t("word.breakdown") + ic("chev", 13) + "</div></div>" +
          shown.map((mm) => {
            const has = hasRecords(mm);
            const v = has ? incomeIn(S, mm) - outgoIn(S, mm) - savedIn(mm) : 0;
            const max = Math.max(1, ...shown.filter(hasRecords)
              .map((x) => Math.abs(incomeIn(S, x) - outgoIn(S, x) - savedIn(x))));
            return '<div class="row" data-a="toMonth:' + mm + '" style="cursor:pointer;' +
              (has ? "" : "opacity:.45;") + 'min-height:48px">' +
              '<div class="sub" style="width:38px">' +
              t("date.monthShort", { m: mm.slice(5) }) + "</div>" +
              '<div style="flex:1">' + (has ? bar((Math.abs(v) / max) * 100,
                v < 0 ? RED : GREEN) : bar(0)) + "</div>" +
              '<div class="money" style="font-size:14px;width:92px;text-align:right;color:' +
              (has ? (v < 0 ? RED : "var(--ink)") : "var(--ghosted)") + '">' +
              (has ? (v < 0 ? neg(-v) : plus(v)) : t("yr.noRecord")) + "</div></div>";
          }).join("")) };
}

/* 手动的储蓄和还贷要人每月点一次，人一定会忘 —— 过了日子还没答就在财况页上催。
   自动项不会出现在这里。 */
function pendingConfirms() {
  const d = +today().slice(8), out = [];
  S.goals.forEach((g) => { if (!g.auto && goalMark(g) === "pending" && d >= g.day)
    out.push({ kind: "goal", id: g.id, name: g.name, amount: goalMonthly(g), day: g.day }); });
  S.debts.forEach((x) => { if (!x.auto && debtMark(x) === "pending" && d >= x.day)
    out.push({ kind: "debt", id: x.id, name: x.description, amount: x.monthly, day: x.day }); });
  return out;
}
function confirmCard() {
  const list = pendingConfirms();
  if (!list.length) return "";
  return '<div class="card" style="border-color:' + AMBER + ";background:" + AMBER_BG + '">' +
    '<div style="display:flex;align-items:baseline;gap:9px">' +
    '<span style="color:' + AMBER + '">' + ic("warn", 15) + "</span>" +
    '<div class="h2" style="flex:1;font-size:14px">' +
    t("cf.title", { n: list.length }) + "</div></div>" +
    '<div class="sub" style="font-size:11px;margin:2px 0 4px">' + t("cf.hint") + "</div>" +
    list.map((x) => '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;' +
      'border-top:1px solid rgba(0,0,0,.06)">' +
      '<div style="flex:1;min-width:0"><div style="font-size:14px">' + esc(x.name) + "</div>" +
      '<div class="sub" style="font-size:11px">' + t("date.onDay", { day: x.day }) +
      " · " + yuan(x.amount) + "</div></div>" +
      '<div class="mbtn sm" data-a="' + (x.kind === "goal" ? "goalDone:" : "debtDone:") + x.id +
      '" style="min-height:34px;padding:0 12px">' +
      t(x.kind === "goal" ? "cf.saved" : "cf.paid") + "</div>" +
      '<div class="mbtn sm" data-a="' + (x.kind === "goal" ? "goalSkip:" : "debtSkip:") + x.id +
      '" style="min-height:34px;padding:0 12px">' + t("cf.no") +
      "</div></div>").join("") + "</div>";
}

/* 进来之后按需补：缺什么列什么，点一下直接去加，看烦了能关掉 */
function setupCard() {
  if (ui.setupDismissed) return "";
  const miss = [];
  const cap = (x) => isEn() ? x.charAt(0).toUpperCase() + x.slice(1) : x;
  if (!S.fixedOut.length)
    miss.push([cap(t("word.fixedOut")), t("su.outSub"), "route:out"]);
  if (!S.debts.length) miss.push([cap(t("word.debtLong")), t("su.debtSub"), "route:debt"]);
  if (!S.goals.length) miss.push([cap(t("word.fixedSave")), t("su.saveSub"), "toSavings2"]);
  if (!miss.length) return "";
  return '<div class="card" style="border-style:dashed">' +
    '<div style="display:flex;align-items:baseline;gap:9px">' +
    '<div class="h2" style="flex:1">' + t("su.title") + "</div>" +
    '<div class="sub" data-a="dismissSetup" style="cursor:pointer">' + t("su.later") +
    "</div></div>" +
    '<div class="sub" style="font-size:11px;margin:2px 0 6px">' + t("su.hint") + "</div>" +
    miss.map((x) => '<div class="row" data-a="' + x[2] + '" style="cursor:pointer;' +
      'min-height:44px"><div style="flex:1"><div style="font-size:14px">' + x[0] + "</div>" +
      '<div class="sub" style="font-size:11px">' + x[1] + "</div></div>" +
      '<span style="color:var(--chev)">' + ic("chev", 15) + "</span></div>").join("") + "</div>";
}

function monthView() {
  const m = viewMonth(), cur = isThisMonth();
  const inc = incomeIn(S, m), out = outgoIn(S, m), saved = savedIn(m);
  /* 结余 = 可动用口径：把已确认的固定储蓄也扣掉。
     它不等于净资产增长（那个是 inc - out）—— 所以下面把三段减法都写出来。 */
  const net = inc - out - saved;
  const cats = catTotals(S, m);
  const all = S.tx.filter((t) => monthOf(t.date) === m)
    .concat(fixedRowsFor(m), transferRowsFor(m));
  /* 未来的固定收支收拢成一行 —— 否则四条灰色「预计」会压在真实花销上面 */
  const isFuture = (t) => (t.fixed || t.xfer) && m === thisMonth() && t.date > today();
  const future = all.filter(isFuture);
  const rows = ui.showFuture ? all : all.filter((t) => !isFuture(t));
  const days = {};
  rows.forEach((t) => { (days[t.date] = days[t.date] || []).push(t); });
  const dates = Object.keys(days).sort().reverse();
  const arrow = (dir, on) => '<div ' + (on ? 'data-a="month:' + dir + '"' : "") +
    ' style="padding:6px;cursor:' + (on ? "pointer" : "default") + ";color:" +
    (on ? "var(--ink)" : "var(--chev)") + '">' + ic(dir === "prev" ? "back" : "chev", 17) + "</div>";
  return { tab: "dashboard", fab: "both",
    /* 月份选择器居中，和右上角的「我」平齐；左边留等宽的空位才真居中 */
    nav: '<div class="chip" data-a="settings" style="padding:4px 9px">' + t("nav.me") + "</div>" +
      '<div style="flex:1;display:flex;align-items:center;justify-content:center;gap:2px">' +
      arrow("prev", true) +
      '<div class="h2" style="min-width:92px;text-align:center;font-size:14px">' +
      monthName(m) + "</div>" +
      arrow("next", !cur) + "</div>" +
      scopeToggle(),
    body:
      /* 只保留结余 + 收支两个数。固定收支已经计入，所以这三个数自洽 —— 
         「已承诺但还没发生」那一整块因此不再需要。 */
      '<div class="card">' +
      '<div class="lbl">' + t("mo.headline", { m: m.slice(5), neg: net < 0 }) +
      "</div>" +
      '<div class="big" style="margin:2px 0;color:' + (net < 0 ? RED : GREEN) + '">' +
      (net < 0 ? neg(-net) : plus(net)) + "</div>" +
      /* 三段减法摊开写，结余就不会被读成「净资产涨了多少」 */
      '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:2px">' +
      '<div class="sub">' + t("word.income") +
      ' <span class="money" style="color:var(--ink)">' + yuan(inc) + "</span></div>" +
      '<div class="sub">− ' + t("word.spending") +
      ' <span class="money" style="color:var(--ink)">' + yuan(out) + "</span></div>" +
      (saved ? '<div class="sub">− ' + t("word.savings") +
        ' <span class="money" style="color:var(--ink)">' + yuan(saved) + "</span></div>"
        : "") + "</div>" +
      /* 四项各去各的地方 —— 原来一整句只链到「我」，可固定支出和还贷在账单、
         固定储蓄在金库，点过去全是错的。链接用负 margin 撑开点击区。 */
      '<div class="sub" style="font-size:11px;margin-top:5px">' + t("mo.counted") +
      [[t("word.fixedIn"), "settings"], [t("word.fixedOut"), "route:out"],
        [t("word.debt"), "route:debt"], [t("word.fixedSave"), "toSavings2"]].map(([l, a]) =>
        '<span data-a="' + a + '" style="display:inline-block;padding:8px 5px;' +
        'margin:-8px 0;cursor:pointer;color:var(--link);text-decoration:underline">' + l +
        "</span>").join('<span style="color:var(--ghosted)">·</span>') + "</div>" +
      (() => {
        const need = cur ? stillToSave(S) : 0;
        if (net >= 0 && !need) return "";
        return '<div style="border-top:1px solid var(--line);margin-top:9px;padding-top:8px" ' +
          'data-a="route">' +
          (net < 0 ? '<div style="display:flex;gap:6px;font-size:12px;color:' + RED +
            '"><span style="margin-top:1px">' + ic("warn", 13) + "</span>" +
            "<div>" + t("mo.overSaved") + "</div></div>" : "") +
          (need > 0 ? '<div class="sub" style="font-size:12px' +
            (net < 0 ? ";margin-top:5px" : "") + '">' +
            t("mo.stillToSave", { amt: '<span class="money">' + yuan(need) + "</span>" }) +
            "</div>" : "") + "</div>";
      })() +
      "</div>" +

      (cur ? confirmCard() + setupCard() : "") +
      '<div style="display:flex;align-items:center;gap:9px;margin-top:2px">' +
      '<div class="h2" style="flex:1">' + t("mo.ledger") + "</div>" +
      '<div class="sub">' + t("mo.rows", { n: rows.length }) + "</div>" +
      (out > 0 ? '<div class="sub" data-a="cats" style="cursor:pointer;display:flex;' +
        'align-items:center;gap:3px;color:var(--link)">' + t("word.breakdown") +
        ic("chev", 13) + "</div>" : "") +
      "</div>" +

      (future.length
        ? '<div class="row" data-a="toggleFuture" style="cursor:pointer;min-height:46px">' +
          '<span style="color:var(--faint)">' + ic("clock", 16) + "</span>" +
          '<div style="flex:1;font-size:13px;color:var(--ink-2)">' +
          t("mo.upcoming", { n: future.length }) +
          (future.some((f) => f.fixed === "in")
            ? "　" + t("mo.willArrive") + ' <span class="money">' +
              yuan(future.filter((f) => f.fixed === "in").reduce((a, f) => a + f.amount, 0)) +
              "</span>" : "") +
          (future.some((f) => f.fixed === "out")
            ? "　" + t("mo.willLeave") + ' <span class="money">' +
              yuan(future.filter((f) => f.fixed === "out").reduce((a, f) => a + f.amount, 0)) +
              "</span>" : "") +
          (future.some((f) => f.xfer)
            ? "　" + t("mo.willMove") + ' <span class="money">' +
              yuan(future.filter((f) => f.xfer).reduce((a, f) => a + f.amount, 0)) +
              "</span>" : "") + "</div>" +
          '<span class="sub" style="font-size:11px">' +
          t(ui.showFuture ? "word.collapse" : "word.expand") + "</span></div>"
        : "") +
      (rows.length
        ? dates.map((d) => {
            const o = days[d].filter((t) => !t.xfer && t.fixed !== "in" && t.type !== "in")
              .reduce((a, t) => a + t.amount, 0);
            const sv = days[d].filter((t) => t.xfer && !isFuture(t))
              .reduce((a, t) => a + t.amount, 0);
            return '<div class="lbl" style="margin-top:4px">' + dayLabel(d) +
              (o ? " · " + t("word.spending") + " " + yuan(o) : "") +
              (sv ? " · " + t("word.savings") + " " + yuan(sv) : "") + "</div>" +
              '<div style="margin-top:-6px">' + days[d].map((t) => (t.fixed || t.xfer)
                ? passiveRow(t, m)
                : swipe(listrow(
                    '<span class="chip flat" style="padding:1px 8px;font-size:11px">' +
                    esc(catLabel(t.category)) + "</span> " + esc(t.description),
                    t.type === "out" ? neg(t.amount) : plus(t.amount), null,
                    "editTx:" + t.id), "delTx:" + t.id)).join("") + "</div>";
          }).join("") + '<div style="height:56px"></div>'
        : '<div class="dash" style="min-height:120px;cursor:default;flex-direction:column;' +
          'gap:6px;padding:0 24px;text-align:center">' +
          (cur ? t("mo.emptyNow") : t("mo.emptyPast", { month: monthName(m) })) +
          "</div>") };
};

/* 右上角不是「新建账户」了（正文里有），换成离人生大目标还有多远 */

    Math.round(pct) + "%</div></div>";
}

/* 分数不只属于这件东西 —— 预算和模式一变，同一件东西的灯色就会变 */
function snapNote(snap, r, b) {
  if (!snap) return "";
  if (snap.verdict === r.verdict && Math.abs(snap.score - r.score) < 0.05) return "";
  const why = [];
  const modeName = (save) => t(save ? "set.modeSave" : "set.modeComfort");
  if (snap.saveMode !== S.saveMode) why.push(t("sn.modeChanged",
    { from: modeName(snap.saveMode), to: modeName(S.saveMode) }));
  if (snap.budget !== b) why.push(t("sn.budgetChanged",
    { from: yuan(snap.budget), to: yuan(b), down: b < snap.budget }));
  const worse = r.score < snap.score;
  return '<div class="banner" style="border-color:var(--chev);background:var(--surface-2)">' +
    '<span style="margin-top:1px;color:' + (worse ? RED : GREEN) + '">' +
    ic(worse ? "warn" : "check", 15) + "</span><div>" + t("sn.was", {
      before: lampOf(snap.verdict) + " " + t("sc.pointsN", { n: snap.score.toFixed(1) }),
      after: lampOf(r.verdict) + " " + t("sc.pointsN", { n: r.score.toFixed(1) }) }) +
    (why.length ? '<br/><span class="sub">' + why.join(t("sn.sep")) + "</span>" : "") +
    "</div></div>";
}

/* 算式默认收起：一行说清主要扣在哪，想看细的再展开。
   原来那张 6 行的表格占了小半屏，而它回答的只是「凭什么」这一个问题。 */
function mainReason(it, r) {
  const parts = [
    ["price", r.incomePenalty, t("re.price", { pct: r.ratio.toFixed(1) })],
    ["dup", r.dupPenalty, t("re.dup")],
    ["mode", r.modePenalty, t("re.mode", { save: S.saveMode })],
  ].sort((a, b2) => b2[1] - a[1]);
  const top = parts[0];
  /* 相对基础分看，绝对值没意义：预算两千多的时候，任何价格都会扣掉一点 */
  const total = r.incomePenalty + r.dupPenalty + r.modePenalty;
  if (total < r.base * 0.05) return t("re.almostNone", { n: it.necessity });
  /* 扣分超过基础分时，报一个比基础分还大的数会让人算不明白，直接说「扣穿了」 */
  if (top[1] > r.base) return t("re.blownOut", { what: top[2] });
  return t("re.mainly", { what: top[2], n: top[1].toFixed(1) });
}

/* --- 清单详情 = 结果页 + 状态（冷静期 / 攒物计划） --------------------- */

  return { tab: "decisions", nav,

/* ==========================================================================
   5. 抽屉
   ========================================================================== */
const grab = '<div class="grab"></div>';
const head = (title, extra) => '<div style="display:flex;align-items:center;gap:9px">' +
  '<div class="h2" style="flex:1">' + title + "</div>" + (extra || "") +
  '<div data-a="close" style="cursor:pointer;color:var(--faint)">' + ic("close", 18) + "</div></div>";
const errline = () => ui.f.err
  ? '<div class="errline"><span style="margin-top:2px">' + ic("warn", 14) + "</span><div>" +
    ui.f.err + "</div></div>" : "";
const jarOpts = () => S.accounts.filter((a) => !a.earmark).map((a) => a.name);
const jarLine = (n) => { const j = jar(n); return j ? t("f.balance", { amt: yuan(j.balance) }) : ""; };

const SHEETS = {};

/* 语音输入：用浏览器自带的识别（iOS Safari / Chrome 都有）。
   拿不到就退回打字 —— 解析本来就是对文本做的，说和打进来是同一条路。
   注意要 https，file:// 和局域网 http 上浏览器直接不给权限。 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micOK = () => !!SR && (location.protocol === "https:" ||
  ["localhost", "127.0.0.1"].indexOf(location.hostname) >= 0);
let rec = null;

function micStop() {
  if (rec) { try { rec.stop(); } catch (err) { /* 已经停了 */ } rec = null; }
  ui.listening = false;
}
function micStart() {
  if (rec) return micStop();
  if (!SR) { ui.f.err = t("as.noMic"); return render(); }
  if (!micOK()) { ui.f.err = t("as.micHttp"); return render(); }
  rec = new SR();
  rec.lang = isEn() ? "en-GB" : "zh-CN";
  rec.interimResults = true;
  rec.continuous = false;
  const base = ui.f.text || "";
  rec.onresult = (ev) => {
    let out = "";
    for (let i = 0; i < ev.results.length; i++) out += ev.results[i][0].transcript;
    ui.f.text = (base ? base + " " : "") + out;
    /* 不整页重绘 —— 那会把抽屉重建一遍，动画也重放 */
    const ta = document.querySelector('.sheet [data-f="text"]');
    if (ta) ta.value = ui.f.text;
  };
  rec.onerror = (ev) => {
    ui.f.err = ev.error === "not-allowed" || ev.error === "service-not-allowed"
      ? t("as.micDenied") : ev.error === "no-speech" ? t("as.micNothing") : t("as.noMic");
    rec = null; ui.listening = false; render();
  };
  rec.onend = () => { rec = null; ui.listening = false; render(); };
  try { rec.start(); ui.listening = true; ui.f.err = null; render(); }
  catch (err) { rec = null; ui.f.err = t("as.noMic"); render(); }
}

SHEETS.assistant = () => {
  const p = ui.f.parsed;
  const listening = !!ui.listening;
  if (!p) return grab + head(t("as.say")) +
    '<textarea class="fldbox" data-f="text" placeholder="' + esc(t("as.placeholder")) + '">' +
    esc(ui.f.text || "") + "</textarea>" +
    '<div class="wave' + (listening ? " on" : "") + '">' +
    [9, 17, 28, 14, 34, 22, 40, 25, 13, 30, 19, 9].map((h, i) =>
      '<span style="' + (listening ? "height:" + h + "px;" : "") + "animation-delay:" +
      (i * 0.07).toFixed(2) + 's"></span>').join("") + "</div>" +
    (SR
      ? '<div class="mbtn' + (listening ? "" : " sm") + '" data-a="mic">' +
        ic("mic", 17) + " " + t(listening ? "as.stop" : "as.listen") + "</div>"
      : '<div class="sub" style="text-align:center">' + t("as.noMic") + "</div>") +
    errline() + btn(t("as.parse"), "parse", "pri") +
    '<div class="sub" style="text-align:center">' + t("as.parseHint") + "</div>";

  const chip = '<div class="chip flat" style="font-family:ui-monospace;font-size:11px;' +
    'background:var(--surface-2);border-style:dashed">' + p.intent + "</div>";
  if (p.intent === "ledger" || p.intent === "multi_ledger") {
    /* 一句话里可能同时有进和出 —— 加成一个数是没意义的 */
    const out = p.drafts.filter((d) => d.type === "out").reduce((a, d) => a + d.amount, 0);
    const inc = p.drafts.filter((d) => d.type === "in").reduce((a, d) => a + d.amount, 0);
    const sum = [out ? t("word.spending") + " " + yuan(out) : "",

    return grab + head(t("as.foundN", { n: p.drafts.length }), chip) +
      '<div class="sub" style="margin-top:-4px">' + t("as.previewMeta", {
        sum: '<span class="money">' + sum + "</span>", date: p.drafts[0].date }) + "</div>" +
      /* 解析器一定会错 —— 预览这一步存在的意义就是让人改，所以每行可编辑 */
      p.drafts.map((d, i) => '<div data-a="editDraft:' + i + '" style="display:flex;gap:10px;' +
        'align-items:center;min-height:44px;cursor:pointer;' +
        'border-bottom:1px solid var(--line)"><div class="chip flat" style="padding:2px 9px">' +
        esc(catLabel(d.category)) + '</div><div style="flex:1;font-size:15px">' +
        esc(d.description) +
        '</div><div class="money" style="font-size:15px">' +
        (d.type === "in" ? plus(d.amount) : yuan(d.amount)) + "</div>" +
        '<span style="color:var(--chev)">' + ic("chev", 14) + "</span></div>").join("") +
      (p.drafts.some((d) => d.amount <= 0)
        ? '<div class="errline"><span>' + ic("warn", 14) + "</span><div>" +
          t("as.noAmount") + "</div></div>" : "") +
      btn(t("as.commitLedger"), "commit", "pri") + btn(t("as.cancel"), "close", "sm");
  }
  if (p.intent === "transfer") return grab + head(t("as.transfer"), chip) +
    '<div class="big money">' + yuan(p.move.amount) + "</div>" +
    '<div class="fldbox" style="background:var(--surface-2)">' + esc(p.move.from) +
    '<div style="flex:1;text-align:center;color:var(--ghosted)">' + ic("arrow", 18) + "</div>" +
    esc(p.move.to) + "</div>" +
    '<div class="sub">' + t("as.transferNote", { from: esc(p.move.from),
      bal: jarLine(p.move.from) }) + "</div>" +
    btn(t("as.commitTransfer"), "commit", "pri") + btn(t("as.cancel"), "close", "sm");
  if (p.intent === "deposit") return grab + head(t("as.deposit"), chip) +
    '<div class="big money">' + yuan(p.move.amount) + "</div>" +
    '<div class="fldbox" style="background:var(--surface-2)">' +
    t("as.depositTo", { to: esc(p.move.to) }) + "</div>" +
    btn(t("as.commitDeposit"), "commit", "pri") + btn(t("as.cancel"), "close", "sm");
  if (p.intent === "goal") return grab + head(t("as.newGoal"), chip) +
    '<div class="fldbox" style="background:var(--surface-2)">' + esc(p.goal.name) +
    '<div style="flex:1"></div><span class="money">' + yuan(p.goal.target) + "</span></div>" +
    '<div class="sub">' + t("as.goalMeta", { months: p.goal.months,
      amt: yuan(Math.round(p.goal.target / p.goal.months)) }) + "</div>" +
    btn(t("as.commitGoal"), "commit", "pri") + btn(t("as.cancel"), "close", "sm");
  if (p.intent === "debt") return grab + head(t("as.newDebt"), chip) +
    '<div class="fldbox" style="background:var(--surface-2)">' + esc(p.debt.description) +
    '<div style="flex:1"></div><span class="money">' + neg(p.debt.monthly) + " " +
    t("bi.perMonth") + "</span></div>" +
    btn(t("as.commitDebt"), "commit", "pri") + btn(t("as.cancel"), "close", "sm");
  /* decision：只读 */
  const b = budgetFor(S);
  const r = evaluatePurchase(p.item.price || 1, b, p.item.necessity, S.saveMode, p.item.dup);
  const [tone, bg, label] = TONE(r.verdict);
  return grab + head(t("as.decision"), chip) +
    '<div class="fldbox" style="background:var(--surface-2)">' + esc(p.item.name) +
    '<div style="flex:1"></div><span class="sub">' +
    t("as.necMeta", { n: p.item.necessity, dup: p.item.dup }) + "</span></div>" +
    '<div class="banner" style="border-color:' + tone + ";background:" + bg + '">' +
    '<span class="dot" style="background:' + tone + ';margin-top:5px"></span>' +
    '<div style="flex:1"><b>' + label + '</b><br/><span class="sub">' +
    t("as.scoreMeta", { score: r.score.toFixed(1), price: yuan(p.item.price),
      pct: r.ratio.toFixed(0) }) + "</span></div></div>" +
    '<div class="sub">' + t("as.readonly") + "</div>" +
    btn(t("as.openQuiz"), "toQuiz", "pri") +
    btn(t("vd.startPlan"), "startPlanFromVoice", "sm");

/* 这一屏的合计必须等于概况里的「支出」，否则占大头的固定支出就被藏起来了。
   固定支出和还贷是声明出来的，没有分类，所以各自成一块。 */
/* ￥25 四舍五入是 0%，显示成「0%」会像坏掉 */
const pctLabel = (v, total) => {
  const pct = (v / total) * 100;
  return pct > 0 && pct < 0.5 ? "<1%" : Math.round(pct) + "%";
};

/* 固定的那几行：灰一点，带「固定」标记，未来的日子标「预计」 */
function passiveRow(x, m) {
  const future = m === thisMonth() && x.date > today();
  /* 转存不带 +/− 号 —— 它不是收也不是支，只是换了个账户 */
  const amount = x.xfer ? "→ " + yuan(x.amount)
    : x.fixed === "in" ? plus(x.amount) : neg(x.amount);
  return '<div class="row" data-a="' + x.tap + '" style="cursor:pointer;opacity:' +
    (future ? ".55" : ".8") + '">' +
    '<div style="flex:1;min-width:0"><div style="font-size:15px;color:var(--ink-2)">' +
    '<span class="chip flat" style="padding:1px 8px;font-size:11px;border-style:dashed">' +
    (x.xfer ? t("px.transfer") : t("px.fixed")) + "</span> " + esc(x.name) + "</div>" +

function breakdownOver(months, kind) {
  const map = new Map();
  const add = (k, v) => { if (v > 0) map.set(k, (map.get(k) || 0) + v); };
  months.forEach(() => {
    if (kind === "in") S.fixedIn.forEach((x) => add(x.name, x.amount));
    else {
      add(t("word.fixedOut"), S.fixedOut.reduce((a, x) => a + x.amount, 0));
      add(t("word.debtLong"), debtCommit(S));
    }
  });
  const want = kind;                    // t.type 现在就是 "in" / "out"
  S.tx.filter((t) => t.type === want && months.includes(monthOf(t.date)))
    .forEach((t) => add(catLabel(t.category), t.amount));
  return [...map.entries()].sort((a, b) => b[1] - a[1]);
}
const breakdownOf = (m, kind) => breakdownOver([m], kind);
const outgoBreakdown = (m) => breakdownOf(m, "out");

/* 小于这个比例的并成「其他」—— 否则 <1% 的切片和它的标签会糊在一起 */
const SLICE_FLOOR = 0.03;
function foldSmall(rows) {
  const total = rows.reduce((a, c) => a + c[1], 0) || 1;
  const keep = rows.filter((r) => r[1] / total >= SLICE_FLOOR);
  const rest = rows.filter((r) => r[1] / total < SLICE_FLOOR);
  if (!rest.length) return keep;
  const lump = rest.reduce((a, r) => a + r[1], 0);
  const other = t("pie.other");
  const i = keep.findIndex((r) => r[0] === other);
  if (i >= 0) { keep[i] = [other, keep[i][1] + lump]; return keep.sort((a, b) => b[1] - a[1]); }
  return keep.concat([[other, lump]]);
}

/* 环形图自己带标签：左右两列分栏排，用引线连到切片，天生不会重叠。
   整块是固定高度，所以切「支出 / 收入」时页面不会跳。 */
function labeledDonut(rows, kind) {
  /* r 是路径半径，环的外沿是 r + th/2 —— 引线和标签都要从外沿算，
     否则标签会压在环上（第一版就压了） */
  const W = 302, H = 268, cx = W / 2, cy = H / 2, r = 46, th = 18;
  const OUT = r + th / 2;
  const total = rows.reduce((a, c) => a + c[1], 0) || 1;
  const C = 2 * Math.PI * r;
  let off = 0;
  const segs = [], labels = { left: [], right: [] };
  rows.forEach(([name, v], i) => {
    const len = (v / total) * C;
    const mid = off + len / 2;
    const draw = Math.max(0.6, len - (rows.length > 1 ? 2 : 0));
    segs.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' +
      RAMP[Math.min(i, RAMP.length - 1)] + '" stroke-width="' + th +
      '" stroke-dasharray="' + draw.toFixed(2) + " " + (C - draw).toFixed(2) +
      '" stroke-dashoffset="' + (-off).toFixed(2) + '"></circle>');
    const ang = (mid / C) * Math.PI * 2 - Math.PI / 2;
    const side = Math.cos(ang) >= 0 ? "right" : "left";
    labels[side].push({ name, v, i, ang });
    off += len;
  });
  const leaders = [], texts = [];
  ["left", "right"].forEach((side) => {
    const list = labels[side].sort((a, b) => Math.sin(a.ang) - Math.sin(b.ang));
    const n = list.length;
    list.forEach((L, k) => {
      /* 一侧只有一个标签时按它自己的角度放；多个就均匀分栏，天生不重叠 */
      const y = n === 1
        ? Math.max(30, Math.min(H - 30, cy + (OUT + 20) * Math.sin(L.ang)))
        : 30 + ((H - 60) / (n - 1)) * k;
      const ex = side === "right" ? cx + OUT + 12 : cx - OUT - 12;
      const tx = side === "right" ? W - 4 : 4;
      leaders.push('<path d="M' + (cx + (OUT + 3) * Math.cos(L.ang)).toFixed(1) + " " +
        (cy + (OUT + 3) * Math.sin(L.ang)).toFixed(1) + "L" + ex.toFixed(1) + " " + y.toFixed(1) +
        "H" + (side === "right" ? tx - 2 : tx + 2) + '" fill="none" stroke="var(--chev)" ' +
        'stroke-width="1"></path>');
      texts.push('<text x="' + tx + '" y="' + (y - 3) + '" text-anchor="' +
        (side === "right" ? "end" : "start") + '" font-size="12.5" font-weight="600" ' +
        'fill="var(--ink)">' + esc(L.name) + "</text>" +
        '<text x="' + tx + '" y="' + (y + 12) + '" text-anchor="' +
        (side === "right" ? "end" : "start") + '" font-size="10" fill="var(--muted)">' +
        pctLabel(L.v, total) + " · " + yuan(L.v) + "</text>");
    });
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" ' +
    'style="display:block;font-family:inherit">' +
    '<g transform="rotate(-90 ' + cx + " " + cy + ')">' + segs.join("") + "</g>" +
    leaders.join("") + texts.join("") +
    '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="11" ' +
    'fill="var(--muted)">' + t(kind === "in" ? "word.income" : "word.spending") + "</text>" +
    '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="13" ' +
    'font-weight="600" fill="var(--ink)">' + yuan(total) + "</text></svg>";
}

const app = document.getElementById("app");
const num = (v) => toCents(v);
const days = (fromMs) => Math.max(1, Math.round((now().getTime() - fromMs) / 86400e3));
function removeWish(wishId) { S.wishlist = S.wishlist.filter((w) => w.id !== wishId); }
function dropJar(name) {
  const j = jar(name);
  if (j && j.balance === 0) S.accounts = S.accounts.filter((a) => a.name !== name);
}
function finalizeBuy(p) {
  const j = jar(p.jar);
  if (j) j.balance -= p.target;
  dropJar(p.jar);
  p.status = "bought";
  S.archive.unshift({ name: p.name, price: p.target, outcome: "bought", date: today(),
    note: "ar.soldFor", noteArgs: { n: p.sales.length, days: days(p.startedAt) } });
  removeWish(p.wishId);
  ui.seg.wish = "done";
  ui.stack = ["decisions", "wishlist"];
  ui.sheet = null; ui.f = {};
  toast(t("k.boughtNoLedger"));
}

function validDebt() {
  const description = (ui.f.description || "").trim(), monthly = num(ui.f.monthly);
  const months = parseInt(ui.f.months, 10) || 0;
  const day = parseInt(ui.f.day, 10);
  const account = ui.f.account || (S.accounts.find((a) => !a.earmark) || {}).name;
  if (!description) { ui.f.err = t("e.descEmpty"); return null; }
  if (!(monthly > 0)) { ui.f.err = t("e.monthlyPos"); return null; }
  if (months < 0 || months > 1200) { ui.f.err = t("e.terms"); return null; }
  if (!account) { ui.f.err = t("e.needAccount"); return null; }
  if (!(day >= 1 && day <= 31)) { ui.f.err = t("e.day"); return null; }
  return { description, monthly, months, account,
    auto: ui.f.auto === true || ui.f.auto === "auto", day };
}

function validGoal() {
  const name = (ui.f.name || "").trim(), target = num(ui.f.target);
  const months = parseInt(ui.f.months, 10);
  const day = parseInt(ui.f.day, 10);
  const account = ui.f.account || (S.accounts.find((a) => !a.earmark) || {}).name;
  if (!name) { ui.f.err = t("e.goalNeedsName"); return null; }
  if (!(target > 0)) { ui.f.err = t("e.targetPos"); return null; }
  if (!(months >= 0 && months <= 1200)) { ui.f.err = t("e.goalMonths"); return null; }
  if (!account) { ui.f.err = t("e.needAccount"); return null; }
  if (!(day >= 1 && day <= 31)) { ui.f.err = t("e.day"); return null; }
  return { name, target, months, account, auto: ui.f.auto === true || ui.f.auto === "auto", day };
}

function validFixed() {
  const name = (ui.f.name || "").trim(), amt = num(ui.f.amount);
  const day = parseInt(ui.f.day, 10);
  if (!name) { ui.f.err = t("e.needLabel"); return null; }
  if (!(amt > 0)) { ui.f.err = t("e.amountPos"); return null; }
  if (!(day >= 1 && day <= 31)) { ui.f.err = t("e.day"); return null; }
  return { name, amount: amt, day };
}

  /* 助手 */
  assistant: () => { micStop(); sheet("assistant", { text: "" }); },
  mic: () => micStart(),
  editDraft: (i) => { const d = ui.f.parsed.drafts[+i];
    pushSheet("editDraft", { i: +i, type: d.type, amount: (d.amount / 100).toFixed(2),
      category: d.category, description: d.description, date: d.date }); },
  submitEditDraft: () => {
    const amt = num(ui.f.amount);
    if (!(amt > 0)) { ui.f.err = t("e.amountPos"); return render(); }
    if (!(ui.f.description || "").trim()) { ui.f.err = t("e.descEmpty"); return render(); }
    const i = ui.f.i, patch = { type: ui.f.type, amount: amt, category: ui.f.category,
      description: ui.f.description.trim(), date: ui.f.date };
    const back = ui.fStack[ui.fStack.length - 1];
    Object.assign(back.f.parsed.drafts[i], patch);
    popSheet(); },
  dropDraft: () => {
    const i = ui.f.i, back = ui.fStack[ui.fStack.length - 1];
    back.f.parsed.drafts.splice(i, 1);
    if (!back.f.parsed.drafts.length) { close(); return toast(t("k.allDropped")); }
    popSheet(); },
  parse: () => { const said = (ui.f.text || "").trim();
    if (!said) { ui.f.err = t("e.saySomething"); return render(); }
    const p = parseUtterance(said);
    if (!p) { ui.f.err = t("e.notUnderstood"); return render(); }
    ui.f.parsed = p; ui.f.err = null; render(); },
  commit: () => {
    const p = ui.f.parsed;
    if (p.intent === "ledger" || p.intent === "multi_ledger") {
      if (p.drafts.some((d) => d.amount <= 0)) { ui.f.err = t("e.amountPos"); return render(); }
      p.drafts.forEach((d) => S.tx.push(Object.assign({ id: id() }, d)));
      const o = p.drafts.filter((d) => d.type === "out").reduce((a, d) => a + d.amount, 0);
      const i2 = p.drafts.filter((d) => d.type === "in").reduce((a, d) => a + d.amount, 0);
      close(); return toast(t("k.loggedN", { n: p.drafts.length,
        sum: [o ? t("word.spending") + " " + yuan(o) : "",
          i2 ? t("word.income") + " " + yuan(i2) : ""].filter(Boolean).join(" · ") }));
    }
    if (p.intent === "transfer") {
      const f = jar(p.move.from), to = jar(p.move.to);
      if (!f) { ui.f.err = t("e.jarMissing", { name: p.move.from }); return render(); }
      if (f.earmark) { ui.f.err = t("e.jarLocked", { name: f.name }); return render(); }
      if (p.move.amount <= 0) { ui.f.err = t("e.amountPos"); return render(); }
      if (f.balance < p.move.amount) {
        ui.f.err = t("e.notEnough", { name: f.name, has: yuan(f.balance),
          short: yuan(p.move.amount - f.balance) }); return render(); }
      if (!to) S.accounts.push({ name: p.move.to, balance: 0, earmark: null });
      f.balance -= p.move.amount; jar(p.move.to).balance += p.move.amount;
      close(); return toast(t("k.moved", { from: f.name, to: p.move.to }));
    }
    if (p.intent === "deposit") {
      if (p.move.amount <= 0) { ui.f.err = t("e.amountPos"); return render(); }
      if (!jar(p.move.to)) S.accounts.push({ name: p.move.to, balance: 0, earmark: null });
      jar(p.move.to).balance += p.move.amount;
      close(); return toast(t("k.deposited", { to: p.move.to }));
    }
    if (p.intent === "goal") {
      if (p.goal.target <= 0) { ui.f.err = t("e.targetPos"); return render(); }
      S.goals.push({ id: id(), name: p.goal.name, target: p.goal.target,
        months: p.goal.months, saved: 0 });
      close(); return toast(t("k.goalCreated", { name: p.goal.name }));
    }
    if (p.intent === "debt") {
      if (p.debt.monthly <= 0) { ui.f.err = t("e.monthlyPos"); return render(); }
      S.debts.push({ id: id(), description: p.debt.description, monthly: p.debt.monthly });
      close(); return toast(t("k.debtBound"));
    }
  },

  importData: () => { const el = document.getElementById("importfile"); if (el) el.click(); },
  applyImport: (text) => {
    let box;
    try { box = JSON.parse(text); } catch (err) { ui.f.err = t("e.badBackup"); return render(); }
    const d = box && box.data, v = box && box.v;
    if (!d || typeof v !== "number" || !Array.isArray(d.tx)) {
      toast(t("e.badBackup")); return; }
    let cur = v;
    while (cur < SCHEMA) {
      const step = MIGRATIONS[cur];
      if (!step) { toast(t("e.badBackup")); return; }
      step(d); cur++;

function tabsHtml(active) {
  return '<div class="tabs">' + TABS().map(([i, l, k]) =>
    '<div class="tab ' + (k === active ? "on" : "") + '" data-a="tab:' + k + '">' +

/* 自动扣款的目标，到了日子就自己把这个月记上（幂等）。真实实现里这是后端的定时任务。 */
function settleAutoGoals() {
  const m = thisMonth();
  S.debts.forEach((d) => {
    if (!d.auto || !d.marks || d.marks[m]) return;
    if (+today().slice(8) < d.day) return;
    d.marks[m] = { k: "auto", amt: d.monthly };
  });
  S.goals.forEach((g) => {
    if (!g.auto || g.marks[m]) return;
    if (+today().slice(8) < g.day) return;
    const per = Math.min(goalMonthly(g), g.target - g.saved);
    g.marks[m] = { k: "auto", amt: per };
    g.saved += per;
  });
}

/* render() 每次都把 app.innerHTML 整个重建，滚动位置也跟着没了 ——
   编辑完一笔回到列表就弹回顶部，翻了半天的位置全丢。
   同一个屏幕就把 .body 的 scrollTop 接回去；换屏幕才回到顶部（那是对的）。 */
function render() {
  settleAutoGoals();
  if (needsSetup(S)) { app.innerHTML = wizardView(); return; }
  const key = screen();
  const oldBody = app.querySelector(".body");
  const keepTop = oldBody && ui.lastScreen === key ? oldBody.scrollTop : 0;
  const animating = ui.anim;
  const v = (SCREENS[key] || SCREENS.dashboard)();
  const tab = v.tab === undefined ? TAB_OF[key] : v.tab;
  app.innerHTML = '<div class="inset"></div><div class="nav">' + v.nav + "</div>" +
    '<div class="body' + (v.fab ? " hasfab" : "") + '">' + v.body + "</div>" +
    (tab ? tabsHtml(tab) : "") +
    (v.fab && !ui.sheet
      ? (v.fab === "both"
        ? '<div class="fabrow"><div class="fabpill" data-a="addTx">' + ic("plus", 18) +
          " " + t("fab.addTx") + '</div><div class="fab" data-a="assistant">' +
          ic("mic", 24) + "</div></div>"
        : '<div class="fab" data-a="assistant">' + ic("mic", 24) + "</div>")
      : "") +
    (ui.sheet ? '<div class="dim' + (ui.anim ? " anim" : "") + '" data-a="close"></div>' +
      '<div class="sheet' + (ui.anim ? " anim" : "") + '">' + SHEETS[ui.sheet]() + "</div>" : "") +
    (ui.toast ? '<div class="toast' + (ui.sheet ? " high" : "") + '">' + ic("check", 17) +
      '<div style="flex:1">' + esc(ui.toast) + "</div></div>" : "");
  ui.lastScreen = key;
  save();
  if (keepTop) {
    const b = app.querySelector(".body");
    /* 抽屉刚关掉时列表可能还没排完版，scrollTop 会被截断，所以下一帧再补一次 */
    if (b) { b.scrollTop = keepTop;
      requestAnimationFrame(() => { if (b.isConnected && b.scrollTop !== keepTop)
        b.scrollTop = keepTop; }); }
  }
  if (animating) ui.anim = false;
}
app.addEventListener("click", (e) => {
  if (swallowClick) { swallowClick = false; e.stopPropagation(); return; }
  const el = e.target.closest("[data-a]");
  if (!el || el.classList.contains("off")) {
    if (el && el.classList.contains("off")) return;
    if (!el) return;
  }
  const raw = el.dataset.a, i = raw.indexOf(":");
  const act = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? null : raw.slice(i + 1);
  if (ACT[act]) { e.stopPropagation(); ACT[act](arg); }
});
/* 手势：只认横向；纵向一律让给滚动。滑过阈值就吞掉这次 click，避免误触发行内动作 */
let swState = null, swallowClick = false;
const closeSwipes = (except) => app.querySelectorAll(".sw.open")
  .forEach((el) => { if (el !== except) el.classList.remove("open"); });
app.addEventListener("pointerdown", (e) => {
  /* 上一次滑动只吞掉紧跟其后的那一次 click；新的一次按下就解除，
     否则滑完再点「删除」会被白白吃掉一下。 */
  swallowClick = false;
  if (e.target.closest(".sw-del")) return;
  const srt = e.target.closest(".srt");
  if (srt) {
    const pid = e.pointerId, y0 = e.clientY;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      if (swState && swState.locked) return;   // 已经在左滑了，别抢
      swState = null;
      startDrag(srt, y0);
      try { srt.setPointerCapture(pid); } catch (err) { /* 鼠标下可能没捕获 */ }
    }, 380);
  }
  const el = e.target.closest(".sw");
  if (!el) { closeSwipes(); return; }
  swState = { el, x0: e.clientX, y0: e.clientY, dx: 0, locked: false };
});
app.addEventListener("pointermove", (e) => {
  if (dragState) { e.preventDefault(); dragTo(e.clientY - dragState.y0); return; }
  if (!swState) return;
  const dx = e.clientX - swState.x0, dy = e.clientY - swState.y0;
  /* 手指动了就不是长按 */
  if (pressTimer && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    clearTimeout(pressTimer); pressTimer = null;
  }
  if (!swState.locked) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swState = null; return; }
    if (Math.abs(dx) < 6) return;
    swState.locked = true;
  }
  swState.dx = dx;
  const body = swState.el.querySelector(".sw-body");
  const base = swState.el.classList.contains("open") ? -76 : 0;
  body.style.transform = "translateX(" + Math.max(-76, Math.min(0, base + dx)) + "px)";
});
const endSwipe = () => {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (dragState) { endDrag(); swState = null; return; }
  if (!swState) return;
  const { el, dx } = swState;
  swState = null;
  el.querySelector(".sw-body").style.transform = "";
  if (Math.abs(dx) > 6) swallowClick = true;
  closeSwipes(el);
  if (dx < -38) el.classList.add("open");
  else el.classList.remove("open");
};
app.addEventListener("pointerup", endSwipe);
app.addEventListener("pointercancel", endSwipe);

/* ---- 长按拖动排序 -------------------------------------------------------
   不做把手：把手要么挤掉一列版式，要么在手机上太小点不中。长按 380ms 拿起来，
   和「点一下进详情」「左滑删除」都不冲突 —— 后两个都在 380ms 内就结束了。 */
const SORTED = {
  fin: () => S.fixedIn,
  fout: () => S.fixedOut,
  debt: () => S.debts,
  acct: () => S.accounts,
  goal: () => S.goals,
  wish: () => S.wishlist,
};
let dragState = null, pressTimer = null;

function reorder(group, fromId, beforeId) {
  const arr = SORTED[group] && SORTED[group]();
  if (!arr) return;
  const key = group === "acct" ? "name" : "id";
  const from = arr.findIndex((x) => String(x[key]) === String(fromId));
  if (from < 0) return;
  const [item] = arr.splice(from, 1);
  const to = beforeId == null ? arr.length
    : arr.findIndex((x) => String(x[key]) === String(beforeId));
  arr.splice(to < 0 ? arr.length : to, 0, item);
}

function startDrag(el, y0) {
  const group = el.dataset.sg;
  const peers = [...app.querySelectorAll('.srt[data-sg="' + group + '"]')];
  if (peers.length < 2) return;
  const rects = peers.map((p) => p.getBoundingClientRect());
  dragState = { el, group, peers, rects, y0, i0: peers.indexOf(el), dy: 0,
    h: el.getBoundingClientRect().height + 8 };
  el.classList.add("lift");
  app.classList.add("dragging");
  swallowClick = true;
  if (navigator.vibrate) navigator.vibrate(8);
}

function dragTo(dy) {
  const d = dragState;
  d.dy = dy;
  d.el.style.transform = "translateY(" + dy + "px)";
  const mid = d.rects[d.i0].top + d.rects[d.i0].height / 2 + dy;
  let target = d.i0;
  d.rects.forEach((r, i) => {
    if (i === d.i0) return;
    const c = r.top + r.height / 2;
    if (i < d.i0 && mid < c) target = Math.min(target, i);
    if (i > d.i0 && mid > c) target = Math.max(target, i);
  });
  d.target = target;
  d.peers.forEach((p, i) => {
    if (i === d.i0) return;
    let shift = 0;
    if (target > d.i0 && i > d.i0 && i <= target) shift = -d.h;
    if (target < d.i0 && i < d.i0 && i >= target) shift = d.h;
    p.style.transform = shift ? "translateY(" + shift + "px)" : "";
  });
}

function endDrag() {
  const d = dragState;
  dragState = null;
  app.classList.remove("dragging");
  d.peers.forEach((p) => { p.style.transform = ""; p.classList.remove("lift"); });
  const target = d.target == null ? d.i0 : d.target;
  if (target !== d.i0) {
    const moved = d.peers[d.i0].dataset.si;
    /* 往下拖：落在目标的后面，所以基准点是「目标的下一个」 */
    const anchor = target > d.i0 ? d.peers[target + 1] : d.peers[target];
    reorder(d.group, moved, anchor ? anchor.dataset.si : null);
    render();
  }
}

/* 文件选择框是动态渲染出来的，所以事件挂在 app 上 */
app.addEventListener("change", (e) => {
  if (e.target.id !== "importfile" || !e.target.files || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => ACT.applyImport(String(fr.result));
  fr.readAsText(e.target.files[0]);
});
app.addEventListener("input", (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  const v = e.target.value;
  if (f === "qname") ui.quiz.name = v;
  else if (f === "qprice") ui.quiz.price = num(v);
  else if (f === "qnec") { ui.quiz.necessity = +v; liveLabel(e.target, v + " / 10"); }
  else if (f === "renec") { ui.f.renec = +v; liveLabel(e.target, v + " / 10"); }
  else ui.f[f] = v;
  if (needsSetup(S)) liveWizardButton();
});
/* 打字时只存值，不重绘 —— 重绘会重建抽屉，光标和滚动位置都会丢 */
app.addEventListener("change", (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  if (e.target.type === "range") { render(); return; }
  if (e.target.tagName !== "SELECT") return;
  /* 不依赖 input 事件来存 select 的值 */
  ui.f[f] = e.target.value;
  if (f === "planId") { const p = activePlans().find((x) => x.name === e.target.value);
    ui.f.planId = p ? p.id : null; }
  ui.f.err = null;
  render();
});

const EXAMPLES = ["今天吃拉面25.5元，打车18元，看电影60元",
  "从微信零钱转账500元到招商银行卡", "我想买一个3000块的相机 必要度打分8",
  "计划3年攒够20万买房", "每月还房贷3000", "存入2000到支付宝"];
document.getElementById("examples").innerHTML = EXAMPLES.map((x, i) =>
  '<li><a href="#" data-ex="' + i + '" style="color:var(--link)">' + x + "</a></li>").join("");
function updateClock() {
  document.getElementById("clock").textContent = "原型时间：" +
    now().toISOString().slice(0, 16).replace("T", " ") +
    (clockOffset ? "（已快进 " + Math.round(clockOffset / 3600e3) + " 小时）" : "");
}
document.querySelector(".side").addEventListener("click", (e) => {
  const ex = e.target.closest("[data-ex]");
  if (ex) { e.preventDefault(); sheet("assistant", { text: EXAMPLES[+ex.dataset.ex] }); return; }
  const b = e.target.closest("[data-side]");
  if (!b) return;
  if (b.dataset.side === "fwd") { clockOffset += +b.dataset.h * 3600e3; updateClock(); render(); }
  if (b.dataset.side === "fresh") {
    S = emptySeed(); clockOffset = 0;
    ui = { stack: ["dashboard"], sheet: null, f: {}, fStack: [], toast: null, seg: {},
      wizard: 0, quiz: { name: "", price: 0, necessity: 5, dup: false } };
    updateClock(); render();
  }
  if (b.dataset.side === "reset") {
    S = seed(); clockOffset = 0;
    ui = { stack: ["dashboard"], sheet: null, f: {}, fStack: [], toast: null, seg: {},
      quiz: { name: "", price: 0, necessity: 5, dup: false } };
    updateClock(); render();
  }
});
ui.quiz = { name: "", price: 0, necessity: 5, dup: false };
applyTheme();
updateClock();
render();

/* 装 Service Worker：装完就能离线开。只在 https（或本机）下有效，
   file:// 打开时浏览器直接不给注册，所以要 try 住，别让整页崩掉。 */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* 没装上就当没有，功能不受影响 */ });
  });
}
</script>
