<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content：键盘弹出时让「布局视口」自己变矮。
     支持这条的浏览器上 100dvh 会跟着缩，抽屉贴在底上就自动落在键盘上面，
     一行 JS 都不用。不支持的退回下面 --kb 那套。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 顶上那块浅色的真正来源是 manifest 的 background_color：它一直是奶油纸时代
     留下的 #fcfaf5，比珠光底 #e0e0dc 亮 28/255，独立模式下状态栏那条就拿它涂。
     manifest 是「添加到主屏幕」那一刻读死的，所以改 body、改 theme-color 都没用
     （v44），得改 manifest + 重装。
     v48 试过 black-translucent（让网页自己盖住那条）：色块是没了，但那个模式下
     iOS 既不报 safe-area-inset-top，100dvh 也还是按老高度算，顶栏钻进状态栏、
     底下空出一大块。所以退回 default，版面回到 v47 那个已知是好的状态。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Safari 标签页里顶上那条还是拿 theme-color 涂的，跟 body 一起读 --ground -->
<meta name="theme-color" content="#e0e0dc">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体请求一旦写错是静默失败的：整条 css2 返回 400，六个字体一个都不下来，
     页面看着「字体不对」，但 CSS 是对的。之前 Literata 就是这么挂了一路。
     drive.mjs 里有一条断言专门请求这几条 URL 验 200。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=Libre+Caslon+Text:wght@400&family=Gulzar&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="MARGIN">
<title>MARGIN · 可点击原型</title>
<style>
/* ==========================================================================
   Token 层 —— 全站唯一的取色处。换肤和深色模式都只动这一块。
   语义命名，不是「灰1灰2」：以后换一套视觉，对着角色填就行。
   ========================================================================== */
/* ==========================================================================
   Token 层 —— 全站唯一的取色处。17 个：14 个核心 + 3 个派生的淡色。
   和 Figma 的 Color collection 一比一（名字一模一样）。
   少用新颜色，多用透明度：按下态、条槽、色阶都是已有色加 alpha。
   ========================================================================== */
:root{
  /* ======================================================================
     皮肤层。默认 Pearl；Say Briefly 整套留在 [data-skin="briefly"] 里，
     没删 —— 「我」里能一键切回去，将来也能做成正式的主题选项。
     组件只认 token，不认皮肤名字，所以换皮不用动任何页面。
     ====================================================================== */

  /* ---- Pearl：珠光近白 + 一个墨灰 + 绿进红出（按 Figma 2096-1015） ---- */
  --ink:#414140;            /* 正文、图标、主按钮 */
  --ink-muted:#8e8e8c;      /* 说明小字 */
  --ink-faint:#b9b9b6;      /* 占位、禁用 */
  --page:#f2f1ef;           /* 页面底（上面还铺一层珠光） */
  /* 真机上 iOS 独立模式会拿 body 的背景色去涂状态栏那条，所以 body 不能用
     --page —— 珠光那层压上去之后顶部量出来是 #e0e0dc，差 18/255，真机上就是
     顶上一块比背景浅的色块，下边缘一条直线。--ground 就是「真机看到的底色」。 */
  --ground:#e0e0dc;
  --surface:rgba(255,255,255,.6);    /* 玻璃卡 */
  --sunken:rgba(255,255,255,.5);     /* 内嵌块、只读框 */
  --field:#ffffff;          /* 输入框 */
  --edge:rgba(255,255,255,.95);      /* 卡片那圈高光边 */
  --line:#ececea;           /* 卡片内部的分隔线 */
  --accent:#414140;
  --on-accent:#ffffff;
  --nav:rgba(255,255,255,.8);
  --on-nav:#414140;
  --mark:#ffffff;           /* Pearl 里没有荧光笔，退化成白 */
  /* 图标底的白圆：40% 白 + 1px 纯白描边，不带投影。顶栏那两颗一样。 */
  --icon-bg:rgba(255,255,255,.4);
  --btn-bg:rgba(255,255,255,.4);
  --icon-edge:#ffffff;
  --accent2:#f3f3f1;        /* 次级按钮底 */
  --on-tint:#414140;
  /* 这一套终于有红有绿了 —— 不用再靠涂层和字号喊话 */
  --good:#38bc37;
  /* 账户卡堆的第三色（稿子 2310:18341 采出来是 #8FC48E）。
     --good 那个 #38bc37 太艳，卡上铺满会吵，所以单开一个。 */
  --leaf:#8fc48e;
  --warn:#d37641;
  --bad:#d37641;            /* 你把 #F44336 改软成了这个 */
  --good-tint:color-mix(in srgb, var(--good) 12%, #ffffff);
  --warn-tint:color-mix(in srgb, var(--warn) 12%, #ffffff);
  --bad-tint:color-mix(in srgb, var(--bad) 10%, #ffffff);
  --press:color-mix(in srgb, var(--ink) 6%, transparent);
  --track:color-mix(in srgb, var(--ink) 10%, transparent);
  --ai-gradient:#414140;
  --r-sm:12px; --r:24px; --r-md:20px; --r-lg:24px; --r-pill:9999px;
  --shadow-fab:0 12px 34px -18px rgba(65,65,64,.45);
  --shadow-pill:none;
  --shadow-nav:0 12px 34px -18px rgba(65,65,64,.45);
  --shadow-card:0 8px 26px -18px rgba(65,65,64,.28);
  --shadow-sheet:0 -8px 30px -18px rgba(65,65,64,.4);
  /* 正文 Onest。两个都从 Google Fonts 来，
     所以手机和电脑上是同一套，不靠本机装没装。 */
  --font:"Onest","PingFang SC","Hiragino Sans GB",
    -apple-system,"Helvetica Neue",Helvetica,sans-serif;
  /* 你把标题、名字、数字都换成了衬线 —— 这是这一版最大的性格 */
  /* display 换成 Bricolage Grotesque（稿子 2304:10840 起）。Gulzar 退到后面
     当兜底 —— 它还在字体表里，换皮肤的人可能还要。 */
  --font-display:"Bricolage Grotesque","Archivo Black","Gulzar","Songti SC",sans-serif;
  /* 数字和标题同一支 —— 这一版只留两支字 */
  --font-num:"Bricolage Grotesque","Archivo Black","Gulzar","Songti SC",sans-serif;
  /* 账本行里的金额单独一支 Inter —— 稿子就是这么定的 */
  --font-amt:"Inter",-apple-system,"Helvetica Neue",Helvetica,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --w-light:300; --w-body:400; --w-mid:500; --w-bold:600;
  /* ---- Figma 新增 ----------------------------------------------------
     Green 01：图表用的柔和绿（甜甜圈分段、本月那根柱子）。
     交易行的图标圆现在按方向上色：出账暖橘、进账绿，都是稿子里点出来的
     具体色，不是 good/warn 算出来的，所以单独立 token。
     按钮投影：4/4 15 −18 的 15%，很浅，只是把按钮从玻璃底上托起来一点。 */
  --green-01:#8fc48e;
  --spend-bg:#fad9c6; --spend-edge:#eb9d6b;
  --income-bg:#deefde; --income-edge:#8fc48e;
  --icon-ring:#e6e4dd;
  --warn-line:#e3bba1;   /* 暖橘卡里的分隔线（稿子 26:895 的 setting up）*/    /* 固定承诺那四颗白圆的描边（稿子 26:895）*/
  --shadow-btn:4px 4px 15px -18px rgba(65,65,64,.15);
  --chip-edge:rgba(172,172,172,.3);
  --soft-edge:#b9b9b6;
  /* 饼图/环图的单色梯：同一个墨色，只有深浅。对应 Figma 的 ramp-1..6。
     不用多色相 —— 这套系统里颜色是拿来做判定的，不是拿来分类的。 */
  --ramp-1:#414140; --ramp-2:#6f6f6d; --ramp-3:#949492;
  --ramp-4:#b9b9b6; --ramp-5:#d8d8d5; --ramp-6:#ececea;
  --glass:16px;             /* backdrop-filter 的模糊半径，关掉就填 0px */
}

/* ---- Say Briefly：原样留着，切回去就是原来那一版 ---- */
:root[data-skin="briefly"]{
  --ink:#1a3300;
  --ink-muted:color-mix(in srgb, var(--ink) 62%, var(--page));
  --ink-faint:color-mix(in srgb, var(--ink) 34%, var(--page));
  --page:#fcfaf5;
  --ground:#fcfaf5;
  --surface:#fcfaf5;
  --sunken:#f1eee5;
  --field:#fcfaf5;
  --edge:#b6b6b6;
  --line:rgba(182,182,182,.5);
  --accent:#1a3300;
  --on-accent:#fcfaf5;
  --nav:color-mix(in srgb, var(--accent2) 30%, var(--page));
  --on-nav:#1a3300;
  --mark:#ffe95c;
  --icon-bg:rgba(255,255,255,.4);
  --btn-bg:rgba(255,255,255,.4);
  --icon-edge:#ffffff;
  --accent2:#a8e5e5;
  --on-tint:#1a3300;
  --good:#1a3300;
  --warn:#1a3300;
  --bad:#cb5521;
  --good-tint:#d5f5c2;
  --warn-tint:#ffe95c;
  --bad-tint:color-mix(in srgb, var(--bad) 12%, var(--page));
  --press:color-mix(in srgb, var(--ink) 8%, transparent);
  --track:color-mix(in srgb, var(--ink) 14%, transparent);
  --ai-gradient:#1a3300;
  --r-sm:6px; --r:12px; --r-md:12px; --r-lg:16px; --r-pill:9999px;
  --shadow-fab:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-pill:none;
  --shadow-nav:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-card:none;
  --shadow-sheet:0 1px 3px 0 rgba(0,0,0,.12);
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",
    -apple-system,"Helvetica Neue",Helvetica,sans-serif;
  --font-display:"Bricolage Grotesque","Archivo Black","PingFang SC",var(--font);
  --font-num:var(--font);
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --w-body:400; --w-mid:500; --w-bold:600;
  --glass:0px;
}

   不是把浅色反过来 —— 纸墨互换之后对比度和判定色都得重新挑。
   三种状态：跟随系统（不带 data-theme）、明确选浅色、明确选深色。 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
  --ink:#ececeb; --ink-muted:#9a9a98; --ink-faint:#6a6a68;

    --accent:#ececeb; --on-accent:#1a1a19;

    --mark:rgba(255,255,255,.1); --accent2:rgba(255,255,255,.1); --on-tint:#ececeb;
    --icon-bg:rgba(255,255,255,.1);

    --icon-edge:rgba(255,255,255,.22);

    --bad-tint:color-mix(in srgb, var(--bad) 14%, transparent);
    --ai-gradient:#ececeb;
    --press:color-mix(in srgb, #ffffff 8%, transparent);
    --track:color-mix(in srgb, #ffffff 14%, transparent);
    --shadow-fab:0 12px 34px -18px rgba(0,0,0,.7);
    --shadow-nav:0 12px 34px -18px rgba(0,0,0,.7);

    --green-01:#8fc48e;
    --spend-bg:rgba(224,138,88,.18); --spend-edge:rgba(224,138,88,.5);
    --income-bg:rgba(143,196,142,.16); --income-edge:rgba(143,196,142,.5);
    --icon-ring:rgba(255,255,255,.14);

    --ramp-1:#ececeb; --ramp-2:#c2c2c0; --ramp-3:#9a9a98;
    --ramp-4:#6f6f6d; --ramp-5:#4a4a48; --ramp-6:#2e2e2c;
  }
  /* briefly 的深色单独留着 */
  :root[data-skin="briefly"]:not([data-theme="light"]) {
  --ink:#edf3e4; --ink-muted:#9aa88c; --ink-faint:#5f6b54;
    --page:#14180f; --ground:var(--page); --surface:#14180f; --sunken:#1b2016;
    --field:#1b2016; --edge:#3b4633; --line:rgba(237,243,228,.14);
    --accent:#d5f5c2; --on-accent:#14180f;
    --nav:#1b2016; --on-nav:#edf3e4;
    --mark:#f5dd4a; --accent2:#8fd4d4; --on-tint:#1a3300;
    --icon-bg:rgba(255,255,255,.1);
    --btn-bg:rgba(255,255,255,.14);
    --icon-edge:rgba(255,255,255,.22);
    --good:#d5f5c2; --warn:#f5dd4a; --bad:#ff8a5c;
    --good-tint:color-mix(in srgb, var(--good) 16%, transparent);
    --warn-tint:color-mix(in srgb, var(--warn) 16%, transparent);
    --bad-tint:color-mix(in srgb, var(--bad) 14%, transparent);
    --ai-gradient:#d5f5c2;
    --press:color-mix(in srgb, var(--ink) 8%, transparent);
    --track:color-mix(in srgb, var(--ink) 14%, transparent);
    --shadow-fab:0 1px 2px 0 rgba(0,0,0,.35);
    --shadow-nav:0 8px 26px 0 rgba(245,221,74,.14),0 1px 2px 0 rgba(0,0,0,.4);
    --shadow-pill:none;
    --shadow-sheet:0 -8px 28px -12px rgba(0,0,0,.6);
  }
}

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--ink);line-height:1.5;font-size:14px;
 font-weight:var(--w-body);
 font-family:var(--font);
 -webkit-font-smoothing:antialiased}
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;
 padding:40px 28px 80px;flex-wrap:wrap}
.side{width:300px;padding-top:6px}
.side h1{font-size:22px;font-weight:600;margin:0 0 8px}
.side p{font-size:13px;color:var(--ink);margin:0 0 14px;line-height:1.65}
.side h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-muted);
 margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--ink-faint)}
.side .k{display:flex;flex-wrap:wrap;gap:7px}
.side button{font:inherit;font-size:12px;border:1px solid var(--ink);background:var(--page);
 border-radius:var(--r-pill);padding:6px 12px;cursor:pointer}
.side button:hover{background:var(--ink);color:var(--page)}
.side .hint{font-family:"Caveat",cursive;font-size:16px;color:var(--ink-muted);background:var(--sunken);
 border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 11px;line-height:1.35}
.side .ex{font-size:12px;color:var(--ink);line-height:1.9;margin:0;padding-left:16px}
.side .clock{font-variant-numeric:lining-nums tabular-nums;font-size:12px;color:var(--ink-muted);margin:8px 0 0}

/* Pearl 的珠光底：五团高斯模糊的中性色，压在所有内容下面。
   （试过换成稿子里那张丝绸图，按你说的换回来了。）
   inset 保持 0 —— 负 inset 会把 .phone 的滚动区撑出去，键盘一起来浏览器
   就会去滚它，抽屉跟着飞。要放大靠 transform，不靠往外扩。 */
/* 往外扩 70：blur(55) 会在四条边上和外面的透明混合，不扩就整圈偏亮
   （量出来上边差 10/255）。当年不敢扩是因为负 inset 让 .phone 变成了可滚容器，
   那个根因已经用 overflow:clip 解决了 —— 滚动相关的几条测试盯着这件事。 */
.phone::before{content:"";position:absolute;inset:-70px;z-index:0;pointer-events:none;
 will-change:transform;animation:silk 64s ease-in-out infinite alternate;
 /* 稿子 26:895 的底：五个实心椭圆，各自 110 的高斯模糊。
    所以这里用「硬边椭圆 + 一次整体模糊」，不是软渐变 —— 软渐变的falloff
    是线性的，和高斯不一样，压出来整片会偏灰。位置和尺寸按 390×844 换算：
      blob1 #dcddda  (-62,-118) 281×405 → 36.0% 24.0% at 20.1% 10.0%
      blob2 #d8d9d7  (218,-143) 250×371 → 32.1% 22.0% at 87.9%  5.0%
      blob3 #e6e4dd  (109,  17) 343×473 → 44.0% 28.0% at 71.9% 30.0%
      blob4 #d7d7d7 31% (-117,203) 296×405 → 37.9% 24.0% at  7.9% 48.0%
      blob5 #acaaa5 29% (-16, 439) 390×506 → 50.0% 30.0% at 45.9% 82.0%
    Figma 的模糊半径约等于 CSS 的两倍标准差，110 → 55。 */
 /* 注意顺序是反的：CSS 里先写的那层在最上面，Figma 里后面的子节点在最上面。
    所以这里 blob5 → blob1 倒着写，重叠处的压盖关系才和稿子一致。 */
 background:
  radial-gradient(36.8% 25.7% at 47.0% 77.4%, rgba(172,170,165,.29) 0 100%, transparent 100%),
  radial-gradient(27.9% 20.6% at 19.1% 48.3%, rgba(215,215,215,.31) 0 100%, transparent 100%),
  radial-gradient(32.4% 24.0% at 66.1% 32.9%, #e6e4dd 0 100%, transparent 100%),
  radial-gradient(23.6% 18.9% at 77.9% 11.4%, #d8d9d7 0 100%, transparent 100%),
  radial-gradient(26.5% 20.6% at 28.0% 15.7%, #dcddda 0 100%, transparent 100%),
  /* 垫一层不透明的底：不然模糊会在四条边上和透明混合，角上整片偏亮
     （量出来差 9/255）。Figma 那边椭圆本来就是压在 #f2f1ef 上的。 */
  linear-gradient(var(--page), var(--page));
 filter:blur(55px)}
/* 静止态（0%）不位移 —— 它就是稿子里那一帧。只留一点点过度缩放，
   把 blur 在四条边上的衰减挡在视野外；漂移从这一帧往外走。
   之前 0% 带 translate(-1.5%,-1%)，等于一上来就比稿子偏了一截。 */
@keyframes silk{
  0%   {transform:scale(1.08) translate3d(0,0,0)      rotate(0deg)}
  50%  {transform:scale(1.16) translate3d(1.5%,1.5%,0) rotate(-.35deg)}
  100% {transform:scale(1.10) translate3d(-1%,2%,0)    rotate(.2deg)}
}
/* 系统里关了动效就别动 */
@media (prefers-reduced-motion: reduce){
  /* 动画都关了就别再占着合成层 */
  .phone::before{animation:none;will-change:auto} }
/* 64 秒的循环，页面切走了就没必要还在跑 */
:root.bg-still .phone::before{animation-play-state:paused}
:root[data-skin="briefly"] .phone::before{display:none}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .phone::before{display:none}
}
:root[data-theme="dark"] .phone::before{display:none}
.phone > *{position:relative;z-index:1}
.phone{width:390px;height:844px;border:1px solid var(--edge);border-radius:34px;
 background:var(--page);
 /* clip 不是 hidden：hidden 会让它变成一个「可滚动容器」—— 底图那层往外扩了
    18%，正好把滚动区撑出去 165px，于是输入框一聚焦，浏览器为了露出光标
    就把整个 .phone 滚上去，抽屉跟着飞到半空。clip 根本不可滚，断了根。 */
 overflow:hidden;overflow:clip;
 display:flex;flex-direction:column;position:relative;flex-shrink:0;
 box-shadow:var(--shadow-sheet)}
.inset{height:40px;flex-shrink:0}
/* 标题脱离了文档流（见 .navt），所以剩下的两边要靠 space-between 撑开，
   否则右边那堆（合计 / 进度条 / 清单）会缩到返回键旁边去。 */
/* 稿子 26:895 的顶栏底下没有分隔线 —— 玻璃卡自己有边界，再加一条会把
   页眉切成一块，反而像贴上去的 */
.nav{min-height:50px;display:flex;align-items:center;justify-content:space-between;
 gap:8px;padding:0 12px;flex-shrink:0}
/* 左右两栏等宽，中间那栏才是真居中 —— 头像 38、月/年 70，
   靠 flex 的话日期会被挤偏；1fr auto 1fr 不管两边多宽都对称。 */
.nav.split{display:grid;grid-template-columns:1fr auto 1fr}
.nav.split > :first-child{justify-self:start}
.nav.split > :last-child{justify-self:end}
/* 标题绝对居中：靠 flex 的话，左边返回键和右边那堆东西宽度不一样，
   标题就会偏（量出来最多偏了 36px）。脱离文档流钉在正中最稳，
   pointer-events:none 保证它不会挡住两边的按钮。 */
.nav{position:relative}
/* 稿子 2188:5990 的 CJK/Title：17/22。原来写的是 20，压着那一行别的东西。 */
.navt{font-family:var(--font-display);font-size:17px;line-height:22px;
 font-weight:var(--w-body);color:var(--ink);letter-spacing:-.01em;
 position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 顶栏里的字标（首页）本来就是居中的，别被上面那条带跑 */
.nav.split .navt{position:static;left:auto;right:auto}
:root[data-skin="briefly"] .navt{font-family:var(--font);font-weight:700}
.body{flex:1;padding:14px 16px 148px;display:flex;flex-direction:column;gap:12px;
 overflow-y:auto;overflow-x:hidden}
/* 底栏压住的那一段，内容淡出去，不是被硬切在底栏边缘。
   用 mask 而不是盖一层渐变色：底下那层珠光不是纯色，盖色块永远对不上；
   mask 是让内容自己变透明，露出来的就是真背景。
   只给真的有底栏的那些页加（见 render 里的 dockfade）。
   底栏坐在 bottom:30、高 66，所以 96 是它的上沿 —— 从上沿再往上 14 开始淡。 */
.body.dockfade{
 -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 110px),transparent calc(100% - 30px));
 mask-image:linear-gradient(to bottom,#000 calc(100% - 110px),transparent calc(100% - 30px))}
/* flex 列里子项默认会被压扁去适配容器（.sw 带 overflow:hidden 会直接塌成一条缝）—— 
   一律不许收缩，超出就滚动 */
.body > *{flex-shrink:0}
/* 悬浮按钮浮在正文之上（bottom:78 + 56 高 = 盖住标签栏往上 72px），
   所以有它的页面要把这块高度垫出来，不然年视图这种长页面最后一张卡会被压住 */
/* 底栏浮在正文上面，占掉 30(离底) + 62(高) = 92。滚到底时再留 56 的余量，
   最后一行不会贴着底栏的投影。年视图和账单页原来就差这一口。 */
/* 底栏 30(离底) + 66(高) = 96，再留 56 的余量，最后一行不贴着投影 */
.body.hasfab{padding-bottom:152px}
/* 悬浮的「马上记一笔」：42 的橙圆，压在账本列表上、底栏上方 10。
   点它直接开那张「键盘就绪」的快捷输入，不是带表单的详细记账页。 */
.qlog{position:absolute;right:32px;bottom:106px;z-index:5;
 width:45px;height:45px;border-radius:50%;background:var(--warn);color:#fff;
 display:flex;align-items:center;justify-content:center;cursor:pointer;
 box-shadow:0 6px 16px -6px rgba(65,65,64,.35);
 transition:transform .12s ease}
.qlog:active{transform:scale(.92)}
/* 底部不再是通栏，是一簇悬浮的东西：一条玻璃药丸，内容从底下滑过去 */
/* 稿子 26:895：整条 350×66，内边距 4（66 = 4 + 58 + 4），背景模糊 20 */
/* 底色不是平的 80% 白：Figma 把那层 drop shadow 画在半透明填充的**下面**，
   所以它透过来、把底栏下半截压暗了；CSS 规范里外投影会被裁掉，不画进元素
   自己的边框盒，同样的参数浏览器就是平的。
   逐点采样反推：顶上等效白 ≈ 253，底下 ≈ 238，中间基本线性。
   所以这里用一条渐变把那个效果补回来，而不是照抄「一个纯白 + 一层投影」。 */
.dock{position:absolute;left:20px;right:20px;bottom:30px;z-index:4;
 display:flex;align-items:center;gap:8px;
 background:linear-gradient(180deg,
   rgba(255,255,255,.8) 0%, rgba(237,237,237,.8) 100%);
 border:1px solid var(--edge);border-radius:var(--r-pill);padding:4px;
 box-shadow:var(--shadow-nav);backdrop-filter:blur(20px)}
/* ---- 底栏三（四）颗：说一句 · 点阵 · [返回] · 记一笔 ---------------------- */
/* 稿子 2219:7974：Log 那一态里 Speak/Add 是 54 高、整条仍是 66，
   所以上下各留 2 的外边距（4+2+54+2+4 = 66），左右合起来正好是稿子的 8。
   字是 Onest Regular 15，不是 Medium 14.5。 */
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;
 margin:2px 4px;border-radius:var(--r-pill);font-size:15px;font-weight:var(--w-body);
 letter-spacing:-.015em;background:rgba(236,236,236,.2);color:var(--ink);cursor:pointer;
 border:1px solid var(--icon-edge);min-width:0;white-space:nowrap;overflow:hidden}
.act.dark{background:var(--accent);color:var(--on-accent)}
/* 说一句那一态：记一笔是橙的（稿子 2188:6416，填的是 warn） */
.act.hot{background:var(--warn);color:#fff;border-color:var(--icon-edge)}
.act:active{transform:scale(.97)}
/* 默认是黑的（底栏正露着四个分区）；点一下换出动作键，它才变成白底 */
.gridb{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;
 align-items:center;justify-content:center;background:var(--accent);
 color:var(--on-accent);border:1px solid var(--icon-edge);
 cursor:pointer;touch-action:none;
 /* 颜色不会「冲过头再回来」，过冲曲线套在这儿只是让它变慢 */
 transition:background-color .2s ease,color .2s ease}
/* 两侧的槽：换内容的时候淡出淡入，不要硬切 */
.dockside{flex:1;min-width:0;display:flex;
 transition:opacity .11s ease,transform .11s ease}
.dockside.swapping{opacity:0;transform:scale(.97)}
.dockside > *{flex:1;min-width:0}
/* Log 那一态中间那颗是 60% 白 + 深色点阵（稿子 2219:7974）*/
.gridb.open{background:rgba(255,255,255,.6);color:var(--ink)}
/* 展开时，两颗药丸里各坐两个分区。按样机：药丸和收起时的 .act 同底，
   药丸里是 44 的圆形热区，当前分区实色、其余压到 50%。 */
.navpill{position:relative;flex:1;min-width:0;height:58px;border-radius:var(--r-pill);
 background:rgba(236,236,236,.2);border:1px solid var(--icon-edge);
 display:flex;align-items:center;justify-content:space-between;
 gap:0;padding:0 4px}
/* 稿子 26:895：选中的那一格是一颗白色药丸（64×38，r30），
   没选中的就是透明。不再靠透明度分主次 —— 白底更直接。 */
/* 稿子把每一格做成了「图标 + 名字」：65×50、r30、1px 白描边 + 很浅的投影。
   50 高已经过了 44 的下限，不用再撑热区了。 */
/* 白底从 .navb.on 的背景里抽出来，做成一条独立的滑块 —— 原来那条
   .18s 的背景过渡一次也没跑过：render 是整屏重画，每格都是新节点，
   新节点没有「上一个状态」。抽出来之后它能在两格之间横着滑（见 playNav）。 */
.navslide{position:absolute;top:4px;left:0;height:50px;border-radius:30px;
 background:linear-gradient(180deg,#ffffff 0%,#f4f4f4 100%);
 border:1px solid var(--icon-edge);
 box-shadow:0 2px 6px -1px rgba(65,65,64,.12),0 1px 2px rgba(65,65,64,.06);
 z-index:0;pointer-events:none;opacity:0;
 transition:transform .34s cubic-bezier(.22,1,.36,1),opacity .18s ease}
.navb{position:relative;z-index:1;
 width:65px;height:50px;border-radius:30px;flex-shrink:0;display:flex;
 flex-direction:column;align-items:center;justify-content:center;gap:2px;
 color:var(--ink);cursor:pointer;border:1px solid transparent}
/* 图标和名字之间 2（稿子 2219:7801） */
.navb > span{font-size:11px;line-height:13px;font-weight:var(--w-body);
 color:var(--ink);white-space:nowrap}
/* 选中的那格是白到浅灰的竖向渐变，不是纯白 */
/* 只有选中那格有描边和投影。稿子里那层是 3% + 负 18 扩散，等于看不见，
   这里给一层真的托得起来的。 */
/* 选中那格自己不画底了，底是上面那条滑块 */
.navb.on{background:none;border-color:transparent;box-shadow:none}
.navb:active{transform:scale(.92)}
/* 收起时如果这一页没有语音键，左边留一颗同宽的空药丸，点阵才不会跑偏 */
.act.ghost{background:transparent;pointer-events:none}

/* ---- 热区 ----------------------------------------------------------------
   小图标按钮视觉上就该小，但手指不认视觉。用一个透明的伪元素把可点区域
   往外撑到 44（Apple HIG 的下限），版式一点不动。
   撑多大要看邻居有多近：并排的按钮只能撑到「中心距」，撑过头会互相抢点击。 */
.tapout{position:relative}
.tapout::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:max(100%,44px);height:max(100%,44px)}
/* 并排三颗，中心距 40 —— 只撑到 40，正好挨着不重叠 */
.rnd::after{width:max(100%,40px);height:max(100%,40px)}
/* 只把高度撑够：左右挨着别的东西时，横向再撑就会抢到邻居头上 */
.taph{position:relative}
.taph::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
 height:max(100%,44px)}
.avatar,.iconbtn,.rnd,.eye,.mochip [data-a]{position:relative}
.avatar::after,.iconbtn::after,.rnd::after,.eye::after,.mochip [data-a]::after{
 content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:max(100%,44px);height:max(100%,44px)}
.rnd::after{width:max(100%,40px);height:max(100%,40px)}
/* 成排的那些只撑高度 */
.seg>span,.chip[data-a],.toggle,.asmini,.fmenu div{position:relative}
.seg>span::after,.chip[data-a]::after,.toggle::after,.asmini::after,.fmenu div::after{
 content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
 height:max(100%,44px)}
/* 会换行的那一排 chip：自己 34 高、行距 10，热区撑到 44 正好挨着不重叠 */
.chip[data-a]{min-height:34px}
/* Pearl：白玻璃 + 一圈高光边 + 很软的投影。briefly：跟页面底同色、靠描边分层。 */
.card{border:1px solid var(--edge);border-radius:var(--r);background:var(--surface);
 padding:18px;box-shadow:var(--shadow-card);backdrop-filter:blur(var(--glass))}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--page)}
/* 稿子的 CJK/Caption 是 12/16 —— 字号一直对，行高一直没写 */
.lbl,.sub{font-size:12px;line-height:16px;color:var(--ink-muted)}
/* ---- 排版 ------------------------------------------------------------------
   字号/行高/字距抄自 Figma（Pearl · Home / Pearl · Analytics）。
   三套字各管一摊：
     Libre Caslon Text —— 标题、条目名、所有数字金额（一律 400）
     Onest             —— 界面字：标签、元信息、按钮文字、坐标轴
   不要再凭手感改这些值。 */
/* 衬线只留给标题和「大的 display 金额」。条目名和行里的金额都走 Onest ——
   稿子 26:895 量出来：Lunch 是 Onest 16、−£10.00 是 Onest 15。 */
.serif,.cardtitle,.wordmark,.secttl{font-family:var(--font-display);
 font-weight:var(--w-body);font-variation-settings:"opsz" 14,"wdth" 100}
/* 数字统一走 --font-num。只声明字族 —— 字号和字距各处自己写，别在这儿一起设，
   不然会盖掉后面那些按稿子量出来的值。
   数字一律要 lnum + tnum：等高、等宽，金额列才对得齐。
   （Caslon 本来就是等高数字，没有 lnum 这个 feature，写上也无害；
   换成旧式数字的衬线 —— Bona Nova 那种 —— 时它就是救命的那一条。） */
.big,.tileval,.callout{font-family:var(--font-num);
 font-variation-settings:"opsz" 14,"wdth" 100;
 font-variant-numeric:lining-nums tabular-nums}
/* 行里的金额一律 Inter Medium（--font-amt）。展示用的大数字不在此列 ——
   .big / .figure .money / .tileval / .callout 各自写死了衬线，别动。
   lining 留着：万一以后换成有旧式数字的字体，它是救命的那一条。 */
.money,.num,.ta b{font-family:var(--font-amt);font-variant-numeric:lining-nums}
/* 字标 MARGIN：14/16，字距 +2.1px，左边贴一颗 17 的六点章。
   稿子 2282:1363 是 grid 叠出来的：章在 0，字从 19 起 —— 也就是中间空 2。 */
.wordmark{font-size:14px;letter-spacing:2.1px;line-height:16px;
 display:flex;align-items:center;justify-content:center;gap:2px;
 text-align:center;color:var(--ink)}
/* 卡片标题 Total income / Committed：14/18 */
/* 稿子 26:895：Analytics / Committed 这类卡标题是 17/22，和 Transactions 同一档 */
.cardtitle{font-size:17px;line-height:22px;color:var(--ink)}
/* 分区标题 Transactions：17/22 */
.secttl{font-size:17px;line-height:22px;letter-spacing:-.34px;color:var(--ink)}
/* 条目名：15/20 */
.rowname,.tn b{font-family:var(--font);font-weight:var(--w-body);font-size:16px;
 line-height:20px;letter-spacing:-.22px;color:var(--ink)}
/* 界面字一律 Onest。这几处以前跟着正文走，会被衬线带跑。 */
.hlbl,.dhead,.tn > span,.ta > span,.act,.mochip > span,.sparkl span,.chartax span{
 font-family:var(--font)}
/* 标签到下面那个大数字之间 12（稿子 26:895 量出来的，原来只有 2）*/
.hlbl{margin:16px 0 12px;font-size:14px;font-weight:var(--w-body);line-height:20px;
 color:var(--ink-muted)}
.dhead{font-size:12.5px;line-height:16px;color:var(--ink-muted);margin:6px 0 2px}
/* 奶油纸不用衬线 —— 它的性格在 Bricolage + 荧光笔上，衬线一律退回正文字体 */
:root[data-skin="briefly"] .serif,:root[data-skin="briefly"] .rowname,
:root[data-skin="briefly"] .cardtitle,:root[data-skin="briefly"] .wordmark,
:root[data-skin="briefly"] .secttl,:root[data-skin="briefly"] .tn b{
 font-family:var(--font)}
/* 眉标做成黄色徽章（稿子 2080-1013）—— 荧光黄在这套系统里就是「做记号」 */
.badge{display:inline-flex;align-items:center;align-self:flex-start;
 background:var(--mark);color:var(--ink-muted);border-radius:var(--r-pill);
 padding:3px 12px;font-size:12px;line-height:18px;white-space:nowrap;
 border:1px solid var(--edge)}
/* 不能连 .ol 一起清掉 —— 它的优先级(0,3,0)比 .badge.ol(0,2,0) 高，
   写成 :not(.ol) 才不会把描边徽章也抹平 */
:root[data-skin="briefly"] .badge:not(.ol){color:var(--ink);border:0;
 border-radius:var(--r-sm);padding:2px 8px}
:root[data-skin="briefly"] .badge.ol{color:var(--ink);border-radius:var(--r-sm);
 padding:2px 8px}
.badge.ol{border:1px solid var(--ink)}
/* 面板里的内嵌信息块：改成薄荷底，不再靠分隔线分区 */
.block{background:var(--sunken);border-radius:var(--r-md);padding:8px 12px}
/* ---- 首页（按样机 2096-1015）---------------------------------------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
/* 右上角的 Get Pro：86×30 深底白字 + 1px 浅灰描边（稿子 2188 实测） */
.gopro{display:inline-flex;align-items:center;justify-content:center;gap:5px;
 height:30px;padding:0 12px;border-radius:var(--r-pill);flex:none;cursor:pointer;
 background:var(--accent);color:var(--on-accent);border:1px solid var(--soft-edge)}
.gopro>span{font-size:12px;line-height:14px;font-weight:var(--w-body)}
/* 稿子 26:895：191×34、内边距 7/14、里面间隔 8、3px 浅灰描边。
   所有页面（首页月份、分析页月份和年份）共用这一条，不许各写各的。 */
.mochip{display:inline-flex;align-items:center;gap:8px;background:var(--icon-bg);
 border:3px solid var(--chip-edge);border-radius:var(--r-pill);padding:0 14px;
 min-height:34px;backdrop-filter:blur(8px)}
/* 稿子里英文月份是全大写；中文没有大小写，套上去无害 */
.mochip>span{font-size:12.5px;font-weight:var(--w-mid);line-height:16px;
 min-width:78px;text-align:center;text-transform:uppercase}
.heroamt{display:flex;align-items:center;gap:8px}
/* 主数字：42/46，字距 −1.47px；小数同号但压灰 */
.heroamt .big{font-size:48px;line-height:54px;letter-spacing:-1.68px}
.heroamt .big .dec{color:var(--ink-faint)}
/* 分析页那两个大数：小数降到 26；支出那个整串同色 */
.heroamt.an .big .dec{font-size:26px}
.heroamt .big.neg{color:var(--bad)}
.heroamt .big.neg .dec{color:inherit}
.heroamt .eye{color:var(--ink-muted);cursor:pointer;padding:4px;display:flex}
/* 星号挂在大写高度上，直接替数字会飘在顶上 —— 缩一档再压下来 */
.mask{display:inline-block;font-size:.6em;letter-spacing:.12em;transform:translateY(-.06em)}
/* 稿子里 Body 的间距是拿空 frame 摆出来的：余额→两张卡 22，
   两张卡→账本 6 —— 跟两张卡之间那道缝一样宽。
   .body 自己有 12 的 gap，所以这两块各自补差值。 */
/* 稿子把三块之间从 6 拉到了 12 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.gcard{padding:16px;display:flex;flex-direction:column;cursor:pointer}
.figure{flex:1;display:flex;flex-direction:column;align-items:center;
 justify-content:center;padding:6px 0 10px}
/* 卡里的大数字是「display 金额」，还是衬线 —— 24/24，字距 −.48（稿子 26:895）。
   上一版把 .money 整族改成 Onest 时把它一起带走了，这里单独拉回来。 */
.figure .money{font-family:var(--font-num);font-size:22px;font-weight:var(--w-body);
 line-height:28px;letter-spacing:-.44px}
.figure .money .dec{font-size:13px;color:var(--ink-faint)}
.figure .sub{font-size:11.5px;line-height:15px}
.spark{display:flex;align-items:flex-end;gap:6px;height:50px}
.spark>i{flex:1;border-radius:1px;
 background:repeating-linear-gradient(90deg,var(--ink-faint) 0 1px,transparent 1px 4px)}
/* 本月那根是绿的（稿子 Green 01），不再是墨灰 */
.spark>i.on{background:repeating-linear-gradient(90deg,var(--green-01) 0 1px,transparent 1px 4px)}
.sparkl{display:flex;gap:6px;margin-top:6px}
.sparkl>span{flex:1;text-align:center;font-size:9px;line-height:12px;
 color:var(--ink-faint);letter-spacing:-.2px}
.sparkl>span.on{color:var(--ink);font-weight:var(--w-mid)}
/* 每一根柱子自己一列 —— 数字才好标在它正上方（稿子 2208 就是这样）。
   上排的列往下对齐（柱子从底往上长），下排的列往上对齐。 */
.chartcol{flex:1;min-width:0;display:flex;flex-direction:column;
 justify-content:flex-end;align-items:stretch}
.chartrow + .chartax + .chartrow .chartcol{justify-content:flex-start}
/* 标注是绝对定位的，不占列高 —— 否则当月那根柱子会比别的矮一截 */
.chartcol{position:relative}
.chartcol > .callout{position:absolute;left:-14px;right:-14px}
.chartcol > .callout:not(.bot){bottom:100%}
.chartcol > .callout.bot{top:100%}
.chartcol > .callout{text-align:center;padding:0 0 3px}
.chartcol > .callout.bot{padding:3px 0 0}
/* 稿子 2150:2125：第一张卡既没有底色，也没有描边 —— 它就是一块透明的版面 */
.anchart{gap:0;background:transparent;border:0;box-shadow:none;backdrop-filter:none}
/* 分析页的镜像柱状图：收入朝上、支出朝下，中间那行是月份 */
.chart{padding:18px 0 6px;position:relative}
/* 每根柱子现在自己一列（列里还要放那个数字标注），所以行是 stretch，
   柱子贴哪一边由列自己决定：上排贴底往上长，下排贴顶往下长。 */
.chartrow{display:flex;gap:6px;height:78px;align-items:stretch}
.chartcol > i{display:block;width:100%;border-radius:1px;
 background:repeating-linear-gradient(90deg,var(--ink-faint) 0 1px,transparent 1px 4px)}
.chartcol > i.on{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 4px)}
.chartcol > i.bad{background:repeating-linear-gradient(90deg,var(--bad) 0 1px,transparent 1px 4px)}
.chartax{display:flex;gap:6px;padding:9px 0}
/* ---- 环形图（稿子 2168:4139）----------------------------------------
   段是 SVG，标签是浮在外面的白药丸 —— 没有引线了。
   整块固定 268 高，切支出/收入/储蓄不会让页面跳。 */
.pie{position:relative;height:268px;width:100%}
.piesvg{position:absolute;left:50%;transform:translateX(-50%);
 width:132px;height:132px;overflow:visible}
.pienum{position:absolute;left:0;right:0;transform:translateY(-50%);
 text-align:center;pointer-events:none;line-height:1.2}
.pienum .sub{font-size:11px;line-height:15px}
.pienum .pietot{font-family:var(--font-num);font-size:17px;line-height:22px;
 letter-spacing:-.02em;color:var(--ink)}
/* 稿子里的药丸：50% 白底 + 1px 纯白边，左边那颗点用它自己那段的颜色 ——
   稿子用的是品类图标，但这个 app 的分组名是自由文本（固定支出、目标名、
   自定义品类都在里面），配不出图标；用同色的点反而能把药丸和段对上。 */
/* 稿子是 padding 5/13、gap 5；这里收到 11 和 4，是为了「固定还贷 56%」
   这种长名字在抽屉里（左右还各站着一个翻月箭头）不用打点。 */
.pchip{position:absolute;display:inline-flex;align-items:center;gap:4px;
 padding:5px 11px;border-radius:var(--r-pill);
 /* 稿子写的是 50% 白 + 1px 纯白；这里走 token，深色下才不会是浅底浅字 */
 background:var(--surface);border:1px solid var(--edge);
 font-size:12px;line-height:14px;color:var(--ink);white-space:nowrap}
.pchip .pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pchip .pname{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pchip .ppct{color:var(--ink-muted);flex-shrink:0;font-size:11px}
.chartax>span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-faint)}
.chartax>span.on{color:var(--ink);font-weight:var(--w-bold)}
.callout{text-align:right;font-size:12px;font-weight:var(--w-body);line-height:16px;
 color:var(--ink);height:16px}
.callout.bot{color:var(--bad);padding-top:6px}
/* 稿子：标题 →(12)→ 网格，两行之间 12，一行里两个之间 8，图标 36。
   align-content 不能用 center —— 那样标题到图标的距离会随卡片高度变。 */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;flex:1;
 align-content:start;margin-top:12px}
/* 稿子给这四颗加了描边：60% 白 + 2px #e6e4dd，和账本里那些白圆不一样 */
.quick .circ{width:36px;height:36px;background:rgba(255,255,255,.6);
 border:2px solid var(--icon-ring)}
.qi{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
/* 小块：数字 12.5/16，标签 Onest 10/13 */
.tileval{font-size:12.5px;font-weight:var(--w-body);line-height:16px;
 letter-spacing:-.19px;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.tilelbl{font-family:var(--font);font-size:10px;line-height:13px;color:var(--ink)}
/* 统一的白圆底：分类图标、快捷入口、行图标都用它。
   按稿子：40% 白 + 1px 纯白描边，不带投影 —— 玻璃卡上再叠投影会糊成一团。 */
.circ{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;
 align-items:center;justify-content:center;background:var(--icon-bg);
 border:1px solid var(--icon-edge);color:var(--ink)}
/* 账本里的行图标：30px。转存那类留白底，进出按稿子 2323:2311 上色 ——
   比上一版的橙绿浅得多，压不住 emoji 的颜色，再配一圈细描边定住形状。

   四个值全是现成 token，一个都不用写死：
     底 --warn-tint / --good-tint  是 warn、good 各混 12% 白，
       算出来正好是稿子那两个 #faefe8 / #e7f7e7；
       而且暗色皮肤里它们被换成了 16% 混透明，不会在深底上糊一块亮斑
     边 --spend-edge 本来就等于稿子那个 #eb9d6b；绿边稿子用的是满饱和的 --good
   描边 0.5 是稿子给的：手机都是 2x/3x，落到物理像素上正好一根。 */
.tr .circ{width:30px;height:30px;background:var(--icon-bg);border-color:transparent}
.tr .circ.out{background:var(--warn-tint);border:.5px solid var(--spend-edge)}
.tr .circ.in{background:var(--good-tint);border:.5px solid var(--good)}
/* emoji 当图标时：字形自带颜色，别让 .circ 的 color 去染它 */
.tremo{font-size:16px;line-height:1;display:block}
:root[data-skin="briefly"] .block{background:var(--good-tint);border-radius:var(--r-sm);
 padding:6px 10px}
/* 日期、笔数这类元数据用等宽 —— 系统里 mono 就是「工具信息」的标记 */
.meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
/* 分区标题，跟 .secttl 同一档（稿子里的 Transactions 就是这个） */
.h2{font-family:var(--font-display);font-size:17px;font-weight:var(--w-body);
 line-height:22px;color:var(--ink);letter-spacing:-.34px}
:root[data-skin="briefly"] .h2{font-family:var(--font);font-weight:700}
.big{font-family:var(--font-num);font-size:42px;font-weight:var(--w-body);
 line-height:1.15;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.03em}
:root[data-skin="briefly"] .big{font-size:40px;font-weight:800;letter-spacing:.03em;
 line-height:1.1}
/* 涂层是 briefly 的招牌 —— Pearl 里有红有绿，不需要它 */
:root:not([data-skin="briefly"]) .big.mark{background:none;padding:0;margin-left:0;
 color:inherit}
:root:not([data-skin="briefly"]) .big.mark:not(.pos){color:var(--bad)}
/* 荧光笔那一道 —— 这套系统里数字的重音靠它，不靠红色 */
/* 缺口罩荧光黄、结余罩薄荷绿 —— 两种都是「做记号」，颜色区分方向 */
.big.mark{color:var(--on-tint);
 background:linear-gradient(var(--mark),var(--mark)) 0 64%/100% 62% no-repeat;
 padding:0 6px;margin-left:-6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* 结余罩薄荷蓝 —— 缺口黄、结余蓝，方向一眼看得出 */
.big.mark.pos{background-image:linear-gradient(var(--accent2),var(--accent2))}
.num{font-family:var(--font-amt);font-size:17px;font-weight:var(--w-mid);
 font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}
:root[data-skin="briefly"] .num{font-family:var(--font);font-weight:var(--w-bold)}
/* 负字距只给数字，压中文会让字挤在一起 */
.money{font-variant-numeric:lining-nums tabular-nums;font-weight:var(--w-mid);
 letter-spacing:-.02em}
/* 大数字还是衬线，而衬线只请求了 400 —— 让它跟着 .money 变 500 会被浏览器伪粗 */
.big.money{font-family:var(--font-num);font-weight:var(--w-body)}
:root[data-skin="briefly"] .money,:root[data-skin="briefly"] .tileval,
:root[data-skin="briefly"] .ta b,:root[data-skin="briefly"] .callout{
 font-family:var(--font);font-weight:var(--w-bold)}
/* 这条 800 + 正字距是奶油纸（Bricolage）那一套。以前没限定皮肤，
   Pearl 的衬线也跟着被拉到 800 —— 只请求 400 的字重时浏览器会伪粗。 */
:root[data-skin="briefly"] .big.money{font-weight:800;letter-spacing:.03em}
/* 稿子 2188:5694：行高 54、上下各 7、元素之间 11 */
.row{min-height:54px;display:flex;align-items:center;gap:11px;padding:7px 0;
 border-bottom:1px solid var(--line)}
.card .row:last-child{border-bottom:0}
.chip{border:1px solid var(--edge);border-radius:var(--r-pill);padding:4px 11px;
 font-size:11px;background:rgba(255,255,255,.6);color:var(--ink);
 display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}
:root[data-skin="briefly"] .chip{border-color:var(--ink);background:transparent;
 font-family:var(--font-mono)}
:root[data-skin="briefly"] .mbtn{border-color:var(--ink);background:var(--surface);
 border-radius:var(--r-sm)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-accent);
 font-weight:var(--w-mid);box-shadow:var(--shadow-pill)}
.chip.flat{cursor:default}
/* 自定义分类就是普通标签，只是右边多一个 ×；「新建」是同一个壳子，描边改虚线 */
.chip.newcat{border-style:dashed;border-color:var(--ink-faint);color:var(--ink-muted)}
.chip .tag-x{margin:-4px -8px -4px -1px;padding:4px 8px;display:inline-flex;align-items:center;
 color:var(--ink-faint)}
.chip .tag-x:active{color:var(--ink)}
.mbtn{min-height:50px;border:1px solid var(--edge);background:var(--icon-bg);
 border-radius:var(--r-pill);display:flex;align-items:center;
 justify-content:center;gap:7px;font-size:15px;font-weight:500;background:var(--surface);padding:0 14px;
 cursor:pointer;text-align:center;color:var(--ink);box-shadow:var(--shadow-btn)}
.mbtn:active{transform:translateY(1px)}
.mbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
 font-weight:var(--w-bold);box-shadow:var(--shadow-btn)}
.mbtn.off{color:var(--ink-faint);border-color:var(--ink-faint);background:transparent;cursor:not-allowed}
.mbtn.sm{min-height:44px;font-size:13px}
.barh{height:8px;background:var(--track);border-radius:var(--r-pill);overflow:hidden}
.barh>i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.banner{border:1px solid;border-radius:var(--r-md);padding:12px 14px;font-size:13px;
 display:flex;gap:9px;
 align-items:flex-start;line-height:1.45}
.banner.tap{cursor:pointer}
/* 稿子 2188:5694：加号按钮是**全圆角**的药丸，不是 12 的小圆角；
   3-3 的虚线、透明底（它已经在一张玻璃卡里了，再铺一层底就是两层玻璃）。
   Vault 的「新建账户」、Bills 的「录入还贷」、我页面那些都走这一条。 */
/* ---- 金库的账户卡堆（稿子 2282:1587）--------------------------------
   每张卡 150 高，但只露出 65 —— 负 margin 叠上去，最后一张整张露出来。
   后面的卡盖住前面的下半截，靠的就是 DOM 顺序，不用 z-index。 */
/* 稿子 2304:10056：不套卡，就是居中的三行。金额走 .big（展示用衬线） */
/* 建账户时挑卡的颜色。34 的点，可点区靠 ::after 撑到 44 */
.tints{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:48px;
 padding:6px 0}
.tdot{width:34px;height:34px;border-radius:50%;cursor:pointer;position:relative;
 border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);
 box-shadow:var(--shadow-card)}
.tdot::after{content:"";position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);width:44px;height:44px}
.tdot.on{outline:2px solid var(--ink);outline-offset:3px}
/* emoji 头像沿用色点那一套的排布和热区，只是画的是字不是底色 */
.adot{width:34px;height:34px;border-radius:50%;cursor:pointer;position:relative;
 display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;
 background:var(--btn-bg);border:1px solid var(--icon-edge)}
.adot::after{content:"";position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);width:44px;height:44px}
.adot.on{outline:2px solid var(--ink);outline-offset:3px}
.totblk{text-align:center;padding:12px 0 20px}
.totblk .big{margin:2px 0 4px}
.cstack{display:flex;flex-direction:column}
.acard{position:relative;height:150px;flex-shrink:0;box-sizing:border-box;
 border-radius:var(--r-lg);
 padding:17px 18px;display:flex;flex-direction:column;justify-content:space-between;
 cursor:pointer;overflow:hidden}
/* 稿子把描边和卡自己那圈 shadow 都撤了，换成卡跟卡之间的一道影：
   每张卡往上投，压在前一张的下缘上（量出来约 16 深、最重 15%）。
   第一张上面没有卡，所以只给「有哥哥的」那些。 */
/* 卡高 150，露 65，所以往上收 85。稿子后来收到过 46，真机上太挤，退回 65。
   投影还是用稿子的新值：更贴、更柔。 */
.cstack .acard + .acard{margin-top:-85px;
 box-shadow:0 -20px 15px -18px rgba(0,0,0,.15)}
/* 这里故意不写 touch-action —— 写了 none 就把原生滚动的惯性和减速一起关了，
   经过卡片时手感会发钝。拉皮筋改由 touchmove 按需 preventDefault，见 stackDrag。 */
.acard:active{filter:brightness(.97)}
/* 详情页顶上那张不是按钮，只是同一张卡飞过来停在这儿 */
.acard.still{cursor:default}
.acard.still:active{filter:none}
/* 名字和金额同一行，两头顶格 —— 都走 display 字体（稿子量的 22/26 和 30/35） */
/* 22/26/-0.66 设在这一层，名字和金额都继承 —— 稿子把金额从 30 收到了
   和名字一样大，两个并排才是一条线 */
.ahead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
 font-family:var(--font-display);font-weight:var(--w-body);white-space:nowrap;min-width:0;
 font-size:22px;line-height:26px;letter-spacing:-.66px;
 font-variation-settings:"opsz" 14,"wdth" 100}
.aname{overflow:hidden;text-overflow:ellipsis}
.aamt{flex-shrink:0}
.afoot{display:flex;align-items:center;justify-content:space-between;gap:10px;
 font-size:12px;line-height:16px}
.afoot span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 稿子把 opacity:.5 加在这两行的容器上，不是写进文字色里 —— 所以 chev 也一起淡。
   前缀是 .cstack：只有堆在列表里的卡才淡（叠着的，只露一条，淡一点才不抢）。
   详情页那张是 .still、不在 .cstack 里，天生就不受这条管 —— 它是主角，保持满。 */
.cstack .acard .ahead,.cstack .acard .afoot{opacity:.8}
.dash{border:1px dashed var(--ink-faint);border-radius:var(--r-pill);
 background:transparent;min-height:54px;
 display:flex;align-items:center;justify-content:center;gap:8px;
 color:var(--ink-muted);font-size:15px;cursor:pointer}
.dash:active{background:var(--press)}
.fld{display:flex;flex-direction:column;gap:5px}
.fldbox,input.fldbox,select.fldbox{min-height:48px;border:1px solid var(--edge);
 background:var(--icon-bg);border-radius:var(--r-md);display:flex;align-items:center;padding:0 12px;font-size:15px;gap:8px;
 font-family:inherit;color:inherit;width:100%}
input.fldbox,select.fldbox{-webkit-appearance:none;appearance:none}
input.fldbox:focus,select.fldbox:focus{outline:none;border-color:var(--ink);border-width:1.5px}
select.fldbox{cursor:pointer;background-image:linear-gradient(45deg,transparent 49%,var(--ink-muted) 51%),
 linear-gradient(135deg,var(--ink-muted) 49%,transparent 51%);
 background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.fldbox.err{border-color:var(--bad);border-width:1.5px}
.errline{display:flex;gap:7px;font-size:13px;color:var(--bad);align-items:flex-start}
.seg{--segpad:3px;position:relative;display:flex;border:1px solid var(--edge);
 border-radius:var(--r-pill);overflow:hidden;
 background:var(--icon-bg);padding:var(--segpad);font-weight:var(--w-mid)}
/* 滑块：带一点过冲的曲线，切过去的时候有「重量」 */
/* 只动 transform：原来动的是 left + width，每切一次 tab 就重排一次版。
   width 其实从不变（同一组分段里格子一样宽），留着白留。 */
.segpill{position:absolute;top:var(--segpad);bottom:var(--segpad);left:var(--segpad);
 border-radius:var(--r-pill);
 background:var(--accent);z-index:0;
 transition:transform .34s cubic-bezier(.32,1.35,.5,1)}
.seg>span{position:relative;z-index:1;border-radius:var(--r-pill);
 transition:color .18s ease .06s}
:root[data-skin="briefly"] .seg{--segpad:0px;border-color:var(--ink);
 background:transparent;border-radius:var(--r-sm)}
:root[data-skin="briefly"] .seg>span{border-radius:0}
:root[data-skin="briefly"] .segpill{border-radius:0}
/* 稿子的 Latin/Label：14/18 */
.seg>span{flex:1;padding:11px 0;text-align:center;font-size:14px;line-height:18px;
 cursor:pointer;color:var(--ink)}
.seg>span.on{color:var(--on-accent);font-weight:var(--w-mid)}
/* 轨道 4px 是视觉；外面套一层 44 高的透明盒子当热区 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;
 background:transparent;cursor:pointer}
/* 稿子 2188:6140：槽 358×6 是 --ink-faint + 1px --line；
   把手 22 的纯白圆，**不带深色描边**（原来是 1.5px 的墨色，太重了）。 */
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:var(--r-pill);
 background:var(--ink-faint);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
 border-radius:50%;background:#fff;border:1px solid #fff;cursor:pointer;
 box-shadow:0 1px 3px rgba(65,65,64,.18);margin-top:-9px}
/* 稿子 2188:6140：关着是 44×26 的浅灰底（--ink-faint）+ 1px 高光边，
   把手 20 的纯白。原来关着是透明底 + 浅色把手，在浅背景上几乎看不见。 */
.toggle{width:44px;height:26px;border-radius:var(--r-pill);border:1px solid var(--edge);
 background:var(--ink-faint);
 position:relative;flex-shrink:0;cursor:pointer;transition:background .2s}
.toggle>i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
 background:#fff;transition:left .2s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on>i{left:22px}
/* 左滑删除：红底垫在下面，内容层往左推 */
/* 红底放在删除面板上，不要放在容器上 —— 容器铺红色会在行与行之间透出红缝 */
/* 跟着里面卡片的圆角裁 —— 否则四个圆角处会透出底下的红色删除面板 */
/* 外壳裹卡片时要和卡片一样圆（否则四角露出底下那层红）；
   裹通栏行时必须是直角 —— 行的文字从最左边起，圆角会把首字啃掉。 */
/* flex + flex:1：让删除层和内容层高度严格一致。以前两层各自量高，
   碰上小数行高时底下会漏出一条 1px 的删除色。 */
.sw{position:relative;overflow:hidden;border-radius:0;display:flex;flex-direction:column}
.sw.boxed{border-radius:var(--r)}
/* 自己也圆一下：不然它的直角顶在卡片圆角的抗锯齿边上，会透出一条红发丝 */
/* 平时整块停在行外（右侧 76），靠 .sw 的 overflow:hidden 裁掉 ——
   不是「铺在行底下用 opacity 开关」。行的底色是透明的（见下面 .card .sw-body），
   铺在底下的话红色会从金额底下透出来，而且是滑 6px 就整块透出来。
   跟着行一起往左挪，露出来的红才刚好等于行让开的那一段。
   transition 跟 .sw-body 一模一样，两层必须同步，差一点就看得出来错位。 */
.sw-del{position:absolute;top:0;right:0;bottom:0;width:76px;color:#fff;
 border-radius:inherit;display:flex;transform:translateX(76px);
 transition:transform .18s ease;
 align-items:center;justify-content:center;cursor:pointer;background:var(--bad)}
.sw.open .sw-del{transform:translateX(0)}
/* 跟外壳一样圆：卡片圆角外那一圈才不会露出底下的红 */
.sw-body{position:relative;flex:1 0 auto;background:var(--page);border-radius:inherit;
 transition:transform .18s ease;touch-action:pan-y}
/* 长按拿起来排序：不加把手，不改版式 —— 点还是进详情，左滑还是删除 */
.srt{transition:transform .16s ease}
.srt.lift{position:relative;z-index:6;transition:none;
 box-shadow:0 4px 14px -6px rgba(26,51,0,.4);border-radius:var(--r)}
.srt.lift .sw-body,.srt.lift.card{background:var(--page)}
.dragging{touch-action:none;user-select:none}
/* 行一律不刷底 —— 刷了就把底下的珠光挡死，而且和玻璃卡永远对不齐。
   正因为不刷底，删除层才不能铺在行底下：它停在行外，见 .sw-del。 */
.card .sw-body,.listcard .sw-body,.daycard .sw-body{background:transparent}
.sw.open .sw-body{transform:translateX(-76px)}
.dim{position:absolute;inset:0;background:rgba(34,32,28,.36)}
/* 抽屉就老老实实贴在「手机」的底上。键盘来了不是把抽屉往上挪 ——
   是把整台手机缩到可视视口那么高（见 visualViewport 那一段），
   于是 bottom:0 自动就落在键盘上沿。--kb 只留着调底部留白。 */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--page);
 border-top:0;border-radius:var(--r-lg) var(--r-lg) 0 0;
 padding:10px 16px max(12px, calc(20px - var(--kb,0px)));
 display:flex;flex-direction:column;gap:11px;
 max-height:calc(100% - 56px);overflow-y:auto;
 overscroll-behavior:contain;touch-action:pan-y}
/* 出场曲线：默认是「快出慢停」的五次缓出，收尾长、几乎不刹车感。
   语音和打字那两张给一条会过冲的曲线 —— 弹一下再落回来，像被推上来的。 */
.sheet.anim{animation:up .40s cubic-bezier(.22,1,.36,1)}
/* 出现的时候不要「冲过头再弹回来」—— 那个 1.5 的控制点会明显过冲。
   换成 1.05：速度曲线上还留一点回弹的劲，但位置不越过终点。 */
.sheet.anim.bouncy{animation:upBouncy .46s cubic-bezier(.22,1.05,.36,1)}
@keyframes upBouncy{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}
.dim.anim{animation:fade .3s ease}
/* 往下拖的时候跟手；松手要么弹回去、要么滑下去关掉 */
.sheet.drag{transition:none}
.sheet.snap{transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.dim.fading{transition:opacity .2s ease;opacity:0}
.grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--ink-faint);align-self:center;
 margin-bottom:5px;flex-shrink:0}
.toast.high{bottom:auto;top:52px}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);
 color:var(--on-accent);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;
 animation:up .2s ease;z-index:5}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 概览卡底下那四个统计块 */
.tiles{display:flex;gap:6px;margin-top:8px;background:var(--sunken);
 border-radius:var(--r-md)}
:root[data-skin="briefly"] .tiles{border-radius:var(--r-sm)}
.tile{flex:1;min-width:0;padding:10px 4px;border-radius:var(--r);text-align:center;
 cursor:pointer}
.tile:active{background:var(--press)}
.tile .money{font-size:15px;white-space:nowrap}
/* 三个字以上的标签在 4 等分里会撑破 —— 让它换行，块高由内容决定 */
.tile .sub{line-height:1.25}
/* 一天一张卡，左边一条竖杠 */
/* 列表一律装进白卡 —— 光着摆在底色上会散 */
/* 清单卡头：左边一行说明，右边这一档的合计（衬线 17，和行内金额区分开）*/
.lchead{display:flex;align-items:baseline;gap:9px;padding:0 0 8px;
 border-bottom:1px solid var(--line)}
.sumamt{font-family:var(--font-num);font-size:17px;line-height:22px;
 letter-spacing:-.02em;color:var(--ink);
 font-variant-numeric:lining-nums tabular-nums}
/* 稿子：内边距 16、子项之间 12。.card 一族默认 display:block，
   gap 对块级容器不生效 —— 必须显式开 flex 列（v39 踩过一次）。 */
.listcard{background:var(--surface);border:1px solid var(--edge);
 border-radius:var(--r);padding:16px;box-shadow:var(--shadow-card);
 backdrop-filter:blur(var(--glass));
 display:flex;flex-direction:column;gap:12px}
.listcard .sw:not(:last-child) .row{border-bottom:1px solid var(--line)}
.listcard .sw:last-child .row{border-bottom:0}
/* ---- 账本：按样机收进一张玻璃卡 ------------------------------------------
   卡头是「标题 · 放大镜 · 漏斗 · 饼图 · 全部」，下面按天分段。 */
/* 三块之间统一 12：.body 的 gap 就是 12，所以这里不再往回收 6 */
.txcard{position:relative;padding:16px 16px 6px}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.thead .secttl{flex:1}
.rnd{width:36px;height:36px;border-radius:50%;background:var(--icon-bg);display:flex;
 align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;cursor:pointer;
 border:1px solid var(--icon-edge)}
/* 账本卡头那两颗跟着承诺卡走：60% 白 + 2px 环（稿子 26:895）*/
.txcard .thead .rnd{background:rgba(255,255,255,.6);border:2px solid var(--icon-ring)}
.rnd.on{background:var(--accent);color:var(--on-accent)}
/* 漏斗菜单挂在按钮下面，不占默认状态的地方 */
.fmenu{position:absolute;right:16px;top:52px;z-index:5;background:var(--field);
 border-radius:var(--r-md);padding:6px;min-width:132px;border:1px solid var(--edge);
 box-shadow:var(--shadow-sheet),0 12px 30px -14px rgba(65,65,64,.5)}
.fmenu div{padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:var(--w-mid);
 letter-spacing:-.01em;cursor:pointer;color:var(--ink)}
.fmenu div.on{background:var(--accent);color:var(--on-accent)}
/* 搜索条：点放大镜才滑出来 */
.sbar{overflow:hidden;max-height:0;transition:max-height .2s ease,margin .2s ease}
.sbar.on{max-height:56px;margin-bottom:6px}
.sbar input{width:100%;height:44px;border:1px solid var(--icon-edge);
 border-radius:var(--r-pill);background:var(--icon-bg);padding:0 16px;font:var(--w-body) 14px var(--font);
 color:var(--ink);outline:none;letter-spacing:-.01em}
.sbar input::placeholder{color:var(--ink-faint)}
.tr{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:62px}
.tn{flex:1;min-width:0}
.tn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn > span{display:block;font-size:11.5px;line-height:15px;color:var(--ink-muted);
 margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{text-align:right;white-space:nowrap;flex-shrink:0}
/* 金额：15/20，字距 −0.37px；小数降到 12 并压灰 */
/* 账本里的金额用 Inter（稿子指定）。字距 0：负字距是衬线数字才需要的。 */
.ta b{font-family:var(--font-amt);display:block;font-size:15px;
 font-weight:var(--w-mid);line-height:20px;
 letter-spacing:0;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.ta b .dec{font-size:12px;color:var(--ink-faint)}
/* 收入绿、支出砖橙 —— 稿子里就是这两个色，用的是判定色 token */
.ta > span{display:block;font-size:11px;line-height:15px;margin-top:2px;
 color:var(--warn)}
.ta > span.in{color:var(--good)}
.ta > span.move{color:var(--ink-muted)}
/* 行是通栏的，外壳给圆角的话，抗锯齿会在右边两个角上漏出一条删除色的细边 */
.txcard .sw{border-radius:0}
/* 卡片是玻璃的，行要是自己刷一层不透明底，和卡片永远对不齐，行的上下就会出现
   一条淡边。改成：行不刷底，删除层平时不画，滑起来才露出来。 */
.txcard .sw-body{background:transparent}
.txempty{text-align:center;color:var(--ink-muted);font-size:13.5px;padding:22px 0 26px}
.daycard{display:flex;gap:12px;background:var(--surface);border-radius:var(--r);
 border:1px solid var(--edge);padding:0 12px;margin-top:-4px;
 box-shadow:var(--shadow-card);backdrop-filter:blur(var(--glass))}
/* Pearl 里那条竖杠太硬了 —— 行与行之间已经有分隔线，不需要它 */
:root:not([data-skin="briefly"]) .daybar{display:none}
:root:not([data-skin="briefly"]) .daycard{padding:0 16px}
:root:not([data-skin="briefly"]) .dayrows .row + .row{border-top:1px solid var(--line)}
.daybar{width:4px;border-radius:var(--r-pill);background:var(--ink);flex-shrink:0;
 margin:12px 0}
.dayrows{flex:1;min-width:0}
.dayrows .row{border-bottom:0}
/* 「我」是个圆形头像按钮，不是文字芯片 */
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;
 align-items:center;justify-content:center;background:var(--btn-bg);
 color:var(--ink-muted);border:1px solid var(--icon-edge);
 cursor:pointer}
/* briefly 的头像是那个黄方块的语言 */
:root[data-skin="briefly"] .avatar{width:38px;height:38px;background:var(--mark);
 color:var(--on-tint);border:0}
.avatar:active{background:var(--press)}
/* emoji 头像：字形本身就带色，别让 .avatar 的 color 影响它 */
.avem{font-size:19px;line-height:1;display:block}
/* ---- 结果页（稿子 34:454）-------------------------------------------
   一张实底卡（不是玻璃），从上往下：点阵表盘、名字+价格（居中）、
   判定文字。判定那块在稿子里底色和描边都关掉了 —— 它不是一张子卡，
   是卡里的一段话，所以这里也不给它底也不给它框。 */
.vcard{display:flex;flex-direction:column;
 /* 稿子那张卡左上角压着一层 20% 的暖色图；这里用一团渐变代替，
    位置和衰减是照着导出图量的。 */
 background:radial-gradient(86% 64% at -10% 34%,
   rgba(211,118,65,.22) 0%, rgba(211,118,65,.07) 40%, rgba(211,118,65,0) 64%), #f3f3ef;
 border:1px solid var(--edge);gap:12px;padding:20px 16px}
/* ---- 点阵表盘（稿子 2259:9724 的 rounds 1）---------------------------
   5 圈 × 20 颗 = 100 颗，整片点就是百分比本身，没有「不算数」的装饰点。
   从里往外填：分数多少就亮多少颗，颜色跟判定灯走（绿/琥珀/红）。
   中间留出来的空洞直径 72，和稿子的 68 差不多，数字还是稿子的 22/28。 */
.dialwrap{position:relative;width:170px;height:170px;align-self:center;flex-shrink:0}
.dial{display:block;width:100%;height:100%}
.dial .doff{fill:var(--ink);opacity:.18}    /* 没亮的那些：小一号、淡 */
.dnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-family:var(--font-num);font-size:22px;line-height:28px;letter-spacing:-.03em;
 pointer-events:none}
/* 点是画在 <g transform=translate> 里的 circle，自己的原点就是圆心 ——
   所以 scale() 是从点中心缩放的，不用再折腾 transform-box。 */
@keyframes dialOn{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}
@keyframes dialBreath{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.78)}}
/* 依次亮：每颗的延迟是 i/100 × .9s，所以不管亮几颗，整条都走 .9 秒。
   呼吸是所有亮着的点一起（同一个延迟）—— 做成波浪太闹了。 */
.dial.anim .dlit{animation:dialOn .42s cubic-bezier(.22,.9,.3,1) var(--d) backwards,
 dialBreath 3.2s ease-in-out 1.45s infinite}
.dial:not(.anim) .dlit{animation:dialBreath 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.dial .dlit{animation:none!important}}
.vhead{display:flex;align-items:baseline;justify-content:center;gap:8px}
.vname{font-family:var(--font-display);font-size:22px;line-height:28px;color:var(--ink);
 letter-spacing:-.03em}
.vprice{font-family:var(--font-num);font-size:22px;line-height:28px;color:var(--ink);
 letter-spacing:-.03em}
/* 判定段：没有底色也没有描边，只靠左右各 12 的内缩和判定色说话 */
.vtone{display:flex;flex-direction:column;gap:6px;padding:0 12px}
.vrow{display:flex;align-items:center;gap:9px}
.vlabel{flex:1;font-family:var(--font-display);font-size:17px;line-height:22px;
 letter-spacing:-.02em}
.vtext{font-size:12px;line-height:16px;color:var(--ink)}
.vactions{display:flex;justify-content:flex-end;margin-top:6px}
.vactions .chip{background:var(--surface);border:1px solid var(--edge);
 border-radius:var(--r-pill);padding:5px 13px;font-size:12px;cursor:pointer;
 display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.vcorner{font-size:11px;line-height:15px;color:var(--ink-muted);text-align:right}
.calcbox{background:var(--sunken);border-radius:var(--r-sm);padding:8px 12px}
.calcrow{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;
 border-bottom:1px dotted var(--line)}
.calcrow.tot{font-size:13px;padding:7px 0 0;border-bottom:0;font-weight:var(--w-bold)}
/* 只装一行汇总的卡：18 的内边距是给多行卡片留的，一行用着太厚 */
.sumcard{padding:14px 16px}
/* ---- 打分页的表单卡（稿子 2188:6140）--------------------------------
   整张表单一张玻璃卡，字段之间 24。标签是 Onest 15 的墨色，不是灰小字 ——
   这一页每一行都要人动手填，标签得站得住。 */
/* .card 默认是 display:block，gap 对块级容器无效（量出来三处间距都是 0）。
   要用 gap 就得显式开 flex 列。 */
.quizcard{display:flex;flex-direction:column;gap:24px;padding:16px}
.quizcard .fld{gap:5px}
.quizcard .lbl{font-size:15px;line-height:20px;color:var(--ink)}
.quizcard .nec{gap:12px}
.quizcard .ends{font-size:12px;line-height:16px;color:var(--ink-muted)}
.duprow{display:flex;align-items:center;gap:12px;min-height:26px}
.duprow > div:first-child{font-size:14px;line-height:18px;
 font-weight:var(--w-light);color:var(--ink)}
/* ---- 把设置补全（稿子 26:895 改版）---------------------------------
   整块是暖橘的虚线卡：warn-bg 打底、1px 虚线 warn 描边。
   每一项的副标题也是 warn —— 这块的意思是「这里还欠着东西」，
   所以整块用判定色说话，而不是又一张中性的玻璃卡。 */
/* 注意是 --warn-tint 不是 --warn-bg：warn-bg 是 Figma 那边的变量名，
   CSS 这边叫 tint。写错的 var() 不报错，只会静默变透明 —— 踩过一次。 */
.setup{background:var(--warn-tint);border:1px dashed var(--warn);
 box-shadow:none;backdrop-filter:none;padding:16px 16px 6px;gap:0}
.setuphead{display:flex;align-items:baseline;gap:9px;padding-bottom:6px}
.setup .later{font-size:12px;line-height:16px;font-weight:var(--w-light);
 color:var(--warn);cursor:pointer}
.setuprow{display:flex;align-items:center;gap:9px;padding:11px 0;cursor:pointer;
 border-bottom:1px solid var(--warn-line)}
.setuprow.last{border-bottom:0}
.setup .sn{font-size:12px;line-height:16px;color:var(--ink)}
.setup .ss{font-size:11px;line-height:13px;color:var(--warn);margin-top:2px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 即将发生：暖色底的圆角条，和真实流水区分开 */
.upcoming{display:flex;align-items:center;gap:11px;min-height:44px;padding:10px 14px;
 border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer;
 border:1px solid var(--edge);box-shadow:var(--shadow-card);
 backdrop-filter:blur(var(--glass))}
/* 稿子 26:895 改版：60% 白 + 1px 白描边、圆角 12，字号统一抬到 14。
   里面那颗徽章的描边也是白的 —— 在白底上基本看不见，等于只剩文字，
   这是有意的（不是漏画）。 */
.txcard .upcoming{background:var(--surface);border:1px solid var(--icon-edge);
 box-shadow:none;backdrop-filter:none;
 border-radius:var(--r-sm);padding:8px 12px;gap:8px;margin-bottom:2px}
.txcard .upcoming .amts{flex:1;min-width:0;font-size:14px;line-height:18px;
 font-weight:var(--w-light);color:var(--ink);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 徽章：透明底 + 白描边，左右不留内边距（稿子就是贴着字的） */
/* 不带描边：稿子里那圈是纯白的，压在 60% 白的条上本该看不见 —— 
   但在实际渲染里它比周围还亮，反而像给文字套了个框。直接去掉。
   左右也不留内边距，它就是一段文字。 */
.txcard .upcoming .badge.ol{background:transparent;border:0;
 padding:3px 0;font-size:14px;line-height:18px;font-weight:var(--w-light);
 color:var(--ink)}
/* 右边的展开/收起：同字号但用 Medium 压住 */
.txcard .upcoming > .sub:last-child{font-size:14px;line-height:18px;
 font-weight:var(--w-mid);color:var(--ink)}
/* briefly 那边它是薄荷蓝便利贴 */
:root[data-skin="briefly"] .upcoming{background:var(--accent2);color:var(--on-tint);
 border:0;box-shadow:none;padding:8px 12px}
/* 便利贴里的次要小字也得跟着变深，不然深色模式下会在浅底上写浅字 */
.upcoming .sub,.upcoming .lbl{color:color-mix(in srgb, var(--on-tint) 65%, var(--accent2))}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
 justify-content:center;background:var(--btn-bg);color:var(--ink);cursor:pointer;
 border:1px solid var(--icon-edge);flex-shrink:0}
:root[data-skin="briefly"] .iconbtn{width:31px;height:31px;background:transparent;
 border:1px solid var(--ink)}
.iconbtn:active{background:var(--press)}
/* 返回：光一个箭头，不套白圆。热区照样 44（.tapout 撑的） */
.navback{display:flex;align-items:center;justify-content:center;color:var(--ink);
 cursor:pointer;flex-shrink:0;margin-right:2px}
/* 返回是每一页都要按的那颗，热区给到 56 —— 比通用的 44 再宽一圈 */
.navback::after{width:56px;height:56px}
.navback:active{opacity:.55}
/* ---- AI 抽屉 ----
   一个大点阵当身份标识，一条通宽胶囊当「按住说话」。全 app 只有这颗按钮是
   胶囊 —— 圆角的形状本身就在说「可以按住」，这一处值得破例。 */
/* ---- 语音 / 打字两张抽屉（Figma 2115-9126）-------------------------------
   一句问候 + 一个盒子 + 一颗通宽的大按钮。盒子在三种状态间换内容：
   空着时是例句，说完是可改的转写，麦克风用不了时就是打字框。 */
.asgreet{text-align:center;font-size:14px;line-height:1.4;color:var(--ink-muted);

.asbox{background:var(--icon-bg);border-radius:var(--r-md);padding:12px;
 display:flex;flex-direction:column;gap:10px;min-height:89px}
/* 例句：Onest Light 14/18（稿子的 Latin/Label light）*/
.aseg{font-size:14px;line-height:18px;font-weight:var(--w-light);
 color:var(--ink-faint);white-space:pre-line}
/* 说出来/打进去的那句：Onest Light 15/20（稿子的 Latin/Body light）*/
.asbox textarea{width:100%;border:0;background:transparent;resize:none;outline:none;
 font:var(--w-light) 15px/20px var(--font);color:var(--ink);min-height:46px}
.asbox textarea::placeholder{color:var(--ink-faint)}
.asrow{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.asrow .sp{flex:1}
.asmini{height:35px;border-radius:var(--r-pill);padding:0 16px;display:inline-flex;
 align-items:center;gap:6px;font-size:12px;font-weight:var(--w-mid);cursor:pointer;
 background:var(--accent2);color:var(--ink);white-space:nowrap}
.asmini.pri{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-btn)}
.asmini.round{padding:0;width:40px;justify-content:center;background:var(--icon-bg)}
/* ---- 马上记一笔（稿子 2150:2632）------------------------------------
   抽屉本身就是那个白框：圆角 15、内边距 8、两行之间 24。 */
.sheet.quick{border-radius:15px 15px 0 0;gap:24px;
 padding:8px 8px max(8px, calc(8px - var(--kb,0px)))}
.jotin{width:100%;border:0;background:transparent;resize:none;outline:none;
 padding:0 10px;font:var(--w-light) 15px/20px var(--font);
 color:var(--ink);min-height:40px}
.jotin::placeholder{color:var(--ink-faint)}
.jotrow{display:flex;gap:6px;align-items:center}
.jotrow .sp{flex:1}
/* 两颗都是黑底白字 —— 稿子里没有浅色那一颗 */
.jotmini{height:35px;min-width:35px;border-radius:var(--r-pill);
 background:var(--accent);color:var(--on-accent);display:inline-flex;
 align-items:center;justify-content:center;gap:8px;font-size:12px;
 font-weight:var(--w-body);cursor:pointer;white-space:nowrap}
.jotmini.wide{padding:0 18px}
/* 空着的时候不画确认键（稿子那张就没有）——
   但它得在 DOM 里等着，打字时靠 class 显形，不然一重绘光标就没了 */
.jotmini.hide{display:none}
.jotmini:active{transform:scale(.96)}
/* 稿子给的是 35 高，低于 44 的下限：视觉照稿子，可点区域往外撑到 44 */
.jotmini{position:relative}
.jotmini::after{content:"";position:absolute;left:0;right:0;top:50%;
 transform:translateY(-50%);height:44px;min-width:44px}
/* 通宽的那颗：平时深色「点一下说话」，在听的时候换成波形 */
.asbtn{height:46px;border-radius:var(--r-pill);background:var(--accent);box-shadow:var(--shadow-btn);
 color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:8px;
 font-size:15px;font-weight:var(--w-mid);letter-spacing:-.22px;cursor:pointer;
 font-family:var(--font)}
.asbtn:active{transform:scale(.985)}
.asbtn.off{background:transparent;border:1px solid var(--ink-faint);
 color:var(--ink-muted);cursor:default}
.asbtn.on{background:radial-gradient(120% 180% at 50% 0%,#e8845a 0%,var(--warn) 100%)}
.asbtn .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.asbtn .cap{font-size:11px;line-height:1.45}
.asbtn .bars{display:flex;align-items:flex-end;gap:4px;height:9px}
.asbtn .bars>span{width:3px;border-radius:2px;background:currentColor;
 animation:vu .9s ease-in-out infinite}
@keyframes vu{0%,100%{height:3px}50%{height:9px}}
.aihead{display:flex;align-items:center;gap:9px;min-height:26px}
.aihead .t{flex:1;text-align:center;font-size:15px;font-weight:700}
.aihead .x{cursor:pointer;color:var(--ink);display:flex}
.aimark{display:flex;align-items:center;justify-content:center;color:var(--ink);
 padding:18px 0 10px;transition:padding .2s ease}
.aimark.sm{padding:2px 0 0}
.aimark.on>svg{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
.aitip{font-size:14px;line-height:1.55;color:var(--ink);padding:0 10px}
.aitip .eg{display:block;margin:8px 0;color:var(--ink);font-weight:var(--w-mid)}
.aitip .more{display:block;margin-top:10px;color:var(--ink-muted);font-size:13px}
.aipill{height:55px;border-radius:var(--r-pill);background:var(--accent);
 color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:7px;
 padding:0 20px;font-size:15px;font-weight:var(--w-mid);cursor:pointer;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
 touch-action:manipulation}
.aipill.off{background:transparent;border:1px solid var(--ink-faint);color:var(--ink-muted)}
.aipill .aiicon{display:flex;align-items:center;flex-shrink:0;padding:0 4px;color:inherit}
.aipill .lbl2{flex:1;min-width:0;text-align:center;white-space:nowrap}
/* 胶囊里的波形是压在墨绿底上的，得用反色 —— 默认那个灰在深底上看不见 */
.aipill .wave{flex:1;height:100%}
.aipill .wave>span,.aipill .wave.on>span{background:var(--on-accent)}
.wave{display:flex;gap:4px;align-items:center;justify-content:center;height:44px}
.wave>span{width:3px;background:var(--ink-faint);border-radius:var(--r-pill);height:9px}
.wave.on>span{background:var(--ink);animation:w .9s ease-in-out infinite}
/* 输入方式那一排：两个小图标夹着中间的主按钮 */
.inputbar{display:flex;align-items:center;gap:9px}
.inputbtn{width:48px;height:48px;border-radius:var(--r-sm);flex-shrink:0;display:flex;
 align-items:center;justify-content:center;background:transparent;color:var(--ink);
 border:1px solid var(--ink);cursor:pointer}
.inputbtn:active{background:var(--press)}
.inputmain{flex:1;height:48px;border-radius:var(--r-sm);background:var(--accent);
 color:var(--on-accent);user-select:none;-webkit-user-select:none;
 -webkit-touch-callout:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center;
 font-size:15px;font-weight:var(--w-mid);cursor:pointer}
.inputmain:active{transform:scale(.98)}
.inputmain.off{background:transparent;border:1px solid var(--ink-faint);
 color:var(--ink-muted);font-size:13px}
@keyframes w{0%,100%{height:9px}50%{height:34px}}
textarea.fldbox{min-height:72px;padding:11px 12px;resize:none;line-height:1.5;
 align-items:flex-start;display:block}

/* ---- 真机 ----------------------------------------------------------------
   桌面上是一台画出来的手机（边框 + 右边的说明栏）；真在手机上打开时那圈边框
   反而挡地方，所以铺满屏幕，并把刘海和 home 条的高度让出来。
   加到主屏幕后 display-mode:standalone 也走这一套。 */
@media (max-width:600px), (display-mode:standalone) {
  body{overflow:hidden;background:var(--ground)}
  .stage{display:block;padding:0;gap:0}
  .side{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .inset{height:env(safe-area-inset-top)}
  /* 稿子里悬浮簇离屏幕底 30 —— 用 max() 而不是加法：加法等于在 home 条上面
     又垫了一层，簇会整个飘起来。别去改胶囊自己的高度，那会把它撑变形。 */
  .dock{bottom:max(30px, env(safe-area-inset-bottom))}
  /* 跟着底栏走：底栏高 66，上面再留 10 */
  .qlog{bottom:calc(76px + max(30px, env(safe-area-inset-bottom)))}
  .toast{bottom:calc(72px + max(30px, env(safe-area-inset-bottom)))}
  .body,.body.hasfab{padding-bottom:calc(118px + max(30px, env(safe-area-inset-bottom)))}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .toast.high{bottom:auto}
}
</style>
</head>
<body>
<div class="stage">
  <div class="side">
    <h1>MARGIN · 可点击原型</h1>
    <p>和线框同一套视觉，但逻辑是真的：决策分数按 <code>finance_core</code>
       的公式算，余额不够真的会被拦，冷静期和攒物计划都是真状态。</p>
    <div class="hint">底部四个 Tab 都能点。财况页的月份可以往前翻，<br/>右下角麦克风试试说一句话。</div>

    <h2>试试这些语音</h2>
    <ol class="ex" id="examples"></ol>

    <h2>时间</h2>
    <p class="clock" id="clock"></p>
    <div class="k">
      <button data-side="fwd" data-h="12">快进 12 小时</button>
      <button data-side="fwd" data-h="48">快进 48 小时</button>
    </div>
    <p class="sub" style="margin-top:8px">冷静期是按时间算的，快进才看得到它走完。</p>

    <h2>重置</h2>
    <div class="k"><button data-side="reset">恢复初始数据</button>
      <button data-side="fresh">以新用户身份打开</button></div>
    <p class="sub" style="margin-top:8px">「新用户」会清空一切，看冷启动引导。</p>
  </div>
  <div class="device"><div class="phone" id="app"></div></div>
</div>
<script>
"use strict";
/* ==========================================================================
   1. 核心算法 —— 与 finance_core 一致。金额一律用「分」存整数，避免浮点漂移。
   ========================================================================== */
/* 金额一律存「最小单位」的整数（分 / cent / penny）。几位小数由币种决定，
   不是常数 100 —— 日元韩元就是 0 位。切换币种只换符号和格式，不做汇率换算：
   这个产品里没有汇率，一个用户就用一种钱。 */
/* 手机上到底跑的是哪一版 —— 没有这个号，只能靠猜。每次发布手动 +1，
   和 sw.js 里的缓存名一起改。「我」那一页最底下显示。 */
const BUILD = "v80";
const CUR = {
  /* 半角 ¥ 不是全角 ￥：拉丁衬线（Caslon 这类）都没有全角那个码位，
     用全角的话币种符号会掉回宋体，和后面的数字明显不是一套字。 */
  CNY: { sym: "¥", dec: 2, loc: "zh-CN" },
  USD: { sym: "$",  dec: 2, loc: "en-US" },
  GBP: { sym: "£",  dec: 2, loc: "en-GB" },
};
const ccy = () => CUR[S.currency] || CUR.CNY;
const unit = () => Math.pow(10, ccy().dec);
/* 稿子里小数一律降一号、压灰 —— 一列数字扫起来只看整数位。
   包一层 span，字号和颜色交给各处的 .dec 规则。 */
const withDec = (str) => str.replace(/([.,]\d{2})$/, '<span class="dec">$1</span>');
/* 统计块那种一行放四个的地方，小数没意义还挤 —— 只给整数 */
const moneyShort = (c) => { const u = ccy();
  return u.sym + Math.round(c / Math.pow(10, u.dec)).toLocaleString(u.loc); };
const money = (c) => { const u = ccy();
  return u.sym + (c / Math.pow(10, u.dec)).toLocaleString(u.loc,
    { minimumFractionDigits: u.dec, maximumFractionDigits: u.dec }); };
const yuan = money;                         // 老名字，调用点太多，留个别名
const neg = (c) => "−" + money(c);
const plus = (c) => "+" + money(c);
const toCents = (v) => Math.round(parseFloat(v || 0) * unit());
/* 固定支出已经吃掉全部收入时的兜底预算。原来写死 ￥1,000 —— 换成英镑就宽松了九倍，
   红灯基本不会亮。按收入的比例算，换哪种钱都成立。 */
/* ---- 语言 -----------------------------------------------------------------
   中文是原稿。英文不是逐句翻译 —— 同一个意思用英文自己的说法重写一遍，
   因为这个产品的价值有一半在语气里，译出来的腔调会把它磨平。

   拼接出来的句子一律做成「带占位符的整句」。碎片拼接（"每月 " + day + " 号"）
   在中文里没问题，换成英文语序就必然拼错，这是国际化最常见的坑。 */
const lang = () => (S && S.lang) || "zh";   // 只在渲染时调用，那时 S 已经初始化
const isEn = () => lang() === "en";
function t(k, v) {
  let out = (STR[lang()] && STR[lang()][k]);
  if (out == null) out = STR.zh[k];
  if (out == null) return k;                 // 缺键就把键名显出来，好发现
  if (typeof out === "function") return out(v || {});
  if (v) for (const p in v) out = out.split("{" + p + "}").join(v[p]);
  return out;
}
const nth = (d) => d + (d % 10 === 1 && d !== 11 ? "st" : d % 10 === 2 && d !== 12 ? "nd"
  : d % 10 === 3 && d !== 13 ? "rd" : "th");
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const plural2 = (n, unit) => n + " " + unit;      // 中文：没有单复数
const MON = ["January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"];
const MON3 = MON.map((x) => x.slice(0, 3));

const STR = {
zh: {
  "tab.money": "财况", "tab.bills": "账单", "tab.wants": "种草", "tab.vault": "金库",
  "nav.me": "我", "nav.sections": "分区", "scope.month": "月", "scope.year": "年",
  "pro.cta": "升级 Pro", "pro.soon": "Pro 还在做，先把这套用顺手",
  "word.back": "返回", "word.addOne": "记一笔",
  "date.month": (v) => v.y + "年" + +v.m + "月",
  "date.monthShort": (v) => +v.m + "月",
  "date.day": (v) => +v.m + "月" + +v.d + "日",
  "date.year": (v) => v.y + " 年",
  "date.onDay": (v) => "每月 " + v.day + " 号",
  "date.md": (v) => v.m + " 月 " + v.d + " 日",
  "word.income": "收入", "word.spending": "支出", "word.savings": "储蓄",
  "word.gap": "缺口", "word.left": "结余",
  "word.fixedIn": "固定收入", "word.fixedOut": "固定支出",
  "word.debt": "还贷", "word.debtLong": "固定还贷", "word.fixedSave": "固定储蓄",
  "word.breakdown": "分类", "word.expand": "展开", "word.collapse": "收起",
  "cat.food": "餐饮", "cat.transport": "交通", "cat.fun": "娱乐",
  "cat.shopping": "购物", "cat.social": "人情往来", "cat.salary": "工资",
  "cat.bills": "账单", "cat.clothes": "服饰", "cat.gym": "健身", "cat.pet": "宠物",
  "cat.other": "其他",

  "yr.empty": (v) => v.y + " 年还没有任何记录。",
  "yr.emptyHint": "只统计你真正记过的月份。",
  "yr.headline": (v) => v.y + " 年" + (v.neg ? "缺口" : "结余"),
  "yr.range": (v) => "从 " + v.from + " 月开始用，统计 " + v.list + "（共 " + v.n +
    " 个月）· 之前的月份不补",
  "yr.timesN": (v) => v.what + " × " + v.n + " 个月",
  "yr.ledgerIn": "记账收入", "yr.ledgerOut": "记账支出", "yr.confirmed": "确认存入的",
  "yr.note": "固定项只乘你开始用之后的月数，之前的不补。",
  "yr.monthly": "每月结余", "yr.noRecord": "没有记录",

function daysToPayday() {
  const d = prof().payday;
  if (!d) return null;
  const iso = today();
  const y = +iso.slice(0, 4), mo = +iso.slice(5, 7), day = +iso.slice(8, 10);
  const dim = new Date(y, mo, 0).getDate();
  const pay = Math.min(d, dim);
  if (day <= pay) return pay - day;
  const nextDim = new Date(y, mo + 1, 0).getDate();
  return (dim - day) + Math.min(d, nextDim);

const EN_RUN = new RegExp("\\b" + EN_WORD + "(?:[\\s-]+" + EN_WORD + ")*\\b", "gi");
/* 反过来做：默认转，只挡住「这是个数量/时间，不是钱」的那些说法。
   原来只在钱字旁边才转，结果「lunch ten taxi nine」一个都认不出来。 */
const EN_NOTMONEY = new RegExp("^\\s*(?:more|other|another|of|o'?clock|percent|" +
  "half|halves|thirds?|quarters?|times?|days?|weeks?|months?|years?|hours?|" +
  "mins?|minutes?|seconds?|nights?|people|persons?|kids?|guys?|stars?)\\b", "i");
function en2num(text) {
  return text.replace(EN_RUN, (run, at) => {
    if (EN_NOTMONEY.test(text.slice(at + run.length))) return run;
    return enRun(run) || run;
  });
}
/* 「三块五」「五毛」这类角分的说法，转成小数 */
function cnCents(text) {
  return text
    /* 「一块五」的「五」孤零零在句尾，cn2num 不敢单独转 —— 到这儿它前面
       已经有「N块」了，意思就明确了 */
    .replace(/(\d+)\s*(?:块钱|元钱|块|元)\s*([一二两三四五六七八九])(?:\s*(?:毛|角))?(?![〇零一二两俩三四五六七八九十百千万亿\d])/g,
      (m, a, b) => a + "." + CN_D[b])
    .replace(/(\d+(?:\.\d+)?)\s*(?:块钱|元钱|块|元)\s*(\d)(?:\s*(?:毛|角))?(?![\d.])/g,
      (m, a, b) => (a.indexOf(".") >= 0 ? m : a + "." + b))
    .replace(/(?<![\d.])(\d)\s*(?:毛|角)(?![\d])/g, "0.$1");

function normalizeSpoken(text) {
  let out = String(text || "")
    .replace(FULLWIDTH, (c) => "0123456789.".charAt("０１２３４５６７８９．".indexOf(c)));
  if (lang() === "en") return en2num(out);
  const m = maskNames(out);
  return unmaskNames(cnCents(cn2num(m.out)), m.kept);
}

/* 用户自己记过的词当纠错表 —— 「罗森」被听成「罗生」这种，只在原句解析
   不出来时才试一次，宁可不改也别改坏。 */
function historyVocab() {
  const n = new Map();
  const bump = (w) => { w = String(w || "").trim();
    if (w.length >= 2 && w.length <= 6 && /^[一-龥]+$/.test(w))
      n.set(w, (n.get(w) || 0) + 1); };
  (S.tx || []).forEach((x) => bump(x.description));
  (S.jars || []).forEach((x) => bump(x.name));
  (S.customCats || []).forEach(bump);
  return [...n].filter(([, c]) => c >= 2).map(([w]) => w);
}
const dist1 = (a, b) => {
  if (a.length !== b.length) return false;
  let d = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i] && ++d > 1) return false;
  return d === 1;
};
function fixByHistory(text) {
  const vocab = historyVocab();
  let out = text;
  vocab.forEach((w) => {
    if (out.indexOf(w) >= 0) return;              /* 本来就对，别动 */
    for (let i = 0; i + w.length <= out.length; i++) {
      const win = out.slice(i, i + w.length);
      if (!/^[一-龥]+$/.test(win) || vocab.indexOf(win) >= 0) continue;
      if (dist1(w, win)) { out = out.slice(0, i) + w + out.slice(i + w.length); break; }
    }
  });
  return out;
}

/* 识别引擎会给好几个候选，别只拿第 [0] 个 —— 让解析器投票：
   哪个能干净地解析出金额就用哪个，平局时才听引擎自己的排序。 */
function scoreCandidate(txt) {
  const p = parseUtterance(txt);
  if (!p) return 0;
  let sc = 2;
  if (p.drafts && p.drafts.length) {
    sc += 2 + p.drafts.length;
    if (p.drafts.every((d) => d.amount > 0)) sc += 2;
  } else if (p.item || p.goal || p.debt || p.move) sc += 2;
  return sc;
}
function pickBest(cands) {
  const list = (cands || []).map((x) => String(x || "").trim()).filter(Boolean);
  if (list.length < 2) return list[0] || "";
  let best = list[0], top = -1;
  list.forEach((txt, i) => {
    const sc = scoreCandidate(txt) - i * 0.1;
    if (sc > top) { top = sc; best = txt; }
  });
  return best;
}

function parseUtterance(text) {
  const raw = normalizeSpoken(text).trim();
  if (!raw) return null;

  if (!has(raw, R().nonLedger) && !isAssetMove(raw)) {
    const drafts = [];
    for (const clause of raw.split(R().clause)) {
      const c = (clause || "").trim();
      if (!c) continue;
      let spans = extractSpans(c);
      if (!spans.length) continue;
      /* 英文里钱几乎总带符号或单位（£10 / 10 pounds），所以一旦有带单位的，
         就只在带单位的地方切 ——「2 coffees 5 pounds」才不会被算成两笔。
         中文口语里常常一个单位都不带，这条不适用。 */
      if (spans.length > 1 && lang() === "en" && spans.some((x) => x.strong))
        spans = spans.filter((x) => x.strong);
      /* 金额直接取这一段自己的，别再回头 extract 一次 —— 挡掉的那些
         （量词、没单位的）会重新混进来 */
      const parts = spans.length > 1 ? splitByAmounts(c, spans)
        : [{ text: c, v: spans[0].v }];
      for (const part of parts) {
        const isIncome = isIncomeText(part.text);
        const cat = classify(part.text, isIncome);
        const emo = grabEmoji(part.text);
        const desc = cleanDesc(part.text, cat, isIncome);
        drafts.push({ type: isIncome ? "in" : "out", amount: part.v, emoji: emo,
          category: cat, date: today(),
          /* emoji 已经当图标了，描述里就别再留一个；
             整条描述只有一个 emoji 的话（「🍜 25」），删完是空的，那就留着 */
          description: emo ? (stripEmoji(desc) || desc) : desc });
      }
    }
    if (drafts.length > 1) return { intent: "multi_ledger", raw, drafts };
    if (drafts.length === 1) return { intent: "ledger", raw, drafts };
  }

  const amts = extractAmounts(raw);
  const amount = amts[0] || 0;

  if (has(raw, R().decision)) {
    let necessity = R().necessity(raw);
    if (necessity != null) necessity = Math.max(1, Math.min(10, necessity));
    else {
      necessity = 5;
      for (const a of amts)
        if (a !== amount && a >= 100 && a <= 1000) { necessity = a / 100; break; }
    }
    const name = R().wantName(raw) || t("parse.someThing");
    return { intent: "decision", raw, item: { name, price: amount,
      necessity, dup: has(raw, R().dup) } };
  }

  if (has(raw, R().plan)) {
    if (has(raw, R().debt)) {
      return { intent: "debt", raw,
        debt: { description: t("parse.debt." + R().debtKind(raw)), monthly: amount } };
    }
    const months = R().months(raw) || 12;
    const name = R().goalName(raw) || t("parse.someGoal");
    return { intent: "goal", raw, goal: { name, target: amount, months } };
  }

  if (has(raw, R().asset) || isAssetMove(raw)) {
    const parts = R().transferParts(raw);
    const from = parts.from ? canonAccount(parts.from) : "";
    const to = parts.to ? canonAccount(parts.to) : "";
    if (from && to) return { intent: "transfer", raw, move: { from, to, amount } };
    return { intent: "deposit", raw,
      move: { to: to || biggestJar(), amount } };
  }

  const isIncome = has(raw, R().income);
  const cat = classify(raw, isIncome);
  return { intent: "ledger", raw, drafts: [{ type: isIncome ? "in" : "out",
    amount, category: cat,
    description: raw.length > 15 ? raw.slice(0, 15) + "…" : raw, date: today() }] };
}

const ic = (n, s = 20, c) => {
  const st = 'flex-shrink:0' + (c ? ";color:" + c : "");
  const f = PF[n];
  /* PF 默认是填充型；第三项写 "stroke" 的那几个走描边，第四项是线宽 */
  if (f && f[2] === "stroke") return '<svg width="' + s + '" height="' + s +
    '" viewBox="' + f[0] + '" fill="none" stroke="currentColor" stroke-width="' +
    (f[3] || 1.5) + '" stroke-linecap="round" stroke-linejoin="round" style="' + st +
    '">' + f[1] + "</svg>";
  if (f) return '<svg width="' + s + '" height="' + s + '" viewBox="' + f[0] +
    '" fill="currentColor" style="' + st + '">' + f[1] + "</svg>";
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 20 20" ' +
    'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" ' +
    'stroke-linejoin="round" style="' + st + '">' + P[n] + "</svg>";
};

/* 月份/年份药丸里的左右箭头。原来在年视图、月视图、分类抽屉里各写了一份，
   尺寸和内边距已经分叉过一次 —— 收成一个，谁都不许再本地定义。
   svg 是行内元素、贴基线排，不套 display:flex 的话会比中间那行字高一两像素。 */
const monthArrow = (dir, on) => '<div class="tapout" ' +
  (on ? 'data-a="month:' + dir + '"' : "") +

      RED_BG = "var(--bad-tint)";

const TONE_C = { green: [GREEN, GREEN_BG], amber: [AMBER, AMBER_BG], red: [RED, RED_BG] };

   于是点新加的那条打开的是老的那条。加载之后必须把 uid 顶到最大值之后。 */
function syncUid(st) {
  let max = 0;
  const scan = (v) => {
    if (!v || typeof v !== "object") return;
    if (Array.isArray(v)) return v.forEach(scan);
    if (typeof v.id === "string" && /^x\d+$/.test(v.id)) max = Math.max(max, +v.id.slice(1));
    Object.keys(v).forEach((k) => scan(v[k]));
  };
  scan(st);
  if (max > uid) uid = max;
}
