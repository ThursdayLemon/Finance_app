<style>
/* ==========================================================================
   Token 层 —— 全站唯一的取色处。换肤和深色模式都只动这一块。
   语义命名，不是「灰1灰2」：以后换一套视觉，对着角色填就行。
   ========================================================================== */
/* ==========================================================================
   Token 层 —— 全站唯一的取色处。17 个：14 个核心 + 3 个派生的淡色。
   和 Figma 的 Color collection 一比一（名字一模一样）。
   少用新颜色，多用透明度：按下态、条槽、色阶都是已有色加 alpha。
   ========================================================================== */
:root{
  /* ======================================================================
     皮肤层。默认 Pearl；Say Briefly 整套留在 [data-skin="briefly"] 里，
     没删 —— 「我」里能一键切回去，将来也能做成正式的主题选项。
     组件只认 token，不认皮肤名字，所以换皮不用动任何页面。
     ====================================================================== */

  /* ---- Pearl：珠光近白 + 一个墨灰 + 绿进红出（按 Figma 2096-1015） ---- */
  --ink:#414140;            /* 正文、图标、主按钮 */
  --ink-muted:#8e8e8c;      /* 说明小字 */
  --ink-faint:#b9b9b6;      /* 占位、禁用 */
  --page:#f2f1ef;           /* 页面底（上面还铺一层珠光） */
  --surface:rgba(255,255,255,.4);    /* 玻璃卡（稿子 40%） */
  --sunken:rgba(255,255,255,.5);     /* 内嵌块、只读框 */
  --field:#ffffff;          /* 输入框 */
  --edge:rgba(255,255,255,.95);      /* 卡片那圈高光边 */
  --line:#ececea;           /* 卡片内部的分隔线 */
  --accent:#414140;
  --on-accent:#ffffff;
  --nav:rgba(255,255,255,.8);
  --on-nav:#414140;
  --mark:#ffffff;           /* Pearl 里没有荧光笔，退化成白 */
  /* 图标底的白圆：40% 白 + 1px 纯白描边，不带投影。顶栏那两颗一样。 */
  --icon-bg:rgba(255,255,255,.4);
  --btn-bg:rgba(255,255,255,.4);
  --icon-edge:#ffffff;
  --accent2:#f3f3f1;        /* 次级按钮底 */
  --on-tint:#414140;
  /* 这一套终于有红有绿了 —— 不用再靠涂层和字号喊话 */
  --good:#38bc37;
  --warn:#d37641;
  --bad:#d37641;            /* 你把 #F44336 改软成了这个 */
  --good-tint:color-mix(in srgb, var(--good) 12%, #ffffff);
  --warn-tint:color-mix(in srgb, var(--warn) 12%, #ffffff);
  --bad-tint:color-mix(in srgb, var(--bad) 10%, #ffffff);
  --press:color-mix(in srgb, var(--ink) 6%, transparent);
  --track:color-mix(in srgb, var(--ink) 10%, transparent);
  --ai-gradient:#414140;
  --r-sm:12px; --r:24px; --r-md:20px; --r-lg:24px; --r-pill:9999px;
  --shadow-fab:0 12px 34px -18px rgba(65,65,64,.45);
  --shadow-pill:none;
  --shadow-nav:0 12px 34px -18px rgba(65,65,64,.45);
  --shadow-card:0 8px 26px -18px rgba(65,65,64,.28);
  --shadow-sheet:0 -8px 30px -18px rgba(65,65,64,.4);
  /* 正文 Onest。两个都从 Google Fonts 来，
     所以手机和电脑上是同一套，不靠本机装没装。 */
  --font:"Onest","PingFang SC","Hiragino Sans GB",
    -apple-system,"Helvetica Neue",Helvetica,sans-serif;
  /* 你把标题、名字、数字都换成了衬线 —— 这是这一版最大的性格 */
  --font-display:"Literata","Songti SC",Georgia,serif;
  /* 数字自己一支：Caslon 的数字比 Literata 的更立得住 */
  --font-num:"Libre Caslon Text","Literata","Songti SC",Georgia,serif;
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --w-body:400; --w-mid:500; --w-bold:600;
  --glass:16px;             /* backdrop-filter 的模糊半径，关掉就填 0px */
  --surface-solid:#f8f7f5;  /* 左滑那一层必须实心，否则底下的红会透上来 */
}

/* ---- Say Briefly：原样留着，切回去就是原来那一版 ---- */
:root[data-skin="briefly"]{
  --ink:#1a3300;
  --ink-muted:color-mix(in srgb, var(--ink) 62%, var(--page));
  --ink-faint:color-mix(in srgb, var(--ink) 34%, var(--page));

  --surface:#fcfaf5;
  --sunken:#f1eee5;

  --line:rgba(182,182,182,.5);
  --accent:#1a3300;
  --on-accent:#fcfaf5;
  --nav:color-mix(in srgb, var(--accent2) 30%, var(--page));
  --on-nav:#1a3300;
  --mark:#ffe95c;
  --icon-bg:rgba(255,255,255,.4);
  --btn-bg:rgba(255,255,255,.4);
  --icon-edge:#ffffff;
  --accent2:#a8e5e5;
  --on-tint:#1a3300;
  --good:#1a3300;
  --warn:#1a3300;
  --bad:#cb5521;
  --good-tint:#d5f5c2;
  --warn-tint:#ffe95c;
  --bad-tint:color-mix(in srgb, var(--bad) 12%, var(--page));
  --press:color-mix(in srgb, var(--ink) 8%, transparent);
  --track:color-mix(in srgb, var(--ink) 14%, transparent);
  --ai-gradient:#1a3300;
  --r-sm:6px; --r:12px; --r-md:12px; --r-lg:16px; --r-pill:9999px;
  --shadow-fab:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-pill:none;
  --shadow-nav:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-card:none;
  --shadow-sheet:0 1px 3px 0 rgba(0,0,0,.12);
  --font:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",
    -apple-system,"Helvetica Neue",Helvetica,sans-serif;

  --font-num:var(--font);
  --font-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --w-body:400; --w-mid:500; --w-bold:600;
  --glass:0px;
  --surface-solid:#fcfaf5;
}

   不是把浅色反过来 —— 纸墨互换之后对比度和判定色都得重新挑。
   三种状态：跟随系统（不带 data-theme）、明确选浅色、明确选深色。 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
  --ink:#ececeb; --ink-muted:#9a9a98; --ink-faint:#6a6a68;

    --mark:rgba(255,255,255,.1); --accent2:rgba(255,255,255,.1); --on-tint:#ececeb;
    --icon-bg:rgba(255,255,255,.1);
    --btn-bg:rgba(255,255,255,.14);
    --icon-edge:rgba(255,255,255,.22);
    --good:#4fd04e; --warn:#e08a58; --bad:#e08a58;
    --good-tint:color-mix(in srgb, var(--good) 16%, transparent);
    --warn-tint:color-mix(in srgb, var(--warn) 16%, transparent);
    --bad-tint:color-mix(in srgb, var(--bad) 14%, transparent);
    --ai-gradient:#ececeb;
    --press:color-mix(in srgb, #ffffff 8%, transparent);
    --track:color-mix(in srgb, #ffffff 14%, transparent);
    --shadow-fab:0 12px 34px -18px rgba(0,0,0,.7);
    --shadow-nav:0 12px 34px -18px rgba(0,0,0,.7);
    --shadow-card:0 8px 26px -18px rgba(0,0,0,.6);
    --shadow-pill:none;
    --shadow-sheet:0 -8px 30px -18px rgba(0,0,0,.7);
    --surface-solid:#2a2a29;
  }
  /* briefly 的深色单独留着 */
  :root[data-skin="briefly"]:not([data-theme="light"]) {
  --ink:#edf3e4; --ink-muted:#9aa88c; --ink-faint:#5f6b54;
    --page:#14180f; --surface:#14180f; --sunken:#1b2016;
    --field:#1b2016; --edge:#3b4633; --line:rgba(237,243,228,.14);

    --warn-tint:color-mix(in srgb, var(--warn) 16%, transparent);
    --bad-tint:color-mix(in srgb, var(--bad) 14%, transparent);
    --ai-gradient:#d5f5c2;
    --press:color-mix(in srgb, var(--ink) 8%, transparent);
    --track:color-mix(in srgb, var(--ink) 14%, transparent);
    --shadow-fab:0 1px 2px 0 rgba(0,0,0,.35);
    --shadow-nav:0 8px 26px 0 rgba(245,221,74,.14),0 1px 2px 0 rgba(0,0,0,.4);
    --shadow-pill:none;
    --shadow-sheet:0 -8px 28px -12px rgba(0,0,0,.6);
    --surface-solid:#14180f;
  }
}

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--ink);line-height:1.5;font-size:14px;
 font-weight:var(--w-body);
 font-family:var(--font);
 -webkit-font-smoothing:antialiased}
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;
 padding:40px 28px 80px;flex-wrap:wrap}
.side{width:300px;padding-top:6px}
.side h1{font-size:22px;font-weight:600;margin:0 0 8px}
.side p{font-size:13px;color:var(--ink);margin:0 0 14px;line-height:1.65}
.side h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-muted);
 margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--ink-faint)}
.side .k{display:flex;flex-wrap:wrap;gap:7px}
.side button{font:inherit;font-size:12px;border:1px solid var(--ink);background:var(--page);
 border-radius:var(--r-pill);padding:6px 12px;cursor:pointer}
.side button:hover{background:var(--ink);color:var(--page)}
.side .hint{font-family:"Caveat",cursive;font-size:16px;color:var(--ink-muted);background:var(--sunken);
 border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 11px;line-height:1.35}
.side .ex{font-size:12px;color:var(--ink);line-height:1.9;margin:0;padding-left:16px}
.side .clock{font-variant-numeric:lining-nums tabular-nums;font-size:12px;color:var(--ink-muted);margin:8px 0 0}

  0%   {transform:translate3d(-1.5%,-1%,0) scale(1.04) rotate(.25deg)}

/* 系统里关了动效就别动 */
@media (prefers-reduced-motion: reduce){ .phone::before{animation:none} }
:root[data-skin="briefly"] .phone::before{display:none}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .phone::before{display:none}
}
:root[data-theme="dark"] .phone::before{display:none}
.phone > *{position:relative;z-index:1}
.phone{width:390px;height:844px;border:1px solid var(--edge);border-radius:34px;
 background:var(--page);
 overflow:hidden;display:flex;flex-direction:column;position:relative;flex-shrink:0;
 box-shadow:var(--shadow-sheet)}
.inset{height:40px;flex-shrink:0}
/* 标题脱离了文档流（见 .navt），所以剩下的两边要靠 space-between 撑开，
   否则右边那堆（合计 / 进度条 / 清单）会缩到返回键旁边去。 */
.nav{min-height:50px;display:flex;align-items:center;justify-content:space-between;
 gap:8px;padding:0 12px;flex-shrink:0;border-bottom:1px solid var(--line)}
/* 左右两栏等宽，中间那栏才是真居中 —— 头像 38、月/年 70，
   靠 flex 的话日期会被挤偏；1fr auto 1fr 不管两边多宽都对称。 */
.nav.split{display:grid;grid-template-columns:1fr auto 1fr}
.nav.split > :first-child{justify-self:start}
.nav.split > :last-child{justify-self:end}
/* 标题绝对居中：靠 flex 的话，左边返回键和右边那堆东西宽度不一样，
   标题就会偏（量出来最多偏了 36px）。脱离文档流钉在正中最稳，
   pointer-events:none 保证它不会挡住两边的按钮。 */
.nav{position:relative}
.navt{font-family:var(--font-display);font-size:20px;font-weight:var(--w-body);
 color:var(--ink);letter-spacing:-.01em;
 position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 顶栏里的字标（首页）本来就是居中的，别被上面那条带跑 */
.nav.split .navt{position:static;left:auto;right:auto}
:root[data-skin="briefly"] .navt{font-family:var(--font);font-weight:700}
.body{flex:1;padding:14px 16px 148px;display:flex;flex-direction:column;gap:12px;
 overflow-y:auto;overflow-x:hidden}
/* flex 列里子项默认会被压扁去适配容器（.sw 带 overflow:hidden 会直接塌成一条缝）—— 
   一律不许收缩，超出就滚动 */
.body > *{flex-shrink:0}
/* 悬浮按钮浮在正文之上（bottom:78 + 56 高 = 盖住标签栏往上 72px），
   所以有它的页面要把这块高度垫出来，不然年视图这种长页面最后一张卡会被压住 */
/* 底栏浮在正文上面，占掉 30(离底) + 62(高) = 92。滚到底时再留 56 的余量，
   最后一行不会贴着底栏的投影。年视图和账单页原来就差这一口。 */
.body.hasfab{padding-bottom:148px}
/* 底部不再是通栏，是一簇悬浮的东西：一条玻璃药丸，内容从底下滑过去 */
.dock{position:absolute;left:20px;right:20px;bottom:30px;z-index:4;
 display:flex;align-items:center;gap:8px;background:var(--nav);
 border:1px solid var(--edge);border-radius:var(--r-pill);padding:8px;
 box-shadow:var(--shadow-nav);backdrop-filter:blur(calc(var(--glass) + 4px))}
/* ---- 底栏三（四）颗：说一句 · 点阵 · [返回] · 记一笔 ---------------------- */
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;
 border-radius:var(--r-pill);font-size:14.5px;font-weight:var(--w-mid);
 letter-spacing:-.015em;background:rgba(236,236,236,.2);color:var(--ink);cursor:pointer;
 border:1px solid var(--icon-edge);min-width:0;white-space:nowrap;overflow:hidden}
.act.dark{background:var(--accent);color:var(--on-accent)}
.act:active{transform:scale(.97)}
/* 默认是黑的（底栏正露着四个分区）；点一下换出动作键，它才变成白底 */
.gridb{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;
 align-items:center;justify-content:center;background:var(--accent);
 color:var(--on-accent);border:1px solid var(--icon-edge);
 cursor:pointer;touch-action:none}
.gridb.open{background:rgba(232,232,232,.2);color:var(--ink)}
/* 展开时，两颗药丸里各坐两个分区。按样机：药丸和收起时的 .act 同底，
   药丸里是 44 的圆形热区，当前分区实色、其余压到 50%。 */
.navpill{flex:1;min-width:0;height:46px;border-radius:var(--r-pill);
 background:rgba(236,236,236,.2);border:1px solid var(--icon-edge);
 display:flex;align-items:center;justify-content:space-around}
.navb{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;
 align-items:center;justify-content:center;color:var(--ink);opacity:.5;cursor:pointer}
.navb.on{opacity:1}
.navb:active{transform:scale(.92)}
/* 收起时如果这一页没有语音键，左边留一颗同宽的空药丸，点阵才不会跑偏 */
.act.ghost{background:transparent;pointer-events:none}

/* ---- 热区 ----------------------------------------------------------------
   小图标按钮视觉上就该小，但手指不认视觉。用一个透明的伪元素把可点区域
   往外撑到 44（Apple HIG 的下限），版式一点不动。
   撑多大要看邻居有多近：并排的按钮只能撑到「中心距」，撑过头会互相抢点击。 */
.tapout{position:relative}
.tapout::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:max(100%,44px);height:max(100%,44px)}
/* 并排三颗，中心距 40 —— 只撑到 40，正好挨着不重叠 */
.rnd::after{width:max(100%,40px);height:max(100%,40px)}
/* 只把高度撑够：左右挨着别的东西时，横向再撑就会抢到邻居头上 */
.taph{position:relative}
.taph::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
 height:max(100%,44px)}
.avatar,.iconbtn,.rnd,.eye,.mochip [data-a]{position:relative}
.avatar::after,.iconbtn::after,.rnd::after,.eye::after,.mochip [data-a]::after{
 content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:max(100%,44px);height:max(100%,44px)}
.rnd::after{width:max(100%,40px);height:max(100%,40px)}
/* 成排的那些只撑高度 */
.seg>span,.chip[data-a],.toggle,.asmini,.fmenu div{position:relative}
.seg>span::after,.chip[data-a]::after,.toggle::after,.asmini::after,.fmenu div::after{
 content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
 height:max(100%,44px)}
/* 会换行的那一排 chip：自己 34 高、行距 10，热区撑到 44 正好挨着不重叠 */
.chip[data-a]{min-height:34px}
/* Pearl：白玻璃 + 一圈高光边 + 很软的投影。briefly：跟页面底同色、靠描边分层。 */
.card{border:1px solid var(--edge);border-radius:var(--r);background:var(--surface);
 padding:18px;box-shadow:var(--shadow-card);backdrop-filter:blur(var(--glass))}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--page)}
.lbl,.sub{font-size:12px;color:var(--ink-muted)}
/* ---- 排版 ------------------------------------------------------------------
   字号/行高/字距抄自 Figma（Pearl · Home / Pearl · Analytics）。
   三套字各管一摊：
     Literata Regular  —— 标题和条目名（--font-display，一律 400）
     Libre Caslon Text —— 所有数字和金额（--font-num）
     Onest             —— 界面字：标签、元信息、按钮文字、坐标轴
   不要再凭手感改这些值。 */
.serif,.rowname,.cardtitle,.wordmark,.secttl,.tn b{font-family:var(--font-display);
 font-weight:var(--w-body)}
/* 数字统一走 --font-num。只声明字族 —— 字号和字距各处自己写，别在这儿一起设，
   不然会盖掉后面那些按稿子量出来的值。
   数字一律要 lnum + tnum：等高、等宽，金额列才对得齐。
   （Literata 本来就是等高数字，没有 lnum 这个 feature，写上也无害；
   换成旧式数字的衬线 —— Bona Nova 那种 —— 时它就是救命的那一条。） */
.big,.money,.num,.tileval,.ta b,.callout{font-family:var(--font-num);
 font-variant-numeric:lining-nums tabular-nums}
/* 字标 COACH：17/22，字距 +3.7px */
.wordmark{font-size:17px;letter-spacing:3.7px;line-height:22px;
 text-align:center;color:var(--ink)}
/* 卡片标题 Total income / Committed：14/18 */
.cardtitle{font-size:14px;line-height:18px;color:var(--ink)}
/* 分区标题 Transactions：17/22 */
.secttl{font-size:17px;line-height:22px;letter-spacing:-.34px;color:var(--ink)}
/* 条目名：15/20 */
.rowname,.tn b{font-size:15px;line-height:20px;letter-spacing:-.22px;color:var(--ink)}
/* 界面字一律 Onest。这几处以前跟着正文走，会被衬线带跑。 */
.hlbl,.dhead,.tn > span,.ta > span,.act,.mochip > span,.sparkl span,.chartax span{
 font-family:var(--font)}
.hlbl{margin:16px 0 2px;font-size:14px;font-weight:var(--w-body);line-height:20px;
 color:var(--ink-muted)}
.dhead{font-size:12.5px;line-height:16px;color:var(--ink-muted);margin:6px 0 2px}
/* 奶油纸不用衬线 —— 它的性格在 Bricolage + 荧光笔上，衬线一律退回正文字体 */
:root[data-skin="briefly"] .serif,:root[data-skin="briefly"] .rowname,
:root[data-skin="briefly"] .cardtitle,:root[data-skin="briefly"] .wordmark,
:root[data-skin="briefly"] .secttl,:root[data-skin="briefly"] .tn b{
 font-family:var(--font)}
/* 眉标做成黄色徽章（稿子 2080-1013）—— 荧光黄在这套系统里就是「做记号」 */
.badge{display:inline-flex;align-items:center;align-self:flex-start;
 background:var(--mark);color:var(--ink-muted);border-radius:var(--r-pill);
 padding:3px 12px;font-size:12px;line-height:18px;white-space:nowrap;
 border:1px solid var(--edge)}
/* 不能连 .ol 一起清掉 —— 它的优先级(0,3,0)比 .badge.ol(0,2,0) 高，
   写成 :not(.ol) 才不会把描边徽章也抹平 */
:root[data-skin="briefly"] .badge:not(.ol){color:var(--ink);border:0;
 border-radius:var(--r-sm);padding:2px 8px}
:root[data-skin="briefly"] .badge.ol{color:var(--ink);border-radius:var(--r-sm);
 padding:2px 8px}
.badge.ol{border:1px solid var(--ink)}
/* 面板里的内嵌信息块：改成薄荷底，不再靠分隔线分区 */
.block{background:var(--sunken);border-radius:var(--r-md);padding:8px 12px}
/* ---- 首页（按样机 2096-1015）---------------------------------------- */
.hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.mochip{display:inline-flex;align-items:center;gap:2px;background:var(--icon-bg);
 border:1px solid var(--icon-edge);border-radius:var(--r-pill);padding:2px 6px;
 backdrop-filter:blur(8px)}
.mochip>span{font-size:12.5px;font-weight:var(--w-mid);line-height:16px;
 min-width:78px;text-align:center}
.heroamt{display:flex;align-items:center;gap:8px}
/* 主数字：42/46，字距 −1.47px；小数同号但压灰 */
.heroamt .big{font-size:42px;line-height:46px;letter-spacing:-1.47px}
.heroamt .big .dec{color:var(--ink-faint)}
/* 分析页那两个大数：小数降到 26；支出那个整串同色 */
.heroamt.an .big .dec{font-size:26px}
.heroamt .big.neg{color:var(--bad)}
.heroamt .big.neg .dec{color:inherit}
.heroamt .eye{color:var(--ink-muted);cursor:pointer;padding:4px;display:flex}
/* 星号挂在大写高度上，直接替数字会飘在顶上 —— 缩一档再压下来 */
.mask{display:inline-block;font-size:.6em;letter-spacing:.12em;transform:translateY(-.06em)}
/* 稿子里 Body 的间距是拿空 frame 摆出来的：余额→两张卡 22，
   两张卡→账本 6 —— 跟两张卡之间那道缝一样宽。
   .body 自己有 12 的 gap，所以这两块各自补差值。 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.gcard{padding:16px;display:flex;flex-direction:column;cursor:pointer}
.figure{flex:1;display:flex;flex-direction:column;align-items:center;
 justify-content:center;padding:6px 0 10px}
/* 卡内那个数：19/24，小数降到 13 并压灰 */
.figure .money{font-size:19px;font-weight:var(--w-body);line-height:24px;
 letter-spacing:-.48px}
.figure .money .dec{font-size:13px;color:var(--ink-faint)}
.figure .sub{font-size:11.5px;line-height:15px}
.spark{display:flex;align-items:flex-end;gap:6px;height:50px}
.spark>i{flex:1;border-radius:1px;
 background:repeating-linear-gradient(90deg,var(--ink-faint) 0 1px,transparent 1px 4px)}
.spark>i.on{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 4px)}
.sparkl{display:flex;gap:6px;margin-top:6px}
.sparkl>span{flex:1;text-align:center;font-size:9px;line-height:12px;
 color:var(--ink-faint);letter-spacing:-.2px}
.sparkl>span.on{color:var(--ink);font-weight:var(--w-mid)}
/* 分析页的镜像柱状图：收入朝上、支出朝下，中间那行是月份 */
.chart{padding:18px 0 6px;position:relative}
.chartrow{display:flex;gap:6px;height:78px;align-items:flex-end}
.chartrow + .chartax + .chartrow{align-items:flex-start}
.chartrow>i{flex:1;border-radius:1px;
 background:repeating-linear-gradient(90deg,var(--ink-faint) 0 1px,transparent 1px 4px)}
.chartrow>i.on{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 4px)}
.chartrow>i.bad{background:repeating-linear-gradient(90deg,var(--bad) 0 1px,transparent 1px 4px)}
.chartax{display:flex;gap:6px;padding:9px 0}
.chartax>span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-faint)}
.chartax>span.on{color:var(--ink);font-weight:var(--w-bold)}
.callout{text-align:right;font-size:12px;font-weight:var(--w-body);line-height:16px;
 color:var(--ink);height:16px}
.callout.bot{color:var(--bad);padding-top:6px}
/* 稿子：标题 →(12)→ 网格，两行之间 12，一行里两个之间 8，图标 36。
   align-content 不能用 center —— 那样标题到图标的距离会随卡片高度变。 */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px;flex:1;
 align-content:start;margin-top:12px}
.quick .circ{width:36px;height:36px}
.qi{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
/* 小块：数字 12.5/16，标签 Onest 10/13 */
.tileval{font-size:12.5px;font-weight:var(--w-body);line-height:16px;
 letter-spacing:-.19px;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.tilelbl{font-family:var(--font);font-size:10px;line-height:13px;color:var(--ink-muted)}
/* 统一的白圆底：分类图标、快捷入口、行图标都用它。
   按稿子：40% 白 + 1px 纯白描边，不带投影 —— 玻璃卡上再叠投影会糊成一团。 */
.circ{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;
 align-items:center;justify-content:center;background:var(--icon-bg);
 border:1px solid var(--icon-edge);color:var(--ink)}
:root[data-skin="briefly"] .block{background:var(--good-tint);border-radius:var(--r-sm);
 padding:6px 10px}
/* 日期、笔数这类元数据用等宽 —— 系统里 mono 就是「工具信息」的标记 */
.meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
/* 分区标题，跟 .secttl 同一档（稿子里的 Transactions 就是这个） */
.h2{font-family:var(--font-display);font-size:17px;font-weight:var(--w-body);
 line-height:22px;color:var(--ink);letter-spacing:-.34px}
:root[data-skin="briefly"] .h2{font-family:var(--font);font-weight:700}
.big{font-family:var(--font-num);font-size:42px;font-weight:var(--w-body);
 line-height:1.15;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.03em}
:root[data-skin="briefly"] .big{font-size:40px;font-weight:800;letter-spacing:.03em;
 line-height:1.1}
/* 涂层是 briefly 的招牌 —— Pearl 里有红有绿，不需要它 */
:root:not([data-skin="briefly"]) .big.mark{background:none;padding:0;margin-left:0;
 color:inherit}
:root:not([data-skin="briefly"]) .big.mark:not(.pos){color:var(--bad)}
/* 荧光笔那一道 —— 这套系统里数字的重音靠它，不靠红色 */
/* 缺口罩荧光黄、结余罩薄荷绿 —— 两种都是「做记号」，颜色区分方向 */
.big.mark{color:var(--on-tint);
 background:linear-gradient(var(--mark),var(--mark)) 0 64%/100% 62% no-repeat;
 padding:0 6px;margin-left:-6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* 结余罩薄荷蓝 —— 缺口黄、结余蓝，方向一眼看得出 */
.big.mark.pos{background-image:linear-gradient(var(--accent2),var(--accent2))}
.num{font-family:var(--font-num);font-size:17px;font-weight:var(--w-body);
 font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}
:root[data-skin="briefly"] .num{font-family:var(--font);font-weight:var(--w-bold)}
/* 负字距只给数字，压中文会让字挤在一起 */
.money{font-variant-numeric:lining-nums tabular-nums;font-weight:var(--w-body);
 letter-spacing:-.02em}
:root[data-skin="briefly"] .money,:root[data-skin="briefly"] .tileval,
:root[data-skin="briefly"] .ta b,:root[data-skin="briefly"] .callout{
 font-family:var(--font);font-weight:var(--w-bold)}
/* 这条 800 + 正字距是奶油纸（Bricolage）那一套。以前没限定皮肤，
   Pearl 的衬线也跟着被拉到 800 —— 只请求 400 的字重时浏览器会伪粗。 */
:root[data-skin="briefly"] .big.money{font-weight:800;letter-spacing:.03em}
.row{min-height:48px;display:flex;align-items:center;gap:8px;padding:12px 0;
 border-bottom:1px solid var(--line)}
.card .row:last-child{border-bottom:0}
.chip{border:1px solid var(--edge);border-radius:var(--r-pill);padding:4px 11px;
 font-size:11px;background:rgba(255,255,255,.6);color:var(--ink);
 display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}
:root[data-skin="briefly"] .chip{border-color:var(--ink);background:transparent;
 font-family:var(--font-mono)}
:root[data-skin="briefly"] .mbtn{border-color:var(--ink);background:var(--surface);
 border-radius:var(--r-sm)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-accent);
 font-weight:var(--w-mid);box-shadow:var(--shadow-pill)}
.chip.flat{cursor:default}
/* 自定义分类就是普通标签，只是右边多一个 ×；「新建」是同一个壳子，描边改虚线 */
.chip.newcat{border-style:dashed;border-color:var(--ink-faint);color:var(--ink-muted)}
.chip .tag-x{margin:-4px -8px -4px -1px;padding:4px 8px;display:inline-flex;align-items:center;
 color:var(--ink-faint)}
.chip .tag-x:active{color:var(--ink)}
.mbtn{min-height:50px;border:1px solid var(--edge);background:var(--icon-bg);
 border-radius:var(--r-pill);display:flex;align-items:center;
 justify-content:center;gap:7px;font-size:15px;font-weight:500;background:var(--surface);padding:0 14px;
 cursor:pointer;text-align:center;color:var(--ink)}
.mbtn:active{transform:translateY(1px)}
.mbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
 font-weight:var(--w-bold);box-shadow:var(--shadow-pill)}
.mbtn.off{color:var(--ink-faint);border-color:var(--ink-faint);background:transparent;cursor:not-allowed}
.mbtn.sm{min-height:44px;font-size:13px}
.barh{height:8px;background:var(--track);border-radius:var(--r-pill);overflow:hidden}
.barh>i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.banner{border:1px solid;border-radius:var(--r-md);padding:12px 14px;font-size:13px;
 display:flex;gap:9px;
 align-items:flex-start;line-height:1.45}
.banner.tap{cursor:pointer}
.dash{border:1px dashed var(--ink-faint);border-radius:var(--r-sm);
 background:var(--surface);min-height:54px;
 display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink-muted);font-size:14px;
 cursor:pointer}
.dash:active{background:var(--press)}
.fld{display:flex;flex-direction:column;gap:5px}
.fldbox,input.fldbox,select.fldbox{min-height:48px;border:1px solid var(--edge);
 background:var(--icon-bg);border-radius:var(--r-md);display:flex;align-items:center;padding:0 12px;font-size:15px;gap:8px;
 font-family:inherit;color:inherit;width:100%}
input.fldbox,select.fldbox{-webkit-appearance:none;appearance:none}
input.fldbox:focus,select.fldbox:focus{outline:none;border-color:var(--ink);border-width:1.5px}
select.fldbox{cursor:pointer;background-image:linear-gradient(45deg,transparent 49%,var(--ink-muted) 51%),
 linear-gradient(135deg,var(--ink-muted) 49%,transparent 51%);
 background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;
 background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.fldbox.err{border-color:var(--bad);border-width:1.5px}
.errline{display:flex;gap:7px;font-size:13px;color:var(--bad);align-items:flex-start}
.seg{display:flex;border:1px solid var(--edge);border-radius:var(--r-pill);overflow:hidden;
 background:var(--icon-bg);padding:3px;font-weight:var(--w-mid)}
.seg>span{border-radius:var(--r-pill)}
:root[data-skin="briefly"] .seg{border-color:var(--ink);background:transparent;
 padding:0;border-radius:var(--r-sm)}
:root[data-skin="briefly"] .seg>span{border-radius:0}
.seg>span{flex:1;padding:11px 0;text-align:center;font-size:14px;cursor:pointer;color:var(--ink)}
.seg>span.on{background:var(--ink);color:var(--on-accent);font-weight:var(--w-mid)}
/* 轨道 4px 是视觉；外面套一层 44 高的透明盒子当热区 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;
 background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:var(--r-pill);
 background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
 border-radius:50%;background:var(--page);border:1.5px solid var(--ink);cursor:pointer;
 margin-top:-9px}
.toggle{width:44px;height:26px;border-radius:var(--r-pill);border:1px solid var(--edge);
 background:transparent;
 position:relative;flex-shrink:0;cursor:pointer;transition:background .2s}
.toggle>i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
 background:var(--edge);transition:left .2s,background .2s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on>i{left:21px;background:var(--page)}
/* 左滑删除：红底垫在下面，内容层往左推 */
/* 红底放在删除面板上，不要放在容器上 —— 容器铺红色会在行与行之间透出红缝 */
/* 跟着里面卡片的圆角裁 —— 否则四个圆角处会透出底下的红色删除面板 */
/* 外壳裹卡片时要和卡片一样圆（否则四角露出底下那层红）；
   裹通栏行时必须是直角 —— 行的文字从最左边起，圆角会把首字啃掉。 */
/* flex + flex:1：让删除层和内容层高度严格一致。以前两层各自量高，
   碰上小数行高时底下会漏出一条 1px 的删除色。 */
.sw{position:relative;overflow:hidden;border-radius:0;display:flex;flex-direction:column}
.sw.boxed{border-radius:var(--r)}
/* 自己也圆一下：不然它的直角顶在卡片圆角的抗锯齿边上，会透出一条红发丝 */
.sw-del{position:absolute;top:0;right:0;bottom:0;width:76px;color:#fff;
 border-radius:inherit;display:flex;
 align-items:center;justify-content:center;cursor:pointer;background:var(--bad)}
/* 跟外壳一样圆：卡片圆角外那一圈才不会露出底下的红 */
.sw-body{position:relative;flex:1 0 auto;background:var(--page);border-radius:inherit;
 transition:transform .18s ease;touch-action:pan-y}
/* 长按拿起来排序：不加把手，不改版式 —— 点还是进详情，左滑还是删除 */
.srt{transition:transform .16s ease}
.srt.lift{position:relative;z-index:6;transition:none;
 box-shadow:0 4px 14px -6px rgba(26,51,0,.4);border-radius:var(--r)}
.srt.lift .sw-body,.srt.lift.card{background:var(--page)}
.dragging{touch-action:none;user-select:none}
/* 行一律不刷底 —— 刷了就把底下的珠光挡死，而且和玻璃卡永远对不齐。
   删除层平时不画，滑起来才露；见 .sw.sliding。 */
.card .sw-body,.listcard .sw-body,.daycard .sw-body{background:transparent}
.card .sw-del,.listcard .sw-del,.daycard .sw-del{opacity:0;transition:opacity .1s ease}
.card .sw.sliding .sw-del,.card .sw.open .sw-del,
.listcard .sw.sliding .sw-del,.listcard .sw.open .sw-del,
.daycard .sw.sliding .sw-del,.daycard .sw.open .sw-del{opacity:1}
.sw.open .sw-body{transform:translateX(-76px)}
.dim{position:absolute;inset:0;background:rgba(34,32,28,.36)}
.dim.anim{animation:fade .18s ease}
/* --kb 是软键盘顶上来的高度（见 visualViewport 那一段）。键盘弹出来的时候
   抽屉整个上移，不然底下的按钮会被键盘盖住，人还滑不下去。 */
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);background:var(--page);
 border-top:0;border-radius:var(--r-lg) var(--r-lg) 0 0;
 padding:10px 16px max(12px, calc(20px - var(--kb,0px)));
 display:flex;flex-direction:column;gap:11px;
 max-height:calc(88% - var(--kb,0px));overflow-y:auto;
 overscroll-behavior:contain;touch-action:pan-y}
.sheet.anim{animation:up .24s cubic-bezier(.2,.8,.3,1)}
/* 往下拖的时候跟手；松手要么弹回去、要么滑下去关掉 */
.sheet.drag{transition:none}
.sheet.snap{transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.dim.fading{transition:opacity .2s ease;opacity:0}
.grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--ink-faint);align-self:center;
 margin-bottom:5px;flex-shrink:0}
.toast.high{bottom:auto;top:52px}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);
 color:var(--on-accent);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;
 animation:up .2s ease;z-index:5}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 概览卡底下那四个统计块 */
.tiles{display:flex;gap:6px;margin-top:8px;background:var(--sunken);
 border-radius:var(--r-md)}
:root[data-skin="briefly"] .tiles{border-radius:var(--r-sm)}
.tile{flex:1;min-width:0;padding:10px 4px;border-radius:var(--r);text-align:center;
 cursor:pointer}
.tile:active{background:var(--press)}
.tile .money{font-size:15px;white-space:nowrap}
/* 三个字以上的标签在 4 等分里会撑破 —— 让它换行，块高由内容决定 */
.tile .sub{line-height:1.25}
/* 一天一张卡，左边一条竖杠 */
/* 列表一律装进白卡 —— 光着摆在底色上会散 */
.listcard{background:var(--surface);border:1px solid var(--edge);
 border-radius:var(--r);padding:4px 16px;box-shadow:var(--shadow-card);
 backdrop-filter:blur(var(--glass))}
.listcard .sw:not(:last-child) .row{border-bottom:1px solid var(--line)}
.listcard .sw:last-child .row{border-bottom:0}
/* ---- 账本：按样机收进一张玻璃卡 ------------------------------------------
   卡头是「标题 · 放大镜 · 漏斗 · 饼图 · 全部」，下面按天分段。 */
.txcard{position:relative;margin-top:-6px;padding:16px 16px 6px}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.thead .secttl{flex:1}
.rnd{width:36px;height:36px;border-radius:50%;background:var(--icon-bg);display:flex;
 align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;cursor:pointer;
 border:1px solid var(--icon-edge)}
.rnd.on{background:var(--accent);color:var(--on-accent)}
/* 漏斗菜单挂在按钮下面，不占默认状态的地方 */
.fmenu{position:absolute;right:16px;top:52px;z-index:5;background:var(--field);
 border-radius:var(--r-md);padding:6px;min-width:132px;border:1px solid var(--edge);
 box-shadow:var(--shadow-sheet),0 12px 30px -14px rgba(65,65,64,.5)}
.fmenu div{padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:var(--w-mid);
 letter-spacing:-.01em;cursor:pointer;color:var(--ink)}
.fmenu div.on{background:var(--accent);color:var(--on-accent)}
/* 搜索条：点放大镜才滑出来 */
.sbar{overflow:hidden;max-height:0;transition:max-height .2s ease,margin .2s ease}
.sbar.on{max-height:56px;margin-bottom:6px}
.sbar input{width:100%;height:44px;border:1px solid var(--icon-edge);
 border-radius:var(--r-pill);background:var(--icon-bg);padding:0 16px;font:var(--w-body) 14px var(--font);
 color:var(--ink);outline:none;letter-spacing:-.01em}
.sbar input::placeholder{color:var(--ink-faint)}
.tr{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:62px}
.tn{flex:1;min-width:0}
.tn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn > span{display:block;font-size:11.5px;line-height:15px;color:var(--ink-muted);

 color:var(--on-accent);user-select:none;-webkit-user-select:none;
 -webkit-touch-callout:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center;

textarea.fldbox{min-height:72px;padding:11px 12px;resize:none;line-height:1.5;

/* ---- 真机 ----------------------------------------------------------------
   桌面上是一台画出来的手机（边框 + 右边的说明栏）；真在手机上打开时那圈边框
   反而挡地方，所以铺满屏幕，并把刘海和 home 条的高度让出来。
   加到主屏幕后 display-mode:standalone 也走这一套。 */
@media (max-width:600px), (display-mode:standalone) {
  body{overflow:hidden}
  .stage{display:block;padding:0;gap:0}
  .side{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .inset{height:env(safe-area-inset-top)}
  /* 稿子里悬浮簇离屏幕底 30 —— 用 max() 而不是加法：加法等于在 home 条上面
     又垫了一层，簇会整个飘起来。别去改胶囊自己的高度，那会把它撑变形。 */
  .dock{bottom:max(30px, env(safe-area-inset-bottom))}
  .toast{bottom:calc(72px + max(30px, env(safe-area-inset-bottom)))}
  .body,.body.hasfab{padding-bottom:calc(118px + max(30px, env(safe-area-inset-bottom)))}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .toast.high{bottom:auto}
}

<div class="stage">

       的公式算，余额不够真的会被拦，冷静期和攒物计划都是真状态。</p>
    <div class="hint">底部四个 Tab 都能点。财况页的月份可以往前翻，<br/>右下角麦克风试试说一句话。</div>

    <h2>试试这些语音</h2>

    <h2>时间</h2>

      <button data-side="fwd" data-h="12">快进 12 小时</button>
      <button data-side="fwd" data-h="48">快进 48 小时</button>
    </div>
    <p class="sub" style="margin-top:8px">冷静期是按时间算的，快进才看得到它走完。</p>

    <h2>重置</h2>
    <div class="k"><button data-side="reset">恢复初始数据</button>
      <button data-side="fresh">以新用户身份打开</button></div>
    <p class="sub" style="margin-top:8px">「新用户」会清空一切，看冷启动引导。</p>
  </div>
  <div class="device"><div class="phone" id="app"></div></div>
</div>
<script>
"use strict";
/* ==========================================================================
   1. 核心算法 —— 与 finance_core 一致。金额一律用「分」存整数，避免浮点漂移。
   ========================================================================== */
/* 金额一律存「最小单位」的整数（分 / cent / penny）。几位小数由币种决定，
   不是常数 100 —— 日元韩元就是 0 位。切换币种只换符号和格式，不做汇率换算：
   这个产品里没有汇率，一个用户就用一种钱。 */
/* 手机上到底跑的是哪一版 —— 没有这个号，只能靠猜。每次发布手动 +1，
   和 sw.js 里的缓存名一起改。「我」那一页最底下显示。 */
const BUILD = "v21";
const CUR = {
  /* 半角 ¥ 不是全角 ￥：拉丁衬线（Literata / Caslon 这类）都没有全角那个码位，
     用全角的话币种符号会掉回宋体，和后面的数字明显不是一套字。 */
  CNY: { sym: "¥", dec: 2, loc: "zh-CN" },
  USD: { sym: "$",  dec: 2, loc: "en-US" },
  GBP: { sym: "£",  dec: 2, loc: "en-GB" },
};
const ccy = () => CUR[S.currency] || CUR.CNY;
const unit = () => Math.pow(10, ccy().dec);
/* 稿子里小数一律降一号、压灰 —— 一列数字扫起来只看整数位。
   包一层 span，字号和颜色交给各处的 .dec 规则。 */
const withDec = (str) => str.replace(/([.,]\d{2})$/, '<span class="dec">$1</span>');
/* 统计块那种一行放四个的地方，小数没意义还挤 —— 只给整数 */
const moneyShort = (c) => { const u = ccy();
  return u.sym + Math.round(c / Math.pow(10, u.dec)).toLocaleString(u.loc); };
const money = (c) => { const u = ccy();
  return u.sym + (c / Math.pow(10, u.dec)).toLocaleString(u.loc,
    { minimumFractionDigits: u.dec, maximumFractionDigits: u.dec }); };
const yuan = money;                         // 老名字，调用点太多，留个别名
const neg = (c) => "−" + money(c);
const plus = (c) => "+" + money(c);
const toCents = (v) => Math.round(parseFloat(v || 0) * unit());
/* 固定支出已经吃掉全部收入时的兜底预算。原来写死 ￥1,000 —— 换成英镑就宽松了九倍，
   红灯基本不会亮。按收入的比例算，换哪种钱都成立。 */
/* ---- 语言 -----------------------------------------------------------------
   中文是原稿。英文不是逐句翻译 —— 同一个意思用英文自己的说法重写一遍，
   因为这个产品的价值有一半在语气里，译出来的腔调会把它磨平。

   拼接出来的句子一律做成「带占位符的整句」。碎片拼接（"每月 " + day + " 号"）
   在中文里没问题，换成英文语序就必然拼错，这是国际化最常见的坑。 */
const lang = () => (S && S.lang) || "zh";   // 只在渲染时调用，那时 S 已经初始化
const isEn = () => lang() === "en";

  let out = (STR[lang()] && STR[lang()][k]);
  if (out == null) out = STR.zh[k];
  if (out == null) return k;                 // 缺键就把键名显出来，好发现
  if (typeof out === "function") return out(v || {});
  if (v) for (const p in v) out = out.split("{" + p + "}").join(v[p]);

const FLOOR_RATIO = 0.05;
const floorBudget = (income) => Math.max(0, Math.round(income * FLOOR_RATIO));

function evaluatePurchase(price, budget, necessity, saveMode, dup) {
  const base = necessity * 10;
  const ratio = budget > 0 ? (price / budget) * 100 : 100;
  const incomePenalty = ratio * (saveMode ? 4 : 1.5);
  const modePenalty = saveMode ? 10 : 0;
  const dupPenalty = dup ? (saveMode ? 40 : 15) * Math.min(1, ratio / 1) : 0;
  const score = Math.max(0, Math.min(100,
    base - incomePenalty - dupPenalty - modePenalty));
  const r1 = (n) => Math.round(n * 10) / 10;
  return {
    score: r1(score), base: r1(base), ratio: Math.round(ratio * 100) / 100,
    incomePenalty: r1(incomePenalty), dupPenalty: r1(dupPenalty),
    modePenalty: r1(modePenalty), saveMode, dup,
    verdict: score >= 75 ? "green" : score >= 45 ? "amber" : "red",
  };
}
const goalMonthly = (g) =>
  g.months > 0 ? Math.round(Math.max(0, g.target - g.saved) / g.months) : 0;
const goalPct = (g) =>
  g.target > 0 ? Math.max(0, Math.min(100, (g.saved / g.target) * 100)) : 100;
const debtCommit = (s) => s.debts.reduce((a, d) => a + d.monthly, 0);
const goalCommit = (s) => s.goals.reduce((a, g) => a + goalMonthly(g), 0);
/* 固定收入 / 固定支出（含还贷）—— 每个月都算，不需要记进账本 */
const fixedIn = (s) => s.fixedIn.reduce((a, x) => a + x.amount, 0);
const fixedOut = (s) => s.fixedOut.reduce((a, x) => a + x.amount, 0) + debtCommit(s);
const committed = (s) => fixedOut(s) + goalCommit(s);
const netAssets = (s) => s.accounts.reduce((a, j) => a + j.balance, 0);
/* 攒钱不是支出，是结余的去处 —— 所以只统计「这个月划走了多少」，不进支出 */
/* 只扣「已经确认发生」的：自动的到日子自动记，手动的要你点过「这月已存」。
   没兑现的那部分只提示「还需存」，不扣 —— 扣了就是把还没走的钱当走了。 */
const savedIn = (m) => S.goals.reduce((a, g) => a + ((g.marks[m] || {}).amt || 0), 0);
const stillToSave = (s2) => Math.max(0, goalCommit(s2) - savedIn(thisMonth()));
/* 首页开场那个数。就是月度结余那一个数，换了个说法叫「可用余额」：
     这个月进来的 − 这个月出去的（固定 + 还贷 + 账本）− 已经存走的
   = 结完这个月的账，账户里还能支配的钱。
   记一笔收入它就得涨，记一笔花销它就得掉 —— 所以用 incomeIn / outgoIn，
   不能用 budgetFor（那个只看固定收入，账本里的进账进不去，数字会不动）。
   储蓄只扣「已经确认存走的」：没兑现的那部分钱还在账户里，是能支配的，
   只在分析页提示「本月还需存」。 */
const availableIn = (m) => incomeIn(S, m) - outgoIn(S, m) - savedIn(m);

/* 一个账户里有多少钱已经被目标预留 */
const lifePct = () => S.lifeGoal && S.lifeGoal.target > 0
  ? Math.min(100, (netAssets(S) / S.lifeGoal.target) * 100) : 0;
const earmarkOn = (name) => S.goals.filter((g) => g.account === name)
  .reduce((a, g) => a + g.saved, 0);
/* 这个月这个目标存了没：自动的按日子算，手动的看用户答过没 */
/* marks[月份] = {k:"done"|"skip"|"auto", amt} —— amt 记下当时加了多少，
   撤销才退得回原值（按当下的「每月必存」倒扣会差一截） */
const goalMark = (g) => (g.marks[thisMonth()] || {}).k || "pending";
/* 还贷的月度状态。和储蓄用同一套 marks，但意义不同：
   储蓄是「要不要算」（没确认就不扣），还贷是「别忘了」（该付就是该付，照算）。 */
const debtMark = (d) => (d.marks && d.marks[thisMonth()] || {}).k || "pending";
const debtTotal = (d) => d.monthly * (d.months || 0);
const debtPaid = (d) => Object.values(d.marks || {}).reduce((a, x) => a + (x.amt || 0), 0);
const debtOverdue = (d) => d.marks && !d.marks[thisMonth()] &&
  +today().slice(8) > d.day && !d.auto;
/* 可用预算分三档，每一档都要说清自己是哪一档 —— 原来一律用 ￥1,000 兜底，
   结果一个计划定得过猛的人，买什么都是红灯，测验就废了。
   真正的问题不是「这笔消费不合理」，是「你的计划本身塞不进收入」。 */
function budgetInfo(s) {
  const income = fixedIn(s), bills = fixedOut(s), save = goalCommit(s);
  const full = income - bills - save;
  if (full > 0) return { amount: full, tier: "ok" };
  const noSave = income - bills;
  if (noSave > 0) return { amount: noSave, tier: "planTooBig", income, bills, save };
  return { amount: floorBudget(income), tier: "billsTooBig", income, bills };
}
const budgetFor = (s) => budgetInfo(s).amount;
const inMonth = (iso, ref) => iso.slice(0, 7) === ref.slice(0, 7);
const monthLabel = (iso) => { const [y, m] = (iso || today()).split("-");
  return t("date.month", { y, m }); };
const dayLabel = (iso) => { const [, m, d] = iso.split("-"); return t("date.day", { m, d }); };
const monthOf = (iso) => iso.slice(0, 7);
const thisMonth = () => monthOf(today());
/* 正在看的月份（可以翻） */
const viewMonth = () => ui.month || thisMonth();
const isYear = () => ui.scope === "year";
const viewYear = () => viewMonth().slice(0, 4);
const isThisMonth = () => viewMonth() === thisMonth();
const shiftMonth = (m, n) => { const [y, mo] = m.split("-").map(Number);
  const d = new Date(Date.UTC(y, mo - 1 + n, 1));

const SAVE_KEY = "savingcoach.v1";
const SCHEMA = 1;
/* 以后每改一次数据结构：SCHEMA 加一，并在这里补一个把 n 变成 n+1 的函数。
   例：MIGRATIONS[1] = (d) => { d.accounts.forEach(a => a.currency = d.currency); }; */
const MIGRATIONS = {};

let saveTimer = null, saveBroken = false;
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    try {
      localStorage.setItem(SAVE_KEY,
        JSON.stringify({ v: SCHEMA, savedAt: Date.now(), data: S }));
      saveBroken = false;
    } catch (err) {
      /* 无痕模式、存储写满、被系统清了 —— 记账这个动作不能因此崩掉，
         但要让人知道这次没存下，否则他以为存了 */
      if (!saveBroken) { saveBroken = true; toast(t("k.saveFailed")); }
    }
  }, 300);

let stashN = 0;
function stash(raw, why) {                 // 读不懂的原样留一份，绝不覆盖
  /* 只用毫秒当后缀不够：同一毫秒里存两份，第二份会把第一份盖掉 */
  try { localStorage.setItem(SAVE_KEY + ".broken." + Date.now() + "-" + ++stashN,
    JSON.stringify({ why, raw })); } catch (err) { /* 存不下也只能算了 */ }
}
function load() {
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (err) { return null; }
  if (!raw) return null;
  let box;
  try { box = JSON.parse(raw); } catch (err) { stash(raw, "parse"); return null; }
  const v = box && box.v, d = box && box.data;
  if (!d || typeof v !== "number") { stash(raw, "shape"); return null; }
  if (v > SCHEMA) { stash(raw, "newer"); return null; }   // 老代码遇到新数据：不动它
  let cur = v;
  while (cur < SCHEMA) {
    const step = MIGRATIONS[cur];
    if (!step) { stash(raw, "no-migration-" + cur); return null; }
    try { step(d); } catch (err) { stash(raw, "migration-" + cur); return null; }
    cur++;
  }
  return d;
}

const swipe = (inner, delAct, sort) => '<div class="sw' + (sort ? " srt" : "") +
  (/^\s*<div class="card/.test(inner) ? " boxed" : "") + '"' +
  (sort ? ' data-sg="' + sort[0] + '" data-si="' + esc(String(sort[1])) + '"' : "") +
  '><div class="sw-del" data-a="' + delAct +
  '">' + ic("trash", 19) + '</div><div class="sw-body">' + inner + "</div></div>";
const listrow = (mid, right, sub, act) =>
  '<div class="row"' + (act ? ' data-a="' + act + '" style="cursor:pointer"' : "") + ">" +
  '<div style="flex:1;min-width:0"><div style="font-size:15px">' + mid + "</div>" +
  (sub ? '<div class="sub" style="font-size:11px">' + sub + "</div>" : "") + "</div>" +
  '<div class="money" style="font-size:15px">' + right + "</div>" +
  (act ? '<span style="color:var(--ink-faint)">' + ic("chev", 15) + "</span>" : "") + "</div>";

/* ==========================================================================
   4. 各个页面
   ========================================================================== */
/* 账单页装固定支出 + 固定还贷。名字放这里，改一处就换掉。 */
const BILLS = () => t("tab.bills");

/* 账本并进了财况 —— 一份数据不该有两个 Tab */
const TABS = () => [["navMoney", t("tab.money"), "dashboard"], ["navBills", BILLS(), "route"],
  ["navWants", t("tab.wants"), "decisions"], ["navVault", t("tab.vault"), "jars"]];
const TAB_OF = { wishlist: "decisions", verdict: "decisions", wishItem: "decisions" };

const SCREENS = {};

SCREENS.dashboard = () => (isYear() ? yearView() : monthView());

/* 放进 nav 左侧那块空位，正文就少一整行 */
/* 顶栏右上角那一颗。只有首页（月/年概览）是月/年切换；
   进了任何别的页面，它都变成返回 —— 一个位置只教一次。 */
/* render() 认不出来的 key 会退回首页去画 —— 判「在不在首页」得跟着那个口径，
   不然会在首页上画出一个返回箭头。 */
const atHome = () => { const k = screen(); return k === "dashboard" || !SCREENS[k]; };
/* 顶栏右上角：只有首页（月/年概览）有月/年切换，别的页面那儿空着。 */
const navRight = () => atHome() ? scopeToggle() : "";
/* 返回挪到左边，和页名并排 —— 不带白底，就是一个箭头。
   「我在哪一页」和「怎么回去」挨在一起，比一左一右分两头好读。 */
const navBack = () => atHome() ? ""
  : '<div class="navback tapout" data-a="back" title="' + esc(t("word.back")) + '">' +
    ic("back", 20) + "</div>";
const scopeToggle = () => '<div class="seg" style="border-width:1px;border-radius:999px;' +
  'overflow:hidden;flex:none">' +
  [[t("scope.month"), "month"], [t("scope.year"), "year"]].map(([l, v]) =>
    '<span class="' + ((ui.scope || "month") === v ? "on" : "") + '" data-a="scope:' + v +
    '" style="padding:4px 15px;font-size:12px;flex:none">' + l + "</span>").join("") + "</div>";

function yearView() {
  const y = viewYear(), act = activeMonths(y), shown = shownMonths(y);
  const inc = sumOver(act, (m) => incomeIn(S, m));
  const out = sumOver(act, (m) => outgoIn(S, m));
  const saved = sumOver(act, savedIn);
  const net = inc - out - saved;
  const n = act.length;
  const fixInc = fixedIn(S) * n;
  const fixOut = S.fixedOut.reduce((a, x) => a + x.amount, 0) * n;
  const debtOut = debtCommit(S) * n;
  const txIn = sumOver(act, (m) => earnedIn(S, m));
  const txOut = sumOver(act, (m) => spentIn(S, m));
  const label = (name, v) => '<div style="display:flex;align-items:baseline;gap:9px;' +
    'padding:6px 0;border-bottom:1px dotted var(--line)">' +
    '<div class="sub" style="flex:1">' + name + "</div>" +
    '<div class="money" style="font-size:14px">' + yuan(v) + "</div></div>";
  /* display:flex 不能省 —— svg 是行内元素，默认贴基线排，底下会多出一截
     降部的空隙，箭头就比中间那行字高出一两像素。 */
  const arrow = (dir, on) => '<div class="tapout" ' + (on ? 'data-a="month:' + dir + '"' : "") +
    ' style="padding:6px;display:flex;align-items:center;justify-content:center;cursor:' +
    (on ? "pointer" : "default") + ";color:" +
    (on ? "var(--ink)" : "var(--ink-faint)") + '">' + ic(dir === "prev" ? "back" : "chev", 17) + "</div>";
  const monthNames = act.map((x) => t("date.monthShort", { m: x.slice(5) }));
  const sep = isEn() ? ", " : "、";
  return { tab: "dashboard", fab: "both", navSplit: true,
    /* 顶栏跟月视图一模一样：头像 · 字标 · 月/年。
       年份的前后翻和月份一样，挪进正文顶上那颗药丸里 —— 两个口径长一个样。 */
    nav: '<div class="avatar" data-a="settings" title="' + esc(t("nav.me")) + '">' +
      ic("user", 18) + "</div>" +
      '<div class="wordmark" style="flex:1">' + t("app.wordmark") + "</div>" +
      navRight(),
    body:
      '<div class="hero" style="padding-bottom:6px">' +
      '<div class="mochip">' + arrow("prev", true) +
      "<span>" + t("date.year", { y }) + "</span>" +
      arrow("next", +y < +thisMonth().slice(0, 4)) + "</div></div>" +
      (n === 0
        ? '<div class="dash" style="min-height:150px;cursor:default;flex-direction:column;' +
          'gap:6px;padding:0 26px;text-align:center">' + t("yr.empty", { y }) + "<br/>" +
          t("yr.emptyHint") + "</div>"
        : '<div class="card">' +
          '<div class="badge">' + t("yr.headline", { y, neg: net < 0 }) + "</div>" +
          '<div class="big mark' + (net < 0 ? "" : " pos") + '" style="margin:2px 0">' +
          (net < 0 ? neg(-net) : plus(net)) + "</div>" +
          '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:2px">' +
          '<div class="sub">' + t("word.income") +
          ' <span class="money" style="color:var(--ink)">' + yuan(inc) + "</span></div>" +
          '<div class="sub">− ' + t("word.spending") +
          ' <span class="money" style="color:var(--ink)">' + yuan(out) + "</span></div>" +
          (saved ? '<div class="sub">− ' + t("word.savings") +
            ' <span class="money" style="color:var(--ink)">' + yuan(saved) + "</span></div>"
            : "") + "</div>" +
          '<div class="sub" style="font-size:11px;margin-top:8px;padding-top:7px;' +
          'border-top:1px solid var(--line)">' + t("yr.range", {
            from: firstMonth().slice(5),
            list: monthNames.length <= 4 ? monthNames.join(sep)
              : monthNames[0] + " – " + monthNames[monthNames.length - 1], n }) +
          "</div></div>" +

          '<div class="card">' +
          '<div class="h2" style="margin-bottom:4px">' + t("word.income") + " " +
          '<span class="money sub">' + yuan(inc) + "</span></div>" +
          label(t("yr.timesN", { what: t("word.fixedIn"), n }), fixInc) +
          label(t("yr.ledgerIn"), txIn) +
          '<div class="h2" style="margin:12px 0 4px">' + t("word.spending") + " " +
          '<span class="money sub">' + yuan(out) + "</span></div>" +
          label(t("yr.timesN", { what: t("word.fixedOut"), n }), fixOut) +
          label(t("yr.timesN", { what: t("word.debt"), n }), debtOut) +
          label(t("yr.ledgerOut"), txOut) +
          '<div class="h2" style="margin:12px 0 4px">' + t("word.savings") + " " +
          '<span class="money sub">' + yuan(saved) + "</span></div>" +
          label(t("yr.confirmed"), saved) +
          '<div class="sub" style="font-size:11px;margin-top:8px">' + t("yr.note") +
          "</div></div>" +

          '<div style="display:flex;align-items:center;gap:9px;margin-top:2px">' +
          '<div class="h2" style="flex:1">' + t("yr.monthly") + "</div>" +
          '<div class="sub tapout" data-a="cats" style="cursor:pointer;color:var(--accent)">' +
          t("word.breakdown") + ic("chev", 13) + "</div></div>" +
          shown.map((mm) => {
            const has = hasRecords(mm);
            const v = has ? incomeIn(S, mm) - outgoIn(S, mm) - savedIn(mm) : 0;
            const max = Math.max(1, ...shown.filter(hasRecords)
              .map((x) => Math.abs(incomeIn(S, x) - outgoIn(S, x) - savedIn(x))));
            return '<div class="row" data-a="toMonth:' + mm + '" style="cursor:pointer;' +
              (has ? "" : "opacity:.45;") + 'min-height:48px">' +
              '<div class="sub" style="width:38px">' +
              t("date.monthShort", { m: mm.slice(5) }) + "</div>" +
              '<div style="flex:1">' + (has ? bar((Math.abs(v) / max) * 100,
                v < 0 ? RED : "var(--ink)") : bar(0)) + "</div>" +
              '<div class="money" style="font-size:14px;width:92px;text-align:right;color:' +
              (has ? (v < 0 ? RED : "var(--ink)") : "var(--ink-faint)") + '">' +
              (has ? (v < 0 ? neg(-v) : plus(v)) : t("yr.noRecord")) + "</div></div>";
          }).join("")) };
}

/* 手动的储蓄和还贷要人每月点一次，人一定会忘 —— 过了日子还没答就在财况页上催。
   自动项不会出现在这里。 */
function pendingConfirms() {
  const d = +today().slice(8), out = [];
  S.goals.forEach((g) => { if (!g.auto && goalMark(g) === "pending" && d >= g.day)
    out.push({ kind: "goal", id: g.id, name: g.name, amount: goalMonthly(g), day: g.day }); });
  S.debts.forEach((x) => { if (!x.auto && debtMark(x) === "pending" && d >= x.day)
    out.push({ kind: "debt", id: x.id, name: x.description, amount: x.monthly, day: x.day }); });
  return out;
}
function confirmCard() {
  const list = pendingConfirms();
  if (!list.length) return "";
  return '<div class="card" style="border-color:' + AMBER + ";background:" + AMBER_BG + '">' +
    '<div style="display:flex;align-items:baseline;gap:9px">' +
    '<span style="color:' + AMBER + '">' + ic("warn", 15) + "</span>" +
    '<div class="h2" style="flex:1;font-size:14px">' +
    t("cf.title", { n: list.length }) + "</div></div>" +
    '<div class="sub" style="font-size:11px;margin:2px 0 4px">' + t("cf.hint") + "</div>" +
    list.map((x) => '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;' +
      'border-top:1px solid rgba(0,0,0,.06)">' +
      '<div style="flex:1;min-width:0"><div style="font-size:14px">' + esc(x.name) + "</div>" +
      '<div class="sub" style="font-size:11px">' + t("date.onDay", { day: x.day }) +
      " · " + yuan(x.amount) + "</div></div>" +
      '<div class="mbtn sm" data-a="' + (x.kind === "goal" ? "goalDone:" : "debtDone:") + x.id +
      '" style="min-height:34px;padding:0 12px">' +
      t(x.kind === "goal" ? "cf.saved" : "cf.paid") + "</div>" +
      '<div class="mbtn sm" data-a="' + (x.kind === "goal" ? "goalSkip:" : "debtSkip:") + x.id +
      '" style="min-height:34px;padding:0 12px">' + t("cf.no") +
      "</div></div>").join("") + "</div>";
}

/* 进来之后按需补：缺什么列什么，点一下直接去加，看烦了能关掉 */
function setupCard() {
  if (ui.setupDismissed) return "";
  const miss = [];
  const cap = (x) => isEn() ? x.charAt(0).toUpperCase() + x.slice(1) : x;
  if (!S.fixedOut.length)
    miss.push([cap(t("word.fixedOut")), t("su.outSub"), "route:out"]);
  if (!S.debts.length) miss.push([cap(t("word.debtLong")), t("su.debtSub"), "route:debt"]);
  if (!S.goals.length) miss.push([cap(t("word.fixedSave")), t("su.saveSub"), "toSavings2"]);
  if (!miss.length) return "";
  return '<div class="card" style="border-style:dashed">' +
    '<div style="display:flex;align-items:baseline;gap:9px">' +
    '<div class="h2" style="flex:1">' + t("su.title") + "</div>" +
    '<div class="sub" data-a="dismissSetup" style="cursor:pointer">' + t("su.later") +
    "</div></div>" +
    '<div class="sub" style="font-size:11.5px;line-height:15px;margin:2px 0 6px">' +
    t("su.hint") + "</div>" +
    miss.map((x) => '<div class="row" data-a="' + x[2] + '" style="cursor:pointer;' +
      'min-height:44px"><div style="flex:1"><div class="rowname">' + x[0] + "</div>" +
      '<div class="sub" style="font-size:11.5px;line-height:15px">' + x[1] + "</div></div>" +
      '<span style="color:var(--ink-faint)">' + ic("chev", 15) + "</span></div>").join("") + "</div>";
}

/* 分析页：收入在轴上、支出在轴下，当月挑出来。
   月度那几个数（三段减法、存多了的提示、还需存多少）从首页搬到了这儿 ——
   首页开场讲「你有多少」，要看这个月过得怎么样，点左边那张卡进来。 */
SCREENS.analytics = () => {
  const m = viewMonth(), cur = isThisMonth();
  const inc = incomeIn(S, m), out = outgoIn(S, m), saved = savedIn(m);
  const net = inc - out - saved;
  const need = cur ? stillToSave(S) : 0;
  const months = [];
  let [y, mo] = m.split("-").map(Number);
  for (let i = 5; i >= 0; i--) {
    let yy = y, mm = mo - i;
    while (mm <= 0) { mm += 12; yy--; }
    months.push(yy + "-" + String(mm).padStart(2, "0"));
  }
  const ins = months.map((k) => incomeIn(S, k));
  const outs = months.map((k) => outgoIn(S, k) + savedIn(k));
  const top = Math.max.apply(null, ins.concat(outs, [1]));
  const bars = (vals, sel) => '<div class="chartrow">' + vals.map((v, i) =>
    '<i style="height:' + Math.max(3, Math.round(v / top * 100)) + '%"' +
    (months[i] === m ? ' class="' + sel + '"' : "") + "></i>").join("") + "</div>";
  return { tab: "dashboard", fab: "both",
    nav: navBack() + '<div class="navt" style="flex:1">' + t("an.title") + "</div>",
    body:
      '<div class="hero" style="padding-top:2px">' +
      '<div class="mochip"><span>' + monthName(m) + "</span></div>" +
      '<div class="hlbl">' + t("an.income") + "</div>" +
      '<div class="heroamt an"><span class="big">' + withDec(yuan(inc)) +
      "</span></div></div>" +

      '<div class="chart">' +
      '<div class="callout">' + yuan(inc) + "</div>" +
      bars(ins, "on") +
      '<div class="chartax">' + months.map((k) =>
        '<span' + (k === m ? ' class="on"' : "") + ">" +
        t("date.monthShort", { m: k.slice(5) }) + "</span>").join("") + "</div>" +
      bars(outs, "bad") +
      '<div class="callout bot">' + neg(out + saved) + "</div></div>" +

      '<div class="hero" style="padding-top:14px">' +
      '<div class="hlbl">' + t("an.expenses") + "</div>" +
      '<div class="heroamt an"><span class="big neg">' +
      withDec(yuan(out + saved)) + "</span></div></div>" +

      /* 月度那三段减法和教练的话，从首页搬到这儿 */
      '<div class="card" style="margin-top:22px">' +
      '<div class="badge">' + t("mo.headline", { m: m.slice(5), neg: net < 0 }) + "</div>" +
      '<div class="big' + (net < 0 ? " mark" : " mark pos") +
      '" style="margin:6px 0;font-size:30px">' +
      (net < 0 ? neg(-net) : plus(net)) + "</div>" +
      '<div class="block" style="display:flex;flex-wrap:wrap;gap:4px 14px">' +
      '<div class="sub">' + t("word.income") +
      ' <span class="money" style="color:var(--ink)">' + yuan(inc) + "</span></div>" +
      '<div class="sub">− ' + t("word.spending") +
      ' <span class="money" style="color:var(--ink)">' + yuan(out) + "</span></div>" +
      (saved ? '<div class="sub">− ' + t("word.savings") +
        ' <span class="money" style="color:var(--ink)">' + yuan(saved) + "</span></div>"
        : "") + "</div>" +
      (net < 0 ? '<div style="display:flex;gap:6px;font-size:12px;margin-top:10px;' +
        'color:var(--ink)"><span style="margin-top:1px">' + ic("warn", 13) + "</span>" +
        "<div>" + t("mo.overSaved") + "</div></div>" : "") +
      (need > 0 ? '<div class="sub" style="font-size:12px;margin-top:8px">' +
        t("mo.stillToSave", { amt: '<span class="money">' + yuan(need) + "</span>" }) +
        "</div>" : "") +
      "</div>" };
};

/* 近六个月的收入走势。柱子是一束细线 —— 样机里那个质感全在这儿。 */
function sparkline(cur) {
  const months = [];
  let [y, mo] = cur.split("-").map(Number);
  for (let i = 5; i >= 0; i--) {
    let yy = y, mm = mo - i;
    while (mm <= 0) { mm += 12; yy--; }
    months.push(yy + "-" + String(mm).padStart(2, "0"));
  }
  const vals = months.map((mk) => incomeIn(S, mk));
  const top = Math.max.apply(null, vals.concat([1]));
  return '<div class="spark">' + months.map((mk, i) =>
    '<i style="height:' + Math.max(6, Math.round(vals[i] / top * 100)) + '%"' +
    (mk === cur ? ' class="on"' : "") + "></i>").join("") + "</div>" +
    '<div class="sparkl">' + months.map((mk, i) =>
      '<span' + (mk === cur ? ' class="on"' : "") + ">" +
      t("date.monthShort", { m: mk.slice(5) }) + "</span>").join("") + "</div>";
}

function monthView() {
  const m = viewMonth(), cur = isThisMonth();
  const inc = incomeIn(S, m), out = outgoIn(S, m), avail = availableIn(m);
  /* display:flex 不能省 —— svg 是行内元素，默认贴基线排，底下会多出一截
     降部的空隙，箭头就比中间那行字高出一两像素。 */
  const arrow = (dir, on) => '<div class="tapout" ' + (on ? 'data-a="month:' + dir + '"' : "") +
    ' style="padding:6px;display:flex;align-items:center;justify-content:center;cursor:' +
    (on ? "pointer" : "default") + ";color:" +
    (on ? "var(--ink)" : "var(--ink-faint)") + '">' + ic(dir === "prev" ? "back" : "chev", 17) + "</div>";
  return { tab: "dashboard", fab: "both", navSplit: true,
    /* 顶栏按样机：头像 · 字标 · 月/年。月份的前后翻挪到下面那颗药丸里了。 */
    nav: '<div class="avatar" data-a="settings" title="' + esc(t("nav.me")) + '">' +
      ic("user", 18) + "</div>" +
      '<div class="wordmark" style="flex:1">' + t("app.wordmark") + "</div>" +
      navRight(),
    body:
      /* 按样机：月份药丸 → 可用余额 → 两张卡。月度的收支对比整个搬到
         「分析」页去了（点左边那张卡进去），首页开场是「你有多少」。 */
      '<div class="hero">' +
      '<div class="mochip">' + arrow("prev", true) +
      '<span>' + monthName(m) + "</span>" + arrow("next", !cur) + "</div>" +
      '<div class="hlbl">' + t("mo.available") + "</div>" +
      '<div class="heroamt">' +
      (ui.hideBal ? '<span class="big">' + ccy().sym +
        '<span class="mask">******</span></span>'
        : '<span class="big">' + withDec(avail < 0 ? neg(-avail) : yuan(avail)) +
          "</span>") +
      '<span class="eye" data-a="hideBal">' + ic(ui.hideBal ? "eyeOff" : "eye", 17) +
      "</span></div></div>" +

      /* 左：本月收入 + 近六个月走势，点进去是分析页。右：四项固定承诺。 */
      '<div class="duo">' +
      '<div class="card gcard" data-a="analytics">' +
      '<div class="cardtitle">' + t("mo.totalIn") + "</div>" +
      '<div class="figure"><div class="money">' + withDec(yuan(inc)) + "</div>" +
      '<div class="sub">' + t("mo.thisMonth") + "</div></div>" +
      sparkline(m) + "</div>" +
      '<div class="card gcard">' +
      '<div class="cardtitle">' + t("mo.committed") + "</div>" +
      '<div class="quick">' +
      /* 标签按稿子：Income · Savings · Bills · Debt，不是页面上那些长名字 */
      [[t("tile.income"), fixedIn(S), "settings", "arrowUp"],
       [t("tile.savings"), goalCommit(S), "toSavings2", "arrowDown"],
       [t("tile.bills"), S.fixedOut.reduce((a, x) => a + x.amount, 0), "route:out", "bill"],
       [t("tile.debt"), debtCommit(S), "route:debt", "card"]].map(([l, v, a, g]) =>
        '<div class="qi" data-a="' + a + '"><div class="circ">' + ic(g, 18) + "</div>" +
        '<div class="tileval">' + moneyShort(v) + "</div>" +
        '<div class="tilelbl">' + esc(l) + "</div></div>").join("") +
      "</div></div></div>" +

      (cur ? confirmCard() + setupCard() : "") +
      txCard(m, out) };
};

/* 账本按样机收成一张玻璃卡：卡头是 标题 · 搜索 · 筛选 · 分类，下面按天分段。
   没有「全部」——稿子里没有，列表本来就全在这儿。
   搜索和筛选只改列表那一块，不重绘整页 —— 否则输入框的光标每敲一个字就没了。 */
function txCard(m, out) {
  /* 未来的固定收支收拢成一行 —— 否则几条灰色「预计」会压在真实花销上面 */
  const future = S.tx.filter((x) => monthOf(x.date) === m)
    .concat(fixedRowsFor(m), transferRowsFor(m))

/* 一笔属于「进」还是「出」。转存两头都不算，筛「进」「出」时都不出现。 */
const txDir = (x) => x.xfer ? "move" : (x.fixed === "in" || x.type === "in") ? "in" : "out";
/* 分类 → 图标。样机里每一行都是白圆底上压一个线描图形。 */
const TX_GLYPH = { food: "food", transport: "car", fun: "outing", shopping: "shopping",
  social: "ticket", salary: "arrowUp", other: "tag" };
/* 自定义分类也得有个像样的图标 —— 按名字里的词猜一个，猜不到才退回标签。
   中英文都列，因为分类名是用户自己打的。 */
const CAT_WORDS = [
  [/超市|杂货|买菜|生鲜|grocer|market/i, "grocery"],
  [/游戏|手游|steam|game/i, "game"],
  [/机票|航班|飞|出差|旅行|flight|travel/i, "flight"],
  [/电影|演出|门票|票|演唱|ticket|movie|show/i, "ticket"],
  [/打车|地铁|公交|加油|停车|车|taxi|transport|fuel|park/i, "car"],
  [/吃|饭|餐|外卖|咖啡|奶茶|food|lunch|dinner|coffee/i, "food"],
  [/购物|衣|鞋|包|shop|cloth/i, "shopping"],
  [/玩|娱乐|旅游|露营|outing|fun|leisure/i, "outing"],
];
const catGlyph = (c) => TX_GLYPH[c] ||
  (CAT_WORDS.find(([re]) => re.test(c || "")) || [, "tag"])[1];
const txGlyph = (x) => x.xfer ? "navVault" : x.fixed === "in" ? "arrowUp"
  : x.fixed === "out" ? "bill" : catGlyph(x.category);

/* 先筛：搜索词 + 进/出 + 要不要带上还没发生的固定项。按日期倒序。 */
function txFiltered(m) {
  const isFuture = (x) => (x.fixed || x.xfer) && m === thisMonth() && x.date > today();
  const q = (ui.txq || "").trim().toLowerCase();
  const f = ui.txF || "all";
  let list = S.tx.filter((x) => monthOf(x.date) === m)
    .concat(fixedRowsFor(m), transferRowsFor(m));
  if (!ui.showFuture) list = list.filter((x) => !isFuture(x));
  if (f !== "all") list = list.filter((x) => txDir(x) === f);
  if (q) list = list.filter((x) => ((x.description || x.name || "") + " " +
    catLabel(x.category || "") + " " + x.date).toLowerCase().includes(q));
  list.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return { list, isFuture };
}
/* 卡片正文：截断 + 按天分段。搜索框打字只重画这一段，整页不动。 */
function txRows(m) {
  const { list: shown, isFuture } = txFiltered(m);
  const q = (ui.txq || "").trim(), f = ui.txF || "all";
  if (!shown.length) return '<div class="txempty">' +
    (q || f !== "all" ? t("tx.noMatch") : isThisMonth() ? t("mo.emptyNow")
      : t("mo.emptyPast", { month: monthName(m) })) + "</div>";
  let day = null, html = "";
  shown.forEach((x) => {
    if (x.date !== day) { day = x.date;
      html += '<div class="dhead">' + dayLabel(day) + "</div>"; }
    html += (x.fixed || x.xfer) ? txRow(x, isFuture(x))
      : swipe(txRow(x, false), "delTx:" + x.id);
  });
  return html;
}
/* 搜一个字重画一次整页的话，输入框的光标每次都会丢 —— 只换列表那一块。 */
function paintTxList() {
  const box = app.querySelector("#txlist");
  if (!box) return;
  box.innerHTML = txRows(viewMonth());
}

function txRow(x, future) {
  const name = x.description || x.name || "";
  const dir = txDir(x);
  const amt = dir === "move" ? "→ " + yuan(x.amount)
    : dir === "in" ? plus(x.amount) : neg(x.amount);
  const sub = x.xfer
    ? t("px.transfer") + " · " + (future ? t("px.expected") : t("px.savingNotSpend"))
    : x.fixed ? (future ? t("px.expected") : t("px.fixed"))
    : catLabel(x.category);
  const amtHtml = withDec(amt);
  return '<div class="tr" data-a="' + (x.tap || "editTx:" + x.id) + '" style="cursor:pointer' +
    (future ? ";opacity:.62" : "") + '">' +
    '<div class="circ">' + ic(txGlyph(x), 19) + "</div>" +
    '<div class="tn"><b>' + esc(name) + "</b><span>" + esc(sub) + "</span></div>" +
    '<div class="ta"><b>' + amtHtml + "</b>" +
    '<span class="' + dir + '">' +
    t(dir === "in" ? "tx.in" : dir === "move" ? "word.savings" : "tx.out") +
    "</span></div></div>";
}

/* --- 结果页的几块，测验后和清单详情共用 ------------------------------- */
function liveVerdict(it) {
  const b = budgetFor(S);
  return { r: evaluatePurchase(Math.max(1, it.price), b, it.necessity, S.saveMode, !!it.dup), b };
}
const makeSnap = (it) => { const { r, b } = liveVerdict(it);
  return { score: r.score, verdict: r.verdict, budget: b, saveMode: S.saveMode,
    at: now().getTime() }; };
const lampOf = (v) => TONE(v)[2].split(" · ")[0];

function scoreCard(r, corner) {
  const [tone, bg, label] = TONE(r.verdict);
  return '<div class="card" style="border-color:' + tone + ";background:" + bg + '">' +
    '<div style="display:flex;align-items:center;gap:9px">' +
    '<span class="dot" style="background:' + tone + '"></span>' +
    '<div class="h2" style="flex:1">' + label + "</div>" +
    '<div class="big" style="font-size:27px">' + r.score.toFixed(1) + "</div>" +
    '<div class="sub">' + t("sc.points") + "</div></div>" +
    '<div style="margin:9px 0">' + bar(r.score, tone) + "</div>" +
    '<div style="font-size:15px">' +
    ADVICE(r.verdict, r.dup) + "</div>" +
    /* 冷静期只是个信息提示，塞在右下角就够了 —— 单独占一张卡不值 */
    (corner ? '<div class="sub" style="font-size:11px;text-align:right;margin-top:7px">' +
      corner + "</div>" : "") + "</div>";
}

/* 分数不只属于这件东西 —— 预算和模式一变，同一件东西的灯色就会变 */
function snapNote(snap, r, b) {
  if (!snap) return "";
  if (snap.verdict === r.verdict && Math.abs(snap.score - r.score) < 0.05) return "";
  const why = [];
  const modeName = (save) => t(save ? "set.modeSave" : "set.modeComfort");
  if (snap.saveMode !== S.saveMode) why.push(t("sn.modeChanged",
    { from: modeName(snap.saveMode), to: modeName(S.saveMode) }));
  if (snap.budget !== b) why.push(t("sn.budgetChanged",
    { from: yuan(snap.budget), to: yuan(b), down: b < snap.budget }));
  const worse = r.score < snap.score;
  return '<div class="banner" style="border-color:var(--ink-faint);background:var(--sunken)">' +
    '<span style="margin-top:1px;color:' + (worse ? RED : GREEN) + '">' +
    ic(worse ? "warn" : "check", 15) + "</span><div>" + t("sn.was", {
      before: lampOf(snap.verdict) + " " + t("sc.pointsN", { n: snap.score.toFixed(1) }),
      after: lampOf(r.verdict) + " " + t("sc.pointsN", { n: r.score.toFixed(1) }) }) +
    (why.length ? '<br/><span class="sub">' + why.join(t("sn.sep")) + "</span>" : "") +
    "</div></div>";
}

/* 算式默认收起：一行说清主要扣在哪，想看细的再展开。
   原来那张 6 行的表格占了小半屏，而它回答的只是「凭什么」这一个问题。 */
function mainReason(it, r) {
  const parts = [
    ["price", r.incomePenalty, t("re.price", { pct: r.ratio.toFixed(1) })],
    ["dup", r.dupPenalty, t("re.dup")],
    ["mode", r.modePenalty, t("re.mode", { save: S.saveMode })],
  ].sort((a, b2) => b2[1] - a[1]);
  const top = parts[0];
  /* 相对基础分看，绝对值没意义：预算两千多的时候，任何价格都会扣掉一点 */
  const total = r.incomePenalty + r.dupPenalty + r.modePenalty;
  if (total < r.base * 0.05) return t("re.almostNone", { n: it.necessity });
  /* 扣分超过基础分时，报一个比基础分还大的数会让人算不明白，直接说「扣穿了」 */
  if (top[1] > r.base) return t("re.blownOut", { what: top[2] });
  return t("re.mainly", { what: top[2], n: top[1].toFixed(1) });
}

function breakdownCard(it, r, b) {
  const rows = [[t("bd.base", { n: it.necessity }), "+" + r.base.toFixed(1)],
    [t("bd.priceRow", { pct: r.ratio.toFixed(2), mult: S.saveMode ? "4.0" : "1.5" }),
      "−" + r.incomePenalty.toFixed(1)],
    [t("bd.dupRow", { dup: it.dup }), "−" + r.dupPenalty.toFixed(1)],
    [t("bd.modeRow", { save: S.saveMode }), "−" + r.modePenalty.toFixed(1)]];
  return '<div style="padding:0 2px">' +
    '<div style="font-size:14px">' + esc(it.name) + "　" +
    '<span class="money">' + yuan(it.price) + "</span></div>" +
    '<div class="sub" style="font-size:11px;margin-top:2px">' + t("bd.meta", {
      n: it.necessity, mode: t(S.saveMode ? "set.modeSave" : "set.modeComfort"),
      budget: yuan(b) }) + "</div>" +
    '<div style="display:flex;align-items:flex-start;gap:8px;margin-top:7px">' +
    '<div class="sub" style="flex:1;font-size:12px">' + mainReason(it, r) + "</div>" +
    '<div class="sub" data-a="toggleCalc" style="cursor:pointer;color:var(--accent);' +
    'white-space:nowrap;font-size:12px">' +
    (ui.showCalc ? t("word.collapse") : t("bd.how")) +
    ic("chev", 12) + "</div></div>" +
    (ui.showCalc ? '<div class="card" style="margin-top:8px;padding:8px 12px">' +
      rows.map((x) => '<div style="display:flex;justify-content:space-between;font-size:12px;' +
        'padding:5px 0;border-bottom:1px dotted var(--line)"><span class="sub">' + x[0] +
        '</span><span class="money">' + x[1] + "</span></div>").join("") +
      '<div style="display:flex;justify-content:space-between;font-size:13px;padding:7px 0 0;' +
      'font-weight:600"><span>' + t("bd.total") + '</span><span class="money">' +
      t("sc.pointsN", { n: r.score.toFixed(1) }) + "</span></div></div>" : "") + "</div>";
}

const actionStack = (btns) => '<div style="display:flex;flex-direction:column;gap:9px;' +
  'margin-top:4px">' + btns.map(([l, a, cls], i) =>
    '<div class="mbtn ' + (cls || (i === 0 ? "pri" : "sm")) + '" data-a="' + a + '">' + l +
    "</div>").join("") + "</div>";

/* --- 种草：测一件新东西，也是「重新测试」的编辑器 --------------------- */
/* 预算这块要老实交代自己是怎么算出来的，尤其是退档的时候 */
function budgetBanner() {
  const bi = budgetInfo(S);
  if (bi.tier === "ok") return '<div class="banner" style="border-color:var(--ink-faint);' +
    'background:var(--sunken)"><div>' + t("bg.ok") + ' <b class="money">' + yuan(bi.amount) +
    '</b><br/><span class="sub">' + t("bg.okHow") + "</span></div></div>";
  if (bi.tier === "planTooBig") return '<div class="banner tap" data-a="toSavings2" ' +
    'style="border-color:' + AMBER + ";background:" + AMBER_BG + '">' +
    '<span style="color:' + AMBER + ';margin-top:1px">' + ic("warn", 15) + "</span>" +
    '<div style="flex:1">' + t("bg.ok") + ' <b class="money">' + yuan(bi.amount) + "</b>" +
    '<span class="sub">' + t("bg.noSave") + '</span><br/><span class="sub">' +
    t("bg.planTooBig", { income: yuan(bi.income), bills: yuan(bi.bills),
      save: yuan(bi.save) }) + "</span></div>" +
    '<span style="color:var(--ink-muted);margin-top:2px">' + ic("chev", 14) + "</span></div>";
  return '<div class="banner tap" data-a="route:out" style="border-color:' + RED +
    ";background:" + RED_BG + '"><span style="color:' + RED + ';margin-top:1px">' +
    ic("warn", 15) + '</span><div style="flex:1">' + t("bg.billsTooBig", {
      bills: yuan(bi.bills), income: yuan(bi.income),
      pct: Math.round(FLOOR_RATIO * 100), bills2: BILLS() }) + "</div>" +
    '<span style="color:var(--ink-muted);margin-top:2px">' + ic("chev", 14) + "</span></div>";
}

/* --- 刚测完的结果页（东西还不在清单里） ------------------------------- */
SCREENS.verdict = () => {
  const it = ui.quiz, { r, b } = liveVerdict(it);
  const exists = S.wishlist.find((w) => w.name.trim() === it.name.trim());
  const A = { buy: [t("vd.buyNow"), "buyNow"], plan: [t("vd.startPlan"), "startPlan"],
    park: [t("vd.park"), "park"], retest: [t("de.retest"), "decisions"] };
  const acts = r.verdict === "green" ? [A.buy, A.plan, A.park, A.retest]
    : r.verdict === "amber" ? [A.park, A.plan, A.retest]
      : [A.plan, A.park, A.retest];
  return { tab: "decisions",
    nav: navBack() + '<div class="navt" style="flex:1">' + t("vd.title") + "</div>",
    body: scoreCard(Object.assign({}, r, { dup: it.dup })) + breakdownCard(it, r, b) +
      (exists ? '<div class="banner tap" data-a="wishItem:' + exists.id +
        '" style="border-color:var(--ink-faint);background:var(--sunken)"><div style="flex:1">' +
        t("vd.already", { name: esc(it.name) }) + "</div>" +
        '<span style="color:var(--ink-muted)">' + ic("chev", 14) + "</span></div>" : "") +
      actionStack(acts) };
};

/* --- 清单：卡片是纯链接，动作都在详情页 ------------------------------- */
SCREENS.wishlist = () => {
  const tab = ui.seg.wish || "active";
  const cards = tab === "active"
    ? S.wishlist.map((w) => {
        const p = planOf(w.id), { r } = liveVerdict(w);
        const tone = TONE(r.verdict)[0];
        const pct = p ? (p.raised / p.target) * 100
          : cooled(w) ? 100 : ((w.cooldownHours - hoursLeft(w)) / w.cooldownHours) * 100;
        const state = p
          ? ic("tag", 13) + " " + t("wl.planState", { raised: yuan(p.raised),
              left: yuan(Math.max(0, p.target - p.raised)) })
          : cooled(w) ? t("wl.cooledDone") : t("wl.coolingLeft", { h: hoursLeft(w) });
        return '<div class="card tap srt" data-sg="wish" data-si="' + w.id +

          '<div class="h2" style="flex:1">' + esc(w.name) + "</div>" +
          '<div class="num money">' + yuan(w.price) + "</div></div>" +
          /* 进度条说的是「过了多久 / 攒了多少」，不是灯色 —— 灯色由圆点负责 */
          '<div style="margin:9px 0">' + bar(pct) + "</div>" +
          '<div class="sub" style="display:flex;align-items:center;gap:5px">' +
          '<span style="flex:1">' + state + "</span>" +
          '<span style="color:var(--ink-faint)">' + ic("chev", 14) + "</span></div></div>";
      }).join("")
    : S.archive.map((a) => '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
        '<div class="h2" style="color:var(--ink)">' + esc(a.name) + "</div>" +
        '<div class="num money" style="color:var(--ink-muted)">' + yuan(a.price) + "</div></div>" +

};

/* --- 清单详情 = 结果页 + 状态（冷静期 / 攒物计划） --------------------- */

    return { tab: "decisions", nav,

        '<div style="margin-bottom:8px">' + bar(100, GREEN) + "</div>" +

          n: p.sales.length, surplus: surplus > 0 ? yuan(surplus) : "" }) + "</div></div>" +

          { name: esc(p.name), n: p.necessityThen }) + "</div>" +
        '<input type="range" min="1" max="10" step="1" data-f="renec" value="' + nowN + '">' +
        '<div class="sub" style="display:flex;justify-content:space-between">' +
        "<span>" + t("de.necLow") + '</span><span class="money">' + nowN +
        " / 10</span></div>" +
        '<div class="sub" style="margin-top:8px">' + (drop > 0

      '<div class="sub money">' + yuan(p.raised) + " / " + yuan(p.target) + "</div></div>" +

      (p.sales.length ? '<div style="margin-top:6px">' + p.sales.slice().reverse()

          yuan(x.amount) + "</span></div>").join("") + "</div>" : "") + "</div>"
    : "";

  const acts = p
    ? [[ic("plus", 17) + " " + t("wi.logSale"), "logSale"],
       [t("wi.buyAnyway"), "buyDuringPlan"],
       [t("de.retest"), "retest"], [t("wi.dropPlan"), "planAbandon"]]
    /* 冷静期没走完时「仍然要买」是灰的，主按钮让给真能做的事 */
    : cooled(w)
      ? [[t("wi.buyStill"), "buyWish:" + w.id], [t("wi.startPlan"), "startPlanFor"],
         [t("de.retest"), "retest"], [t("wi.drop"), "dropWish:" + w.id]]
      : [[t("wi.startPlan"), "startPlanFor"],
         [t("wi.buyTooSoon"), "tooSoon", "sm off"],
         [t("de.retest"), "retest"], [t("wi.drop"), "dropWish:" + w.id]];
  return { tab: "decisions", nav,
    body: scoreCard(Object.assign({}, r, { dup: w.dup }), cooldownNote) +
      snapNote(w.snap, r, b) + breakdownCard(w, r, b) + state + actionStack(acts) };
};

  ? '<div class="errline"><span style="margin-top:2px">' + ic("warn", 14) + "</span><div>" +

const jarOpts = () => S.accounts.filter((a) => !a.earmark).map((a) => a.name);

const SHEETS = {};

/* 语音输入：用浏览器自带的识别（iOS Safari / Chrome 都有）。
   拿不到就退回打字 —— 解析本来就是对文本做的，说和打进来是同一条路。
   注意要 https，file:// 和局域网 http 上浏览器直接不给权限。 */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* let 不是 const：自动化测试需要把它临时当成「可用」来验空状态的文案 */
let micOK = () => !!SR && (location.protocol === "https:" ||
  ["localhost", "127.0.0.1"].indexOf(location.hostname) >= 0);
let rec = null;
/* 一次「说话」是由好几段识别拼起来的：iOS 只要静音就把 session 掐掉，
   所以停顿之后要自己接上。base 是这次开口之前框里已有的字，
   done 是这一轮已经收尾的句子，live 是还在变的那一句。 */
let micBase = "", micDone = "", micQuiet = 0;

function micStop() {
  micQuiet = 99;                       /* 让 onend 别再自动接上 */
  if (rec) { try { rec.stop(); } catch (err) { /* 已经停了 */ } rec = null; }
  ui.listening = false;
}
function micText(live) {
  return [micBase, micDone, live].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
}
function micPaint(live) {
  ui.f.text = micText(live);
  /* 不整页重绘 —— 那会把抽屉重建一遍，动画也重放 */
  const ta = document.querySelector('.sheet [data-f="text"]');
  if (ta) ta.value = ui.f.text;
}
function micSession() {
  rec = new SR();
  rec.lang = isEn() ? "en-GB" : "zh-CN";
  rec.interimResults = true;
  /* 说到一半停顿一下就被切断，是「它没听全」最常见的原因 */
  rec.continuous = true;
  /* 引擎本来就会给好几个候选，只拿 [0] 是白白丢掉信息 */
  rec.maxAlternatives = 5;
  rec.onresult = (ev) => {
    let live = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r2 = ev.results[i];
      if (r2.isFinal) {
        /* 让解析器在候选里投票：能解析出金额的那条才是对的 */
        const cands = [];
        for (let k = 0; k < r2.length; k++) cands.push(r2[k].transcript);
        micDone = (micDone + " " + pickBest(cands)).trim();
        micQuiet = 0;
      } else live += r2[0].transcript;
    }
    micPaint(live);
  };
  rec.onerror = (ev) => {
    /* no-speech / aborted 是「刚才没人说话」，不是坏事 —— 别弹错误，接着听 */
    if (ev.error === "no-speech" || ev.error === "aborted") return;
    ui.f.err = ev.error === "not-allowed" || ev.error === "service-not-allowed"
      ? t("as.micDenied") : t("as.noMic");
    micQuiet = 99; rec = null; ui.listening = false; render();
  };
  rec.onend = () => {
    rec = null;
    if (!ui.listening) return;
    /* 连着三段都没听到东西就收工，免得麦克风一直开着空转 */
    if (++micQuiet > 3) {
      ui.listening = false;
      if (!micText("")) ui.f.err = t("as.micNothing");
      return render();
    }
    try { micSession(); } catch (err) { ui.listening = false; render(); }
  };
  rec.start();
}
function micStart() {
  if (ui.listening) return micStop(), render();
  if (!SR) { ui.f.err = t("as.noMic"); return render(); }
  if (!micOK()) { ui.f.err = t("as.micHttp"); return render(); }
  micBase = (ui.f.text || "").trim(); micDone = ""; micQuiet = 0;
  try { micSession(); ui.listening = true; ui.f.err = null; render(); }
  catch (err) { rec = null; ui.listening = false; ui.f.err = t("as.noMic"); render(); }
}
